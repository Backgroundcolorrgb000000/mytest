                        )}
                    </div>

                    <div className="fixed bottom-0 w-full max-w-md p-4 bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 transition-colors z-50">
                        {messages.length === 1 && (
                            <div className="mb-4 space-y-2">
                                <p className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2">Примеры вопросов:</p>
                                {['Проанализируй мои расходы', 'Как мне накопить деньги?', 'Где я больше всего трачу?'].map(q => (
                                    <button key={q} onClick={() => sendPrompt(q)} className="block w-full text-left px-4 py-2 text-sm text-primary border border-primary/30 rounded-xl hover:bg-primary/5 transition-colors">
                                        {q}
                                    </button>
                                ))}
                            </div>
                        )}
                        <div className="flex items-center gap-2">
                            <input type="text" value={inputText} onChange={(e) => setInputText(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && sendPrompt(inputText)} placeholder="Спросите Gemini..." className="flex-1 bg-gray-100 dark:bg-gray-800 text-textDark dark:text-white rounded-full px-4 py-3 text-sm focus:outline-none transition-colors" />
                            <button onClick={() => sendPrompt(inputText)} className="w-11 h-11 bg-primary text-white rounded-full flex items-center justify-center shadow-md">
                                <i className="fa-solid fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenProfile = ({ user, isDarkMode, toggleDarkMode, transactions, isPremium, openPaywall }) => {
            const userName = (user && user.first_name) ? `${user.first_name} ${user.last_name || ''}`.trim() : 'Ильхом';
            const username = (user && user.username) ? `@${user.username}` : '@ilkhom_finance';
            const userPhoto = (user && user.photo_url) ? user.photo_url : `https://placehold.co/150x150/7C3AED/ffffff?text=${userName.charAt(0)}`;

            return (
                <div className="bg-[#F3F4F6] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 transition-colors duration-300">
                    <TopHeader title="Профиль" rightIcon="fa-gear" />
                    
                    <div className="bg-white dark:bg-gray-900 px-4 py-6 mb-2 flex items-center gap-4 transition-colors duration-300">
                        <img src={userPhoto} alt="Аватар" className="w-16 h-16 rounded-full border-2 border-primaryLight shadow-sm object-cover" />
                        <div>
                            <h2 className="text-xl font-bold text-textDark dark:text-white transition-colors duration-300 flex items-center gap-2">
                                {userName} {isPremium && <i className="fa-solid fa-crown text-yellow-500 text-sm"></i>}
                            </h2>
                            <p className="text-gray-500 dark:text-gray-400 text-sm font-medium transition-colors">{username}</p>
                        </div>
                    </div>

                    {!isPremium && (
                        <div className="px-4 py-2 mb-2" onClick={openPaywall}>
                            <div className="bg-gradient-to-r from-gray-900 to-indigo-900 rounded-2xl p-4 flex items-center justify-between shadow-md relative overflow-hidden cursor-pointer transform transition-transform hover:scale-[1.02]">
                                <i className="fa-solid fa-gem absolute -right-4 -bottom-4 text-white opacity-10 text-6xl transform -rotate-12"></i>
                                <div className="flex items-center gap-3 relative z-10">
                                    <div className="w-10 h-10 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-full flex items-center justify-center text-white shadow-lg">
                                        <i className="fa-solid fa-crown text-sm"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-white text-sm">FinanceAI PRO</h3>
                                        <p className="text-xs text-gray-300 mt-0.5">Разблокировать все функции</p>
                                    </div>
                                </div>
                                <i className="fa-solid fa-chevron-right text-white opacity-50"></i>
                            </div>
                        </div>
                    )}

                    <div className="bg-white dark:bg-gray-900 px-4 py-2 space-y-1 transition-colors duration-300 mt-2">
                        {[
                            { id: 'theme', icon: 'fa-moon', title: 'Темная тема', value: isDarkMode ? 'Вкл' : 'Выкл', color: 'text-indigo-500 dark:text-indigo-400', bg: 'bg-indigo-100 dark:bg-indigo-900/30' },
                            { id: 'lang', icon: 'fa-globe', title: 'Язык', value: 'Русский', color: 'text-blue-500 dark:text-blue-400', bg: 'bg-blue-100 dark:bg-blue-900/30' },
                            { id: 'currency', icon: 'fa-coins', title: 'Основная валюта', value: 'UZS', color: 'text-emerald-500 dark:text-emerald-400', bg: 'bg-emerald-100 dark:bg-emerald-900/30' }
                        ].map((item, i) => (
                            <div key={i} onClick={() => { if(item.id==='theme') toggleDarkMode(); }} className="flex items-center justify-between py-3.5 border-b border-gray-50 dark:border-gray-800/50 last:border-0 active:bg-gray-50 dark:active:bg-gray-800 transition-colors cursor-pointer">
                                <div className="flex items-center gap-4">
                                    <div className={`w-9 h-9 rounded-full flex items-center justify-center ${item.bg} ${item.color} transition-colors`}>
                                        <i className={`fa-solid ${item.icon} text-sm`}></i>
                                    </div>
                                    <span className="text-textDark dark:text-white font-bold text-sm transition-colors flex items-center gap-2">
                                        {item.title} {item.lock && <i className="fa-solid fa-lock text-gray-400 text-[10px]"></i>}
                                    </span>
                                </div>
                                <div className="flex items-center gap-2">
                                    {item.value && <span className="text-xs font-medium text-gray-400">{item.value}</span>}
                                    <i className="fa-solid fa-chevron-right text-gray-300 dark:text-gray-600 text-xs transition-colors"></i>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentScreen, setCurrentScreen] = useState('home');
            const [isAddingMode, setIsAddingMode] = useState(false);
            const [addingTab, setAddingTab] = useState('expense');
            const [isLoading, setIsLoading] = useState(false);
            const [isSplashVisible, setIsSplashVisible] = useState(true);
            const [transactions, setTransactions] = useState([]);
            const [isPremium, setIsPremium] = useState(false);
            const [tgUser, setTgUser] = useState(null);
            const [selectedTransaction, setSelectedTransaction] = useState(null);
            const [activeMonth, setActiveMonth] = useState('05.2026');
            const [showPaywall, setShowPaywall] = useState(false);
            const [selectedPlan, setSelectedPlan] = useState('year');

            const [categories, setCategories] = useState(() => {
                const saved = localStorage.getItem('finance_categories');
                return saved ? JSON.parse(saved) : [
                    { name: 'Продукты', icon: 'fa-basket-shopping', colorClass: CATEGORY_COLORS[1], limit: null },
                    { name: 'Транспорт', icon: 'fa-bus', colorClass: CATEGORY_COLORS[4], limit: null },
                    { name: 'Еда вне дома', icon: 'fa-utensils', colorClass: CATEGORY_COLORS[2], limit: null },
                    { name: 'Развлечения', icon: 'fa-play', colorClass: CATEGORY_COLORS[15], limit: null }
                ];
            });

            const [debts, setDebts] = useState(() => {
                const saved = localStorage.getItem('finance_debts');
                return saved ? JSON.parse(saved) : [];
            });

            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('financeAppTheme') === 'dark');

            useEffect(() => {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.expand();
                }
                
                if (isDarkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('financeAppTheme', 'dark'); } 
                else { document.documentElement.classList.remove('dark'); localStorage.setItem('financeAppTheme', 'light'); }
            }, [isDarkMode]);

            useEffect(() => { localStorage.setItem('finance_categories', JSON.stringify(categories)); }, [categories]);
            useEffect(() => { localStorage.setItem('finance_debts', JSON.stringify(debts)); }, [debts]);

            useEffect(() => {
                const saved = localStorage.getItem('finance_txs');
                if (saved) {
                    setTransactions(JSON.parse(saved));
                } else {
                    const t = [];
                    let id = 1;
                    const generateDemoDataForMonth = (m, y) => {
                        t.push({ id: id++, title: 'Зарплата', category: 'Доход', wallet: 'card', amount: 6500000, date: `10.${m}.${y} 10:00`, icon: 'fa-briefcase', color: 'text-green-500', bg: 'bg-green-100' });
                        t.push({ id: id++, title: 'Яндекс Такси', category: 'Транспорт', wallet: 'card', amount: -25000, date: `15.${m}.${y} 18:30`, icon: 'fa-bus', color: 'text-blue-500', bg: 'bg-blue-100' });
                        t.push({ id: id++, title: 'Яндекс Такси', category: 'Транспорт', wallet: 'card', amount: -32000, date: `16.${m}.${y} 19:00`, icon: 'fa-bus', color: 'text-blue-500', bg: 'bg-blue-100' });
                        t.push({ id: id++, title: 'Кофейня', category: 'Еда вне дома', wallet: 'cash', amount: -45000, date: `12.${m}.${y} 09:00`, icon: 'fa-utensils', color: 'text-amber-500', bg: 'bg-amber-100' });
                        t.push({ id: id++, title: 'Кофейня', category: 'Еда вне дома', wallet: 'card', amount: -55000, date: `18.${m}.${y} 13:00`, icon: 'fa-utensils', color: 'text-amber-500', bg: 'bg-amber-100' });
                        t.push({ id: id++, title: 'Супермаркет Korzinka', category: 'Продукты', wallet: 'card', amount: -150000, date: `20.${m}.${y} 20:00`, icon: 'fa-basket-shopping', color: 'text-orange-500', bg: 'bg-orange-100' });
                    };
                    generateDemoDataForMonth('04', '2026');
                    generateDemoDataForMonth('05', '2026');
                    const sortedTxs = t.sort((a,b) => b.id - a.id);
                    setTransactions(sortedTxs);
                    localStorage.setItem('finance_txs', JSON.stringify(sortedTxs));
                }
                setTimeout(() => setIsSplashVisible(false), 2000);
            }, []);

            const currentMonthTransactions = transactions.filter(t => {
                const parts = t.date.split(' ');
                if(!parts[0]) return false;
                const dmy = parts[0].split('.');
                return `${dmy[1]}.${dmy[2]}` === activeMonth;
            });

            const prevMonth = () => { let [m, y] = activeMonth.split('.'); m = parseInt(m)-1; if(m<1){m=12;y=parseInt(y)-1;} setActiveMonth(`${m.toString().padStart(2,'0')}.${y}`); };
            const nextMonth = () => { let [m, y] = activeMonth.split('.'); m = parseInt(m)+1; if(m>12){m=1;y=parseInt(y)+1;} setActiveMonth(`${m.toString().padStart(2,'0')}.${y}`); };

            const handleSaveTx = (tx) => {
                const d = new Date();
                const ds = `${d.getDate().toString().padStart(2,'0')}.${(d.getMonth()+1).toString().padStart(2,'0')}.${d.getFullYear()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
                const newTxs = [{...tx, id: Date.now(), date: ds}, ...transactions];
                setTransactions(newTxs);
                localStorage.setItem('finance_txs', JSON.stringify(newTxs));
                setIsAddingMode(false);
            };

            const handleDeleteTx = (id) => {
                const newTxs = transactions.filter(t => t.id !== id);
                setTransactions(newTxs);
                localStorage.setItem('finance_txs', JSON.stringify(newTxs));
                setSelectedTransaction(null);
                triggerHaptic('medium');
            };

            const openAddModal = (tabType) => {
                setAddingTab(tabType);
                setIsAddingMode(true);
            };

            const renderScreen = () => {
                switch(currentScreen) {
                    case 'home': return <ScreenHome setScreen={setCurrentScreen} transactions={currentMonthTransactions} activeMonth={activeMonth} prevMonth={prevMonth} nextMonth={nextMonth} currency="UZS" rates={{USD:12650, EUR:13600}} onTransactionClick={setSelectedTransaction} openAddModal={openAddModal} />;
                    case 'analytics': return <ScreenAnalytics transactions={currentMonthTransactions} activeMonth={activeMonth} prevMonth={prevMonth} nextMonth={nextMonth} currency="UZS" rates={{USD:12650, EUR:13600}} onTransactionClick={setSelectedTransaction} />;
                    case 'calculator': return <ScreenCalculator onBack={() => setCurrentScreen('home')} debts={debts} setDebts={setDebts} />;
                    case 'categories': return <ScreenCategories onBack={() => setCurrentScreen('home')} categories={categories} setCategories={setCategories} isPremium={isPremium} openPaywall={() => setShowPaywall(true)} transactions={currentMonthTransactions} />;
                    case 'tips': return <ScreenTips openAIChat={() => setCurrentScreen('aichat')} />;
                    case 'aichat': return <ScreenAIChat onBack={() => setCurrentScreen('tips')} userId={tgUser ? tgUser.id : 'browser'} />;
                    case 'profile': return <ScreenProfile user={tgUser} isDarkMode={isDarkMode} toggleDarkMode={() => setIsDarkMode(!isDarkMode)} transactions={transactions} isPremium={isPremium} openPaywall={() => setShowPaywall(true)} />;
                    case 'product': return (
                        <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 z-50 relative transition-colors duration-300">
                            <TopHeader title="Динамика цен" showBack={true} onBack={() => setCurrentScreen('home')} rightIcon="fa-star" />
                            <div className="px-4 py-10 text-center text-gray-500">
                                <i className="fa-solid fa-chart-line text-6xl mb-4 text-primary opacity-50"></i>
                                <p>Здесь будет график изменения цен для выбранного продукта.</p>
                            </div>
                        </div>
                    );
                    default: return <ScreenHome setScreen={setCurrentScreen} transactions={currentMonthTransactions} activeMonth={activeMonth} prevMonth={prevMonth} nextMonth={nextMonth} currency="UZS" rates={{USD:12650, EUR:13600}} onTransactionClick={setSelectedTransaction} openAddModal={openAddModal} />;
                }
            };

            if (isSplashVisible) {
                return (
                    <div className="h-screen w-full bg-primary flex flex-col items-center justify-center text-white z-[100] relative">
                        <div className="w-24 h-24 bg-white rounded-3xl flex items-center justify-center shadow-2xl mb-6 animate-pulse text-primary text-5xl"><i className="fa-solid fa-wallet"></i></div>
                        <h1 className="text-3xl font-bold tracking-wide">Finance<span className="font-light">AI</span></h1>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto bg-bgLight dark:bg-bgDark min-h-screen relative shadow-2xl overflow-hidden transition-colors duration-300">
                    {renderScreen()}

                    {/* Модальное окно покупки PRO */}
                    {showPaywall && (
                        <div className="fixed inset-0 z-[100] flex items-end">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onClick={() => setShowPaywall(false)}></div>
                            <div className="bg-white dark:bg-gray-900 w-full rounded-t-3xl p-6 pb-12 relative z-10 animate-fade-in transition-colors max-h-[90vh] overflow-y-auto no-scrollbar">
                                <div className="w-12 h-1.5 bg-gray-200 dark:bg-gray-800 rounded-full mx-auto mb-6"></div>
                                <div className="text-center mb-6">
                                    <div className="w-20 h-20 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg shadow-orange-500/30 transform rotate-3">
                                        <i className="fa-solid fa-crown text-white text-4xl transform -rotate-3"></i>
                                    </div>
                                    <h2 className="text-2xl font-bold text-textDark dark:text-white mb-2">FinanceAI PRO</h2>
                                    <p className="text-sm text-gray-500 dark:text-gray-400 mb-6">Откройте все возможности для умного контроля финансов.</p>
                                    
                                    <div className="space-y-3 mb-6 text-left">
                                        <div onClick={() => {triggerHaptic('light'); setSelectedPlan('month');}} className={`p-4 rounded-2xl border-2 flex justify-between items-center cursor-pointer transition-colors ${selectedPlan === 'month' ? 'border-orange-500 bg-orange-50 dark:bg-orange-900/30' : 'border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/50'}`}>
                                            <div>
                                                <h4 className={`font-bold ${selectedPlan === 'month' ? 'text-orange-600 dark:text-orange-400' : 'text-textDark dark:text-white'}`}>1 Месяц</h4>
                                                <p className="text-xs text-gray-500 dark:text-gray-400">Базовый доступ</p>
                                            </div>
                                            <div className="text-right">
                                                <span className="font-bold text-lg text-textDark dark:text-white">50 ⭐️</span>
                                            </div>
                                        </div>

                                        <div onClick={() => {triggerHaptic('light'); setSelectedPlan('year');}} className={`p-4 rounded-2xl border-2 flex justify-between items-center cursor-pointer transition-colors relative ${selectedPlan === 'year' ? 'border-orange-500 bg-orange-50 dark:bg-orange-900/30' : 'border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/50'}`}>
                                            <div className="absolute -top-3 left-4 bg-gradient-to-r from-yellow-400 to-orange-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm">ВЫГОДНО</div>
                                            <div>
                                                <h4 className={`font-bold mt-1 ${selectedPlan === 'year' ? 'text-orange-600 dark:text-orange-400' : 'text-textDark dark:text-white'}`}>1 Год</h4>
                                                <p className="text-xs text-gray-500 dark:text-gray-400">~16 ⭐️ в месяц</p>
                                            </div>
                                            <div className="text-right">
                                                <span className="font-bold text-lg text-textDark dark:text-white">200 ⭐️</span>
                                                <p className="text-[10px] text-gray-400 line-through">600 ⭐️</p>
                                            </div>
                                        </div>

                                        <div onClick={() => {triggerHaptic('light'); setSelectedPlan('forever');}} className={`p-4 rounded-2xl border-2 flex justify-between items-center cursor-pointer transition-colors relative ${selectedPlan === 'forever' ? 'border-orange-500 bg-orange-50 dark:bg-orange-900/30' : 'border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/50'}`}>
                                             <div className="absolute -top-3 left-4 bg-gray-900 dark:bg-gray-700 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm">НАВСЕГДА</div>
                                            <div>
                                                <h4 className={`font-bold mt-1 ${selectedPlan === 'forever' ? 'text-orange-600 dark:text-orange-400' : 'text-textDark dark:text-white'}`}>Безлимит</h4>
                                                <p className="text-xs text-gray-500 dark:text-gray-400">Плати один раз</p>
                                            </div>
                                            <div className="text-right">
                                                <span className="font-bold text-lg text-textDark dark:text-white">500 ⭐️</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <button onClick={() => {
                                    triggerHaptic('success');
                                    setTimeout(() => {
                                        setIsPremium(true);
                                        setShowPaywall(false);
                                    }, 1500);
                                }} className="w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-orange-500/30 mb-3 hover:scale-[1.02] transition-transform">
                                    Оплатить {selectedPlan === 'month' ? 50 : selectedPlan === 'year' ? 200 : 500} ⭐️
                                </button>
                            </div>
                        </div>
                    )}

                    {selectedTransaction && (
                        <div className="fixed inset-0 z-[60] flex items-end">
                            <div className="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity" onClick={() => setSelectedTransaction(null)}></div>
                            <div className="bg-white dark:bg-gray-900 w-full rounded-t-3xl p-6 relative z-10 animate-fade-in transition-colors">
                                <div className="w-12 h-1.5 bg-gray-200 dark:bg-gray-800 rounded-full mx-auto mb-6"></div>
                                <div className="text-center mb-6">
                                    <div className={`w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-3 ${selectedTransaction.bg} dark:bg-opacity-20 ${selectedTransaction.color} text-2xl`}>
                                        {selectedTransaction.icon.startsWith('fa-') ? <i className={`fa-solid ${selectedTransaction.icon}`}></i> : <span>{selectedTransaction.icon}</span>}
                                    </div>
                                    <h3 className="text-xl font-bold text-textDark dark:text-white mb-1 transition-colors">{selectedTransaction.title}</h3>
                                    <p className="text-sm text-gray-500 dark:text-gray-400">{selectedTransaction.category} • {selectedTransaction.date}</p>
                                    <h2 className={`text-3xl font-bold mt-4 ${selectedTransaction.amount > 0 ? 'text-green-500' : 'text-textDark dark:text-white transition-colors'}`}>
                                        {selectedTransaction.amount > 0 ? '+' : ''}{formatMoneyInput(Math.abs(selectedTransaction.amount).toString())} сум
                                    </h2>
                                </div>
                                
                                {selectedTransaction.category === 'Продукты' && (
                                    <button onClick={() => { setCurrentScreen('product'); setSelectedTransaction(null); }} className="w-full bg-purple-50 text-primary dark:bg-purple-900/20 font-bold py-3.5 rounded-2xl mb-3 transition-colors">
                                        📈 Динамика цен продукта
                                    </button>
                                )}

                                <button onClick={() => handleDeleteTx(selectedTransaction.id)} className="w-full bg-red-50 text-red-500 dark:bg-red-900/20 font-bold py-3.5 rounded-2xl mb-4 transition-colors">Удалить операцию</button>
                                <button onClick={() => setSelectedTransaction(null)} className="w-full bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold py-3.5 rounded-2xl transition-colors">Закрыть</button>
                            </div>
                        </div>
                    )}

                    {isAddingMode && (
                        <AddTransactionModal 
                            close={() => setIsAddingMode(false)} 
                            saveTx={handleSaveTx} 
                            categories={categories} 
                            addCategory={(c) => setCategories([...categories, c])} 
                            isPremium={isPremium}
                            initialTab={addingTab}
                        />
                    )}

                    {currentScreen !== 'aichat' && currentScreen !== 'product' && (
                        <div className="fixed bottom-0 w-full max-w-md bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 px-6 py-2 flex justify-between items-center z-40 transition-colors duration-300">
                            <button onClick={() => setCurrentScreen('home')} className={`flex flex-col items-center p-2 transition-colors ${currentScreen === 'home' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-solid fa-house text-xl mb-1"></i><span className="text-[10px] font-medium">Главная</span></button>
                            <button onClick={() => setCurrentScreen('analytics')} className={`flex flex-col items-center p-2 transition-colors ${currentScreen === 'analytics' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-solid fa-chart-pie text-xl mb-1"></i><span className="text-[10px] font-medium">Отчеты</span></button>
                            <div className="relative -top-5">
                                <button onClick={() => openAddModal('expense')} className="w-14 h-14 bg-primary rounded-full flex items-center justify-center text-white text-2xl shadow-lg shadow-purple-500/40 transform hover:scale-105 transition-all"><i className="fa-solid fa-plus"></i></button>
                            </div>
                            <button onClick={() => setCurrentScreen('tips')} className={`flex flex-col items-center p-2 transition-colors ${currentScreen === 'tips' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-regular fa-lightbulb text-xl mb-1"></i><span className="text-[10px] font-medium">Советы</span></button>
                            <button onClick={() => setCurrentScreen('profile')} className={`flex flex-col items-center p-2 transition-colors ${currentScreen === 'profile' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-regular fa-user text-xl mb-1"></i><span className="text-[10px] font-medium">Профиль</span></button>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
