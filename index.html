<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinanceAI PRO</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#7C3AED', primaryLight: '#8B5CF6', primaryDark: '#5B21B6',
                        bgLight: '#F9FAFB', bgDark: '#030712', textDark: '#111827', cardDark: '#111827'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes pulse-ring { 0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(124, 58, 237, 0); } 100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); } }
        .animate-pulse-ring { animation: pulse-ring 2s infinite cubic-bezier(0.66, 0, 0, 1); }
        @keyframes scanline { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
        .animate-scanline { position: absolute; left: 0; width: 100%; height: 2px; background-color: #10B981; box-shadow: 0 0 10px #10B981, 0 0 20px #10B981; animation: scanline 2s linear infinite; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-bgLight dark:bg-bgDark transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const API_URL = 'https://mytest-production-6436.up.railway.app/api';

        const TOP_ICONS = [
            'fa-basket-shopping', 'fa-bus', 'fa-utensils', 'fa-play', 'fa-bag-shopping', 'fa-pills', 'fa-house', 'fa-car',
            'fa-plane', 'fa-dumbbell', 'fa-paw', 'fa-gamepad', 'fa-mug-hot', 'fa-scissors', 'fa-music', 'fa-book',
            'fa-shirt', 'fa-shoe-prints', 'fa-glasses', 'fa-baby-carriage', 'fa-graduation-cap', 'fa-laptop', 'fa-mobile',
            'fa-tv', 'fa-camera', 'fa-couch', 'fa-bed', 'fa-bath', 'fa-tooth', 'fa-screwdriver-wrench',
            'fa-gift', 'fa-motorcycle', 'fa-briefcase-medical', 'fa-burger', 'fa-pizza-slice', 'fa-ticket', 'fa-smoking',
            'fa-wine-glass', 'fa-martini-glass', 'fa-gas-pump', 'fa-train-subway', 'fa-bicycle', 'fa-palette', 'fa-camera-retro',
            'fa-headphones', 'fa-microphone', 'fa-guitar', 'fa-volleyball', 'fa-basketball', 'fa-futbol'
        ];

        const PREMIUM_EMOJIS = [
            '🍔','🍟','🥩','🍻','✈️','🏖️','🚗','⛽','📱','💻','🎮','🧸','🐾','🐕','⚽','🎿','🎨','🎸','🏥','💊','🛍️','👠','💍','👑','💸','🔥','✨','🚀','🎯','💡'
        ];

        const CATEGORY_COLORS = [
            { bg: 'bg-red-100', color: 'text-red-500', hex: '#EF4444' }, { bg: 'bg-orange-100', color: 'text-orange-500', hex: '#F97316' },
            { bg: 'bg-amber-100', color: 'text-amber-500', hex: '#F59E0B' }, { bg: 'bg-yellow-100', color: 'text-yellow-500', hex: '#EAB308' },
            { bg: 'bg-lime-100', color: 'text-lime-500', hex: '#84CC16' }, { bg: 'bg-green-100', color: 'text-green-500', hex: '#22C55E' },
            { bg: 'bg-emerald-100', color: 'text-emerald-500', hex: '#10B981' }, { bg: 'bg-teal-100', color: 'text-teal-500', hex: '#14B8A6' },
            { bg: 'bg-cyan-100', color: 'text-cyan-500', hex: '#06B6D4' }, { bg: 'bg-sky-100', color: 'text-sky-500', hex: '#0EA5E9' },
            { bg: 'bg-blue-100', color: 'text-blue-500', hex: '#3B82F6' }, { bg: 'bg-indigo-100', color: 'text-indigo-500', hex: '#6366F1' },
            { bg: 'bg-violet-100', color: 'text-violet-500', hex: '#8B5CF6' }, { bg: 'bg-pink-100', color: 'text-pink-500', hex: '#EC4899' }
        ];

        const PREMIUM_COLORS = [
            { bg: 'bg-gradient-to-br from-fuchsia-500 to-pink-500', color: 'text-white', hex: 'linear-gradient(to right, #d946ef, #ec4899)' },
            { bg: 'bg-gradient-to-br from-violet-500 to-purple-500', color: 'text-white', hex: 'linear-gradient(to right, #8b5cf6, #a855f7)' },
            { bg: 'bg-gradient-to-br from-blue-500 to-cyan-500', color: 'text-white', hex: 'linear-gradient(to right, #3b82f6, #06b6d4)' },
            { bg: 'bg-gradient-to-br from-emerald-500 to-teal-500', color: 'text-white', hex: 'linear-gradient(to right, #10b981, #14b8a6)' },
            { bg: 'bg-gradient-to-br from-orange-500 to-amber-500', color: 'text-white', hex: 'linear-gradient(to right, #f97316, #f59e0b)' },
            { bg: 'bg-gradient-to-br from-rose-500 to-red-500', color: 'text-white', hex: 'linear-gradient(to right, #f43f5e, #ef4444)' },
            { bg: 'bg-slate-800', color: 'text-white', hex: '#1e293b' },
            { bg: 'bg-gradient-to-br from-yellow-300 to-orange-400', color: 'text-gray-900', hex: 'linear-gradient(to right, #fde047, #fb923c)' }
        ];

        const IconRenderer = ({ icon, className }) => {
            if (!icon) return null;
            if (icon.startsWith('fa-')) {
                return <i className={`fa-solid ${icon} ${className || ''}`}></i>;
            }
            return <span className={`${className || ''} font-normal`}>{icon}</span>;
        };

        const triggerHaptic = (style = 'light') => {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred(style);
            }
        };

        const formatMoneyInput = (value) => {
            if (!value) return '';
            const num = value.toString().replace(/\D/g, '');
            return num.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        };

        const generate100Achievements = (transactions, goals) => {
            const list = [];
            const txCount = transactions.length;
            list.push({ name: 'Первый шаг', icon: '🌱', color: 'text-green-500', unlocked: txCount > 0 });
            list.push({ name: 'Инвестор', icon: '📈', color: 'text-blue-500', unlocked: goals.length > 0 });
            list.push({ name: 'Копилка', icon: '💰', color: 'text-yellow-500', unlocked: goals.some(g => g.current > 0) });
            list.push({ name: 'Ночная сова', icon: '🦉', color: 'text-indigo-400', unlocked: transactions.some(t => { const h = parseInt(t.date.split(' ')[1].split(':')[0]); return h >= 23 || h < 4; }) });
            const txLevels = [5, 10, 15, 20, 25, 30, 40, 50, 60, 70, 80, 90, 100, 120, 150, 200, 250, 300, 400, 500];
            txLevels.forEach(lvl => list.push({ name: `Мастер x${lvl}`, icon: '📝', color: 'text-purple-400', unlocked: txCount >= lvl }));
            let counter = list.length + 1;
            while(list.length < 100) {
                list.push({ name: `Уровень ${counter}`, icon: '⭐', color: 'text-yellow-400', unlocked: txCount >= (counter * 10) });
                counter++;
            }
            return list.sort((a, b) => (b.unlocked === a.unlocked) ? 0 : b.unlocked ? 1 : -1);
        };

        const generateDemoData = () => {
            const txs = [];
            let idCounter = Date.now();
            const places = {
                'Продукты': ['Korzinka', 'Makro', 'Базар', 'Korzinka', 'Корзинка у дома', 'Korzinka'],
                'Транспорт': ['Яндекс Такси', 'Метро', 'Автобус', 'Яндекс Такси', 'Такси', 'Яндекс Такси'],
                'Еда вне дома': ['Кофейня', 'Evos', 'KFC', 'Кофейня', 'Ресторан', 'Кофейня'],
                'Развлечения': ['Кинотеатр', 'Подписка Netflix', 'Кинотеатр', 'Парк', 'Подписка Netflix'],
                'Покупки': ['Zara', 'Техника', 'Zara', 'Одежда', 'Zara']
            };
            const colors = {
                'Продукты': {icon: 'fa-basket-shopping', bg: 'bg-orange-100', color: 'text-orange-500'},
                'Транспорт': {icon: 'fa-bus', bg: 'bg-blue-100', color: 'text-blue-500'},
                'Еда вне дома': {icon: 'fa-utensils', bg: 'bg-amber-100', color: 'text-amber-600'},
                'Развлечения': {icon: 'fa-play', bg: 'bg-pink-100', color: 'text-pink-500'},
                'Покупки': {icon: 'fa-bag-shopping', bg: 'bg-purple-100', color: 'text-purple-500'}
            };

            const now = new Date();
            for (let i = 0; i < 60; i++) {
                const date = new Date(now.getTime() - Math.floor(Math.random() * 90 * 24 * 60 * 60 * 1000));
                const catKeys = Object.keys(places);
                const category = catKeys[Math.floor(Math.random() * catKeys.length)];
                const title = places[category][Math.floor(Math.random() * places[category].length)];
                let baseAmount = category === 'Транспорт' ? 20000 : (category === 'Еда вне дома' ? 50000 : 150000);
                const amount = -(baseAmount + Math.floor(Math.random() * 5) * 5000);
                const dateString = date.getDate().toString().padStart(2, '0') + '.' + (date.getMonth() + 1).toString().padStart(2, '0') + ' ' + date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
                const walletAssigned = Math.random() > 0.3 ? 'card' : 'cash';

                txs.push({
                    id: idCounter--, userId: 'demo', title, category, amount,
                    icon: colors[category].icon, color: colors[category].color, bg: colors[category].bg,
                    date: dateString, rawDate: date.toISOString(), wallet: walletAssigned
                });
            }
            return txs.sort((a, b) => new Date(b.rawDate) - new Date(a.rawDate));
        };

        const TopHeader = ({ title, showBack = false, onBack, rightIcon = null, onRightClick = null }) => (
            <div className="flex justify-between items-center px-4 py-4 bg-bgLight dark:bg-bgDark sticky top-0 z-10 transition-colors duration-300">
                <div className="flex items-center gap-3">
                    {showBack && (
                        <button onClick={()=>{triggerHaptic('light'); onBack();}} className="w-8 h-8 flex items-center justify-center bg-white dark:bg-gray-800 rounded-full text-gray-600 dark:text-gray-300 hover:text-primary transition-colors shadow-sm">
                            <i className="fa-solid fa-arrow-left text-sm"></i>
                        </button>
                    )}
                    <h1 className="text-xl font-bold text-textDark dark:text-white transition-colors">{title}</h1>
                </div>
                {rightIcon && (
                    <button onClick={()=>{triggerHaptic('light'); if(onRightClick) onRightClick();}} className="w-8 h-8 flex items-center justify-center bg-white dark:bg-gray-800 rounded-full text-gray-600 dark:text-gray-300 hover:text-primary transition-colors shadow-sm">
                        <i className={`fa-solid ${rightIcon} text-sm`}></i>
                    </button>
                )}
            </div>
        );

        const ScreenPin = ({ onUnlock }) => {
            const [input, setInput] = useState('');
            const savedPin = localStorage.getItem('financeAppPin');
            const [error, setError] = useState(false);

            const handlePress = (num) => {
                triggerHaptic('light');
                if (input.length < 4) {
                    const newVal = input + num;
                    setInput(newVal);
                    if (newVal.length === 4) {
                        if (newVal === savedPin) {
                            triggerHaptic('success');
                            setTimeout(onUnlock, 200);
                        } else {
                            triggerHaptic('error');
                            setError(true);
                            setTimeout(() => { setInput(''); setError(false); }, 500);
                        }
                    }
                }
            };

            const handleDelete = () => {
                triggerHaptic('light');
                setInput(input.slice(0, -1));
            };

            return (
                <div className="fixed inset-0 bg-bgLight dark:bg-bgDark z-[100] flex flex-col items-center justify-center">
                    <div className="w-20 h-20 bg-primary/10 dark:bg-primary/20 rounded-full flex items-center justify-center mb-6">
                        <i className="fa-solid fa-lock text-3xl text-primary"></i>
                    </div>
                    <h2 className="text-2xl font-bold text-textDark dark:text-white mb-8">Введите ПИН-код</h2>
                    <div className={`flex gap-4 mb-12 ${error ? 'animate-bounce' : ''}`}>
                        {[0, 1, 2, 3].map(i => (
                            <div key={i} className={`w-4 h-4 rounded-full border-2 ${input.length > i ? 'bg-primary border-primary' : 'border-gray-300 dark:border-gray-600'}`}></div>
                        ))}
                    </div>
                    <div className="grid grid-cols-3 gap-6">
                        {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                            <button key={num} onClick={() => handlePress(num)} className="w-16 h-16 rounded-full bg-white dark:bg-gray-800 text-2xl font-bold text-textDark dark:text-white shadow-sm active:scale-95 transition-transform">{num}</button>
                        ))}
                        <div className="w-16 h-16"></div>
                        <button onClick={() => handlePress(0)} className="w-16 h-16 rounded-full bg-white dark:bg-gray-800 text-2xl font-bold text-textDark dark:text-white shadow-sm active:scale-95 transition-transform">0</button>
                        <button onClick={handleDelete} className="w-16 h-16 rounded-full bg-transparent text-xl text-textDark dark:text-white active:scale-95 transition-transform"><i className="fa-solid fa-delete-left"></i></button>
                    </div>
                </div>
            );
        };

        const ScreenHome = ({ setScreen, transactions, user, onTransactionClick, currencyRate, setAddMethod }) => {
            const userName = (user && user.first_name) ? user.first_name : 'Dima';
            const [activeWallet, setActiveWallet] = useState('all');

            const formatMoney = (num) => {
                const converted = Math.round(num * currencyRate.rate);
                return currencyRate.symbol + ' ' + converted.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
            };

            const getStats = (filterType) => {
                let baseIncome = 0;
                if (filterType === 'all') baseIncome = 12150000;
                if (filterType === 'card') baseIncome = 8400000;
                if (filterType === 'cash') baseIncome = 3750000;

                const txs = filterType === 'all' ? transactions : transactions.filter(t => (t.wallet || 'card') === filterType);
                const inc = txs.filter(t => t.amount > 0).reduce((acc, t) => acc + t.amount, 0) + baseIncome;
                const exp = txs.filter(t => t.amount < 0).reduce((acc, t) => acc + Math.abs(t.amount), 0);
                return { inc, exp, bal: inc - exp };
            };

            const globalStats = getStats('all');
            const cardStats = getStats('card');
            const cashStats = getStats('cash');

            const filteredTransactions = activeWallet === 'all' ? transactions : transactions.filter(t => (t.wallet || 'card') === activeWallet);

            return (
                <div className="pb-24 animate-fade-in">
                    <div className="px-5 pt-4 pb-2 flex justify-between items-center transition-colors">
                        <div>
                            <p className="text-xs text-gray-500 dark:text-gray-400 mb-0.5">Добрый день,</p>
                            <h2 className="text-2xl font-bold text-textDark dark:text-white">{userName}</h2>
                        </div>
                        <div className="w-10 h-10 bg-white dark:bg-gray-800 rounded-full flex items-center justify-center shadow-sm text-gray-600 dark:text-gray-300 relative transition-colors cursor-pointer" onClick={() => {triggerHaptic(); setScreen('profile');}}>
                            <i className="fa-regular fa-bell"></i>
                            <span className="absolute top-2 right-2 w-2.5 h-2.5 bg-red-500 border-2 border-white dark:border-gray-800 rounded-full"></span>
                        </div>
                    </div>

                    <div className="px-5 py-2 flex overflow-x-auto snap-x snap-mandatory no-scrollbar space-x-4">
                        <div onClick={() => {triggerHaptic('light'); setActiveWallet('all');}} className={`min-w-full snap-center rounded-[28px] p-6 text-white shadow-lg relative overflow-hidden flex-shrink-0 cursor-pointer transition-all duration-300 ${activeWallet === 'all' ? 'bg-gradient-to-br from-primary to-purple-600 ring-4 ring-primary/30 scale-100' : 'bg-gray-400 dark:bg-gray-800 scale-95 opacity-80'}`}>
                            <div className="absolute -right-6 -bottom-6 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl pointer-events-none"></div>
                            <div className="flex justify-between items-center mb-2 relative z-10">
                                <span className="text-sm font-medium text-white/90">Общий баланс</span>
                                {activeWallet === 'all' && <i className="fa-solid fa-circle-check text-white/90"></i>}
                            </div>
                            <h2 className="text-3xl font-bold mb-6 relative z-10 tracking-tight">{formatMoney(globalStats.bal)}</h2>
                            <div className="flex justify-between relative z-10">
                                <div>
                                    <p className="text-[11px] font-medium text-white/70 mb-0.5 uppercase tracking-wider">Доходы</p>
                                    <p className="font-bold text-sm">{formatMoney(globalStats.inc)}</p>
                                </div>
                                <div className="text-right">
                                    <p className="text-[11px] font-medium text-white/70 mb-0.5 uppercase tracking-wider">Расходы</p>
                                    <p className="font-bold text-sm">{formatMoney(globalStats.exp)}</p>
                                </div>
                            </div>
                        </div>

                        <div onClick={() => {triggerHaptic('light'); setActiveWallet('card');}} className={`min-w-full snap-center rounded-[28px] p-6 text-white shadow-lg relative overflow-hidden flex-shrink-0 cursor-pointer transition-all duration-300 ${activeWallet === 'card' ? 'bg-gray-900 ring-4 ring-gray-500/30 scale-100' : 'bg-gray-400 dark:bg-gray-800 scale-95 opacity-80'}`}>
                            <div className="absolute right-5 top-5 text-gray-500 text-xl font-bold italic pointer-events-none">UZCARD</div>
                            <div className="flex justify-between items-center mb-2 relative z-10">
                                <span className="text-sm font-medium text-gray-400">Зарплатная карта</span>
                                {activeWallet === 'card' && <i className="fa-solid fa-circle-check text-white/90"></i>}
                            </div>
                            <h2 className="text-3xl font-bold mb-8 relative z-10 tracking-tight">{formatMoney(cardStats.bal)}</h2>
                            <div className="flex justify-between items-end relative z-10">
                                <p className="font-mono tracking-widest text-sm text-gray-400">**** 4512</p>
                                <div className="w-8 h-8 rounded-full border border-gray-700 flex items-center justify-center bg-gray-800"><i className="fa-solid fa-chevron-right text-xs"></i></div>
                            </div>
                        </div>

                        <div onClick={() => {triggerHaptic('light'); setActiveWallet('cash');}} className={`min-w-full snap-center rounded-[28px] p-6 text-white shadow-lg relative overflow-hidden flex-shrink-0 cursor-pointer transition-all duration-300 ${activeWallet === 'cash' ? 'bg-gradient-to-br from-emerald-500 to-teal-600 ring-4 ring-emerald-500/30 scale-100' : 'bg-gray-400 dark:bg-gray-800 scale-95 opacity-80'}`}>
                            <i className="fa-solid fa-money-bill absolute -right-2 -bottom-2 text-white opacity-20 text-6xl pointer-events-none"></i>
                            <div className="flex justify-between items-center mb-2 relative z-10">
                                <span className="text-sm font-medium text-white/90">Наличные</span>
                                {activeWallet === 'cash' && <i className="fa-solid fa-circle-check text-white/90"></i>}
                            </div>
                            <h2 className="text-3xl font-bold mb-8 relative z-10 tracking-tight">{formatMoney(cashStats.bal)}</h2>
                            <div className="flex justify-between items-end relative z-10">
                                <p className="font-medium text-sm text-white/80">В кошельке</p>
                            </div>
                        </div>
                    </div>

                    <div className="flex justify-between px-6 py-5 max-w-sm mx-auto">
                        <div className="flex flex-col items-center gap-2 cursor-pointer group" onClick={() => {triggerHaptic(); setAddMethod('income');}}>
                            <div className="w-14 h-14 bg-blue-50 dark:bg-blue-900/30 rounded-2xl flex items-center justify-center text-blue-500 text-xl group-hover:scale-105 transition-transform"><i className="fa-solid fa-arrow-down"></i></div>
                            <span className="text-xs font-medium text-gray-600 dark:text-gray-400">Доход</span>
                        </div>
                        <div className="flex flex-col items-center gap-2 cursor-pointer group" onClick={() => {triggerHaptic(); setAddMethod('expense');}}>
                            <div className="w-14 h-14 bg-red-50 dark:bg-red-900/30 rounded-2xl flex items-center justify-center text-red-500 text-xl group-hover:scale-105 transition-transform"><i className="fa-solid fa-arrow-up"></i></div>
                            <span className="text-xs font-medium text-gray-600 dark:text-gray-400">Расход</span>
                        </div>
                        <div className="flex flex-col items-center gap-2 cursor-pointer group" onClick={() => {triggerHaptic(); setScreen('invest');}}>
                            <div className="w-14 h-14 bg-purple-50 dark:bg-purple-900/30 rounded-2xl flex items-center justify-center text-primary text-xl group-hover:scale-105 transition-transform"><i className="fa-solid fa-calculator"></i></div>
                            <span className="text-xs font-medium text-gray-600 dark:text-gray-400">Вклад</span>
                        </div>
                        <div className="flex flex-col items-center gap-2 cursor-pointer group" onClick={() => {triggerHaptic(); setScreen('categories');}}>
                            <div className="w-14 h-14 bg-emerald-50 dark:bg-emerald-900/30 rounded-2xl flex items-center justify-center text-emerald-500 text-xl group-hover:scale-105 transition-transform"><i className="fa-solid fa-layer-group"></i></div>
                            <span className="text-xs font-medium text-gray-600 dark:text-gray-400">Категории</span>
                        </div>
                    </div>

                    <div className="px-5 py-2">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-bold text-textDark dark:text-white transition-colors">
                                {activeWallet === 'all' ? 'Последние операции' : (activeWallet === 'card' ? 'Операции по карте' : 'Операции наличными')}
                            </h3>
                            <button onClick={() => {triggerHaptic(); setScreen('reports');}} className="text-sm font-medium text-primary hover:text-primaryDark">Все</button>
                        </div>
                        
                        <div className="space-y-3">
                            {filteredTransactions.length === 0 ? (
                                <p className="text-center text-sm text-gray-400 py-6">У вас пока нет транзакций.</p>
                            ) : filteredTransactions.slice(0, 5).map(t => (
                                <div key={t.id} onClick={() => {triggerHaptic('light'); onTransactionClick(t);}} className="flex items-center justify-between bg-white dark:bg-gray-900 p-3.5 rounded-2xl shadow-sm active:scale-[0.98] transition-all cursor-pointer">
                                    <div className="flex items-center gap-3.5">
                                        <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-xl ${t.bg} dark:bg-opacity-20 ${t.color}`}>
                                            <IconRenderer icon={t.icon} />
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-sm text-textDark dark:text-white transition-colors">{t.title}</h4>
                                            <p className="text-xs font-medium text-gray-500 dark:text-gray-400 transition-colors mt-0.5">{t.category}</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <p className={`font-bold text-sm ${t.amount > 0 ? 'text-green-500' : 'text-textDark dark:text-white transition-colors'}`}>
                                            {t.amount > 0 ? '+' : ''}{formatMoney(t.amount)}
                                        </p>
                                        <p className="text-[11px] font-medium text-gray-400 dark:text-gray-500 transition-colors mt-1">{t.date.split(' ')[0]}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenReports = ({ transactions, onTransactionClick, currencyRate }) => {
            const chartRef = useRef(null);
            const [expandedCategory, setExpandedCategory] = useState(null);
            const [expandedPlace, setExpandedPlace] = useState(null);

            const formatMoney = (num) => {
                const converted = Math.round(num * currencyRate.rate);
                return currencyRate.symbol + ' ' + converted.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
            };

            const expenses = transactions.filter(t => t.amount < 0);
            const totalExpense = expenses.reduce((acc, t) => acc + Math.abs(t.amount), 0);

            const categoryData = useMemo(() => {
                const data = {};
                expenses.forEach(t => {
                    if(!data[t.category]) data[t.category] = { total: 0, items: [], colorHex: t.color, bg: t.bg, icon: t.icon, textCol: t.color };
                    data[t.category].total += Math.abs(t.amount);
                    data[t.category].items.push(t);
                });
                return Object.entries(data).map(([name, val]) => ({
                    name, 
                    total: val.total, 
                    percent: totalExpense ? Math.round((val.total / totalExpense) * 100) : 0,
                    ...val
                })).sort((a, b) => b.total - a.total);
            }, [expenses, totalExpense]);

            const getHexColor = (colorClass) => {
                if(colorClass.includes('orange')) return '#F97316';
                if(colorClass.includes('blue')) return '#3B82F6';
                if(colorClass.includes('amber')) return '#F59E0B';
                if(colorClass.includes('pink')) return '#EC4899';
                if(colorClass.includes('green') || colorClass.includes('emerald')) return '#10B981';
                if(colorClass.includes('purple') || colorClass.includes('primary')) return '#7C3AED';
                if(colorClass.includes('cyan')) return '#06B6D4';
                return '#9CA3AF';
            };

            useEffect(() => {
                const ctx = document.getElementById('donutChart');
                if (ctx && categoryData.length > 0) {
                    if (chartRef.current) chartRef.current.destroy();
                    chartRef.current = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: categoryData.map(c => c.name),
                            datasets: [{
                                data: categoryData.map(c => c.total),
                                backgroundColor: categoryData.map(c => getHexColor(c.textCol)),
                                borderWidth: 0,
                                hoverOffset: 4
                            }]
                        },
                        options: {
                            cutout: '75%', responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { display: false }, tooltip: { enabled: false } }
                        }
                    });
                }
            }, [categoryData, expandedCategory]); 

            const renderGroupedItems = (catItems, catName) => {
                const grouped = {};
                catItems.forEach(t => {
                    const title = t.title.trim();
                    if(!grouped[title]) grouped[title] = { total: 0, count: 0, txs: [] };
                    grouped[title].total += Math.abs(t.amount);
                    grouped[title].count += 1;
                    grouped[title].txs.push(t);
                });

                return Object.entries(grouped).sort((a, b) => b[1].total - a[1].total).map(([title, group], i) => (
                    <div key={i} className="bg-white dark:bg-gray-900 rounded-xl mb-2 overflow-hidden shadow-sm transition-colors border border-gray-100 dark:border-gray-800">
                        <div 
                            className="flex justify-between items-center p-4 cursor-pointer active:bg-gray-50 dark:active:bg-gray-800"
                            onClick={() => {
                                triggerHaptic('light'); 
                                const id = `${catName}-${title}`;
                                setExpandedPlace(expandedPlace === id ? null : id);
                            }}
                        >
                            <div>
                                <h4 className="font-bold text-sm text-textDark dark:text-white">{title} <span className="text-xs text-gray-400 font-normal ml-1">x{group.count}</span></h4>
                            </div>
                            <div className="flex items-center gap-2">
                                <span className="font-bold text-sm text-textDark dark:text-white">{formatMoney(group.total)}</span>
                                <i className={`fa-solid fa-chevron-down text-xs text-gray-400 transition-transform ${expandedPlace === `${catName}-${title}` ? 'rotate-180' : ''}`}></i>
                            </div>
                        </div>
                        {expandedPlace === `${catName}-${title}` && (
                            <div className="pl-4 pr-3 pb-2 animate-fade-in bg-gray-50 dark:bg-gray-800/50">
                                <div className="border-l-2 border-gray-200 dark:border-gray-700 pl-3 space-y-4 pt-4 pb-2">
                                    {group.txs.map((t, idx) => {
                                        let diffElement = null;
                                        if (idx < group.txs.length - 1) {
                                            const prevT = group.txs[idx + 1]; 
                                            const currAmt = Math.abs(t.amount);
                                            const prevAmt = Math.abs(prevT.amount);
                                            if (currAmt !== prevAmt && prevAmt > 0) {
                                                const diffPerc = Math.round(((currAmt - prevAmt) / prevAmt) * 100);
                                                if (diffPerc > 0) {
                                                    diffElement = <span className="text-[10px] font-bold text-red-500 bg-red-100 dark:bg-red-900/30 px-1.5 py-0.5 rounded ml-2">↑ +{diffPerc}%</span>;
                                                } else if (diffPerc < 0) {
                                                    diffElement = <span className="text-[10px] font-bold text-green-500 bg-green-100 dark:bg-green-900/30 px-1.5 py-0.5 rounded ml-2">↓ {Math.abs(diffPerc)}%</span>;
                                                }
                                            }
                                        }
                                        return (
                                            <div key={t.id} onClick={() => {triggerHaptic('light'); onTransactionClick(t);}} className="flex justify-between items-center active:opacity-50 transition-opacity cursor-pointer">
                                                <div>
                                                    <p className="text-sm font-medium text-textDark dark:text-white flex items-center">{t.date.split(' ')[0]} {diffElement}</p>
                                                    <p className="text-xs text-gray-400">{t.date.split(' ')[1]}</p>
                                                </div>
                                                <span className="font-bold text-sm text-textDark dark:text-white">{formatMoney(Math.abs(t.amount))}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </div>
                ));
            };

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-24 transition-colors duration-300">
                    <TopHeader title="Отчет" rightIcon="fa-ellipsis" />
                    
                    <div className="flex items-center justify-center gap-4 py-2 mb-4">
                        <button className="text-primary w-8 h-8 rounded-full bg-white dark:bg-gray-900 shadow-sm flex items-center justify-center"><i className="fa-solid fa-arrow-left"></i></button>
                        <span className="font-bold text-textDark dark:text-white">Май, 2026</span>
                        <button className="text-gray-300 dark:text-gray-700 w-8 h-8 rounded-full bg-white dark:bg-gray-900 shadow-sm flex items-center justify-center" disabled><i className="fa-solid fa-arrow-right"></i></button>
                    </div>

                    <div className="relative w-64 h-64 mx-auto mb-8">
                        <canvas id="donutChart"></canvas>
                        <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                            <span className="text-sm text-gray-500 dark:text-gray-400 mb-1">Всего</span>
                            <span className="text-2xl font-bold text-textDark dark:text-white">{formatMoney(totalExpense)}</span>
                        </div>
                    </div>

                    <div className="px-5">
                        {categoryData.length === 0 ? (
                            <p className="text-center text-gray-400">Нет данных для отчета.</p>
                        ) : (
                            <div className="space-y-4">
                                {categoryData.map(cat => (
                                    <div key={cat.name}>
                                        <div 
                                            className="flex items-center justify-between cursor-pointer mb-2 active:opacity-70 transition-opacity p-2 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-900"
                                            onClick={() => {triggerHaptic('light'); setExpandedCategory(expandedCategory === cat.name ? null : cat.name);}}
                                        >
                                            <div className="flex items-center gap-3">
                                                <span className={`w-3 h-3 rounded-full`} style={{backgroundColor: getHexColor(cat.textCol)}}></span>
                                                <span className="font-bold text-sm text-textDark dark:text-white">{cat.name}</span>
                                            </div>
                                            <div className="flex items-center gap-4 text-right">
                                                <span className="font-bold text-sm text-textDark dark:text-white">{formatMoney(cat.total)}</span>
                                                <span className="text-xs font-mono text-gray-400 w-8 text-right">{cat.percent}%</span>
                                            </div>
                                        </div>
                                        {expandedCategory === cat.name && (
                                            <div className="animate-fade-in pl-6 pr-2 mb-6 mt-2 border-l-2 border-gray-100 dark:border-gray-800 ml-1.5">
                                                {renderGroupedItems(cat.items, cat.name)}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const ScreenCategories = ({ onBack, categories, setCategories }) => {
            const [showConfirm, setShowConfirm] = useState(null);

            const handleDeleteCategory = (catName) => {
                triggerHaptic('heavy');
                setCategories(categories.filter(c => c.name !== catName));
                setShowConfirm(null);
            };

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-24 transition-colors duration-300">
                    <TopHeader title="Категории" showBack={true} onBack={onBack} />
                    
                    <div className="px-5 py-4">
                        <p className="text-sm text-gray-500 dark:text-gray-400 mb-4 text-center">Управление вашими категориями</p>
                        <div className="space-y-3">
                            {categories.map((cat, i) => (
                                <div key={i} className="flex justify-between items-center bg-white dark:bg-gray-900 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 transition-colors">
                                    <div className="flex items-center gap-4">
                                        <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-xl ${cat.bg} dark:bg-opacity-20 ${cat.color}`} style={cat.hex && cat.hex.includes('gradient') ? {background: cat.hex, color: '#fff'} : {}}>
                                            <IconRenderer icon={cat.icon} />
                                        </div>
                                        <span className="font-bold text-textDark dark:text-white">{cat.name}</span>
                                    </div>
                                    {cat.isCustom && (
                                        <button onClick={() => setShowConfirm(cat.name)} className="w-10 h-10 flex items-center justify-center bg-red-50 text-red-500 rounded-xl hover:bg-red-100 transition-colors">
                                            <i className="fa-solid fa-trash-can text-sm"></i>
                                        </button>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>

                    {showConfirm && (
                        <div className="fixed inset-0 z-[80] flex items-center justify-center">
                            <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={() => setShowConfirm(null)}></div>
                            <div className="bg-white dark:bg-gray-900 w-5/6 max-w-sm rounded-3xl p-6 relative z-10 animate-fade-in text-center">
                                <div className="w-16 h-16 bg-red-100 dark:bg-red-900/30 rounded-full flex items-center justify-center text-red-500 text-3xl mx-auto mb-4">
                                    <i className="fa-solid fa-triangle-exclamation"></i>
                                </div>
                                <h3 className="text-xl font-bold text-textDark dark:text-white mb-2">Удалить категорию?</h3>
                                <p className="text-sm text-gray-500 dark:text-gray-400 mb-6">Категория "{showConfirm}" будет удалена из списка.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowConfirm(null)} className="flex-1 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold py-3.5 rounded-xl">Отмена</button>
                                    <button onClick={() => handleDeleteCategory(showConfirm)} className="flex-1 bg-red-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-red-500/30">Удалить</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ScreenInvest = ({ onBack, currencyRate, goals, setGoals, isPremium, setShowPaywall }) => {
            const [mainTab, setMainTab] = useState('calc'); 
            const [calcMode, setCalcMode] = useState('deposit');
            const [sum, setSum] = useState('10000000');
            const [percent, setPercent] = useState('18');
            const [months, setMonths] = useState('12');

            const [showAddGoal, setShowAddGoal] = useState(false);
            const [newGoal, setNewGoal] = useState({ title: '', target: '', months: '12', icon: 'fa-plane', color: CATEGORY_COLORS[10], iconType: 'icons' });

            const handleSumChange = (e) => setSum(e.target.value.replace(/\D/g, ''));
            
            const formatMoneyStr = (val) => {
                if(!val) return '0';
                const converted = Math.round(parseInt(val) * currencyRate.rate);
                return currencyRate.symbol + ' ' + converted.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
            };

            const calculate = () => {
                const S = parseInt(sum) || 0;
                const P = parseFloat(percent) || 0;
                const M = parseInt(months) || 0;
                
                if (calcMode === 'deposit') {
                    const profit = S * (P / 100) * (M / 12);
                    return { total: S + profit, profit: profit, monthly: profit / (M || 1) };
                } else {
                    if (P === 0) return { total: S, monthly: S / (M || 1), overpay: 0 };
                    const r = (P / 100) / 12;
                    const monthly = S * (r * Math.pow(1 + r, M)) / (Math.pow(1 + r, M) - 1);
                    const total = monthly * M;
                    return { total: total, monthly: monthly, overpay: total - S };
                }
            };

            const res = calculate();

            const handleAddGoalSubmit = (e) => {
                e.preventDefault();
                const targetNum = parseInt(newGoal.target.replace(/\D/g, ''));
                if(newGoal.title && targetNum) {
                    setGoals([...goals, {
                        id: Date.now(), title: newGoal.title, current: 0, target: targetNum,
                        months: parseInt(newGoal.months) || 12,
                        icon: newGoal.icon, bg: newGoal.color.bg, color: newGoal.color.color, hex: newGoal.color.hex
                    }]);
                    setShowAddGoal(false);
                }
            };

            const handleDeleteGoal = (id) => {
                triggerHaptic('heavy');
                setGoals(goals.filter(goal => goal.id !== id));
            };

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 z-50 relative transition-colors duration-300">
                    <TopHeader 
                        title="Вклад и Цели" 
                        showBack={true} 
                        onBack={onBack} 
                        rightIcon={mainTab === 'goals' ? 'fa-plus' : null} 
                        onRightClick={mainTab === 'goals' ? () => setShowAddGoal(true) : null} 
                    />
                    
                    <div className="px-5 py-2 mb-4">
                        <div className="flex bg-gray-200 dark:bg-gray-800 p-1 rounded-xl">
                            <button onClick={()=>{triggerHaptic('light'); setMainTab('calc');}} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${mainTab==='calc' ? 'bg-white dark:bg-gray-700 text-textDark dark:text-white shadow-sm' : 'text-gray-500'}`}>Калькулятор</button>
                            <button onClick={()=>{triggerHaptic('light'); setMainTab('goals');}} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${mainTab==='goals' ? 'bg-white dark:bg-gray-700 text-textDark dark:text-white shadow-sm' : 'text-gray-500'}`}>Копилки</button>
                        </div>
                    </div>

                    {mainTab === 'calc' ? (
                        <div className="animate-fade-in">
                            <div className="px-5 mb-4">
                                <div className="flex bg-gray-100 dark:bg-gray-900 p-1 rounded-xl">
                                    <button onClick={()=>{triggerHaptic(); setCalcMode('deposit');}} className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-colors ${calcMode==='deposit' ? 'bg-white dark:bg-gray-700 text-textDark dark:text-white shadow-sm' : 'text-gray-400'}`}>Вклад</button>
                                    <button onClick={()=>{triggerHaptic(); setCalcMode('credit');}} className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-colors ${calcMode==='credit' ? 'bg-white dark:bg-gray-700 text-textDark dark:text-white shadow-sm' : 'text-gray-400'}`}>Кредит</button>
                                </div>
                            </div>
                            <div className="px-5 space-y-4 mb-6">
                                <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-800">
                                    <label className="text-xs font-medium text-gray-500 mb-1 block">Сумма</label>
                                    <input type="text" value={formatMoneyInput(sum)} onChange={handleSumChange} className="w-full bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 font-bold text-lg text-textDark dark:text-white focus:outline-none" />
                                </div>
                                <div className="flex gap-4">
                                    <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-800 flex-1">
                                        <label className="text-xs font-medium text-gray-500 mb-1 block">Процент (%)</label>
                                        <input type="number" value={percent} onChange={e=>setPercent(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 font-bold text-lg text-textDark dark:text-white focus:outline-none" />
                                    </div>
                                    <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-800 flex-1">
                                        <label className="text-xs font-medium text-gray-500 mb-1 block">Срок (мес)</label>
                                        <input type="number" value={months} onChange={e=>setMonths(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 font-bold text-lg text-textDark dark:text-white focus:outline-none" />
                                    </div>
                                </div>
                            </div>
                            <div className="px-5">
                                <div className={`rounded-3xl p-6 text-white shadow-lg relative overflow-hidden ${calcMode==='deposit' ? 'bg-gradient-to-br from-primary to-purple-600' : 'bg-gradient-to-br from-blue-500 to-indigo-600'}`}>
                                    <i className={`fa-solid ${calcMode==='deposit' ? 'fa-piggy-bank' : 'fa-building-columns'} absolute -right-4 -top-4 text-white opacity-10 text-7xl`}></i>
                                    <p className="text-sm text-white/80 mb-1 font-medium">{calcMode==='deposit' ? 'Итоговая сумма' : 'Общая выплата'}</p>
                                    <h2 className="text-3xl font-bold mb-6 tracking-tight">{formatMoneyStr(res.total)}</h2>
                                    
                                    <div className="flex justify-between items-end bg-white/10 rounded-2xl p-4 backdrop-blur-sm">
                                        <div>
                                            <p className="text-[11px] uppercase tracking-wider text-white/70 font-bold mb-1">{calcMode==='deposit' ? 'Прибыль' : 'Переплата'}</p>
                                            <p className={`font-bold text-sm ${calcMode==='deposit' ? 'text-emerald-300' : 'text-orange-300'}`}>
                                                {calcMode==='deposit' ? '+' : ''}{formatMoneyStr(res.profit || res.overpay)}
                                            </p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-[11px] uppercase tracking-wider text-white/70 font-bold mb-1">{calcMode==='deposit' ? 'Доход в месяц' : 'Платеж в месяц'}</p>
                                            <p className="font-bold text-sm text-white">{formatMoneyStr(res.monthly)}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="space-y-4 px-5 animate-fade-in pt-2">
                            {goals.map(g => {
                                const perc = Math.min(100, Math.round((g.current / g.target) * 100));
                                const monthly = Math.round((g.target - g.current) / (g.months || 1));
                                return (
                                    <div key={g.id} className="bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-3xl p-5 shadow-sm transition-colors">
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <h4 className="font-bold text-lg text-textDark dark:text-white">{g.title}</h4>
                                                <p className="text-xs font-medium text-gray-500 mt-1">{formatMoneyStr(g.current)} / {formatMoneyStr(g.target)}</p>
                                            </div>
                                            <div className={`w-12 h-12 rounded-2xl flex items-center justify-center text-2xl ${g.bg} dark:bg-opacity-20 ${g.color}`} style={g.hex && g.hex.includes('gradient') ? {background: g.hex, color: '#fff'} : {}}>
                                                <IconRenderer icon={g.icon} />
                                            </div>
                                        </div>
                                        <div className="w-full bg-gray-100 dark:bg-gray-800 rounded-full h-2 mb-3">
                                            <div className="bg-primary h-2 rounded-full transition-all duration-1000" style={{width: `${perc}%`}}></div>
                                        </div>
                                        <div className="flex justify-between items-center text-xs mb-4">
                                            <span className="font-bold text-gray-400">Прогресс: {perc}%</span>
                                            <span className="font-medium text-primary bg-primary/10 px-2 py-1 rounded">Откладывать: {formatMoneyStr(monthly)}/мес</span>
                                        </div>
                                        <div className="flex gap-2">
                                            <button className="flex-1 bg-green-50 text-green-600 dark:bg-green-900/20 font-bold py-2.5 rounded-xl text-sm transition-colors active:bg-green-100" onClick={()=>{triggerHaptic(); setGoals(goals.map(goal => goal.id === g.id ? {...goal, current: goal.current + 100000} : goal))}}>+ Пополнить</button>
                                            <button className="w-12 bg-red-50 text-red-500 dark:bg-red-900/20 rounded-xl flex items-center justify-center transition-colors active:bg-red-100" onClick={()=>handleDeleteGoal(g.id)}><i className="fa-solid fa-trash"></i></button>
                                        </div>
                                    </div>
                                );
                            })}
                            {goals.length === 0 && <p className="text-center text-gray-400 mt-10">У вас пока нет копилок.</p>}
                        </div>
                    )}

                    {showAddGoal && (
                        <div className="fixed inset-0 z-[70] flex items-end">
                            <div className="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity" onClick={()=>setShowAddGoal(false)}></div>
                            <div className="bg-white dark:bg-gray-900 w-full h-[85vh] rounded-t-3xl p-6 relative z-10 animate-fade-in flex flex-col transition-colors">
                                <div className="w-12 h-1.5 bg-gray-200 dark:bg-gray-800 rounded-full mx-auto mb-6"></div>
                                <h3 className="text-xl font-bold mb-6 text-textDark dark:text-white">Новая цель</h3>
                                <div className="flex-1 overflow-y-auto no-scrollbar space-y-4 pb-10">
