                                    <button onClick={()=>{triggerHaptic(); setAddMethod('category');}} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${addMethod==='category' ? 'bg-white dark:bg-gray-700 text-primary shadow-sm' : 'text-gray-400'}`}>Категория</button>
                                </div>

                                <div className="flex-1 overflow-y-auto no-scrollbar pb-10">
                                    {addMethod === 'category' ? (
                                        <form id="addCatForm" onSubmit={handleAddCategory} className="space-y-5 animate-fade-in">
                                            <input required type="text" value={newCatName} onChange={e=>setNewCatName(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 rounded-2xl px-4 py-4 font-bold text-lg text-textDark dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/20" placeholder="Название категории" />
                                            <div>
                                                <p className="text-xs font-bold text-gray-400 uppercase mb-3 ml-1">Цвет</p>
                                                <div className="flex flex-wrap gap-3">
                                                    {CATEGORY_COLORS.map((c, i) => (
                                                        <div key={i} onClick={() => {triggerHaptic('light'); setNewCatColor(c);}} className={`w-10 h-10 rounded-full cursor-pointer flex items-center justify-center transition-transform ${newCatColor.hex === c.hex ? 'scale-110 shadow-md ring-2 ring-primary ring-offset-2 dark:ring-offset-gray-900' : ''}`} style={{backgroundColor: c.hex}}></div>
                                                    ))}
                                                </div>
                                            </div>
                                            <div>
                                                <p className="text-xs font-bold text-gray-400 uppercase mb-3 ml-1">Иконка</p>
                                                <div className="grid grid-cols-6 gap-3">
                                                    {TOP_ICONS.map(ic => (
                                                        <div key={ic} onClick={() => {triggerHaptic('light'); setNewCatIcon(ic);}} className={`aspect-square rounded-2xl flex items-center justify-center text-xl cursor-pointer transition-all ${newCatIcon === ic ? 'bg-primary text-white shadow-md scale-110' : 'bg-gray-50 dark:bg-gray-800 text-gray-400'}`}><i className={`fa-solid ${ic}`}></i></div>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="p-4 bg-gray-50 dark:bg-gray-800 rounded-2xl flex items-center gap-4">
                                                <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-2xl ${newCatColor.bg} dark:bg-opacity-20 ${newCatColor.color}`}><i className={`fa-solid ${newCatIcon}`}></i></div>
                                                <div>
                                                    <p className="text-xs text-gray-400 font-medium">Предпросмотр</p>
                                                    <p className="font-bold text-textDark dark:text-white text-lg">{newCatName || 'Новая категория'}</p>
                                                </div>
                                            </div>
                                        </form>
                                    ) : (
                                        <form id="addTxForm" onSubmit={handleSaveTransaction} className="space-y-4 animate-fade-in">
                                            <div className="bg-gray-50 dark:bg-gray-800 rounded-3xl p-4 flex items-center justify-center mb-2">
                                                <span className="text-2xl text-gray-400 font-bold mr-2">{getCurrencyRate().symbol || 'UZS'}</span>
                                                <input required type="text" value={amountStr ? formatMoneyInput(amountStr) : ''} onChange={handleAmountChange} className="w-full bg-transparent text-center font-bold text-4xl text-textDark dark:text-white focus:outline-none placeholder-gray-300 dark:placeholder-gray-600" placeholder="0" />
                                            </div>
                                            
                                            <div className="flex gap-2">
                                                <input required type="text" value={txTitle} onChange={e=>setTxTitle(e.target.value)} className="flex-1 bg-gray-50 dark:bg-gray-800 rounded-2xl px-4 py-4 font-bold text-textDark dark:text-white focus:outline-none" placeholder="Название (напр. Кофе)" />
                                                <button type="button" onClick={simulateAI} className="w-14 shrink-0 bg-blue-50 text-blue-500 dark:bg-blue-900/30 rounded-2xl flex items-center justify-center text-xl transition-colors active:bg-blue-100">{isProcessing ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-microphone"></i>}</button>
                                                <button type="button" onClick={simulateAI} className="w-14 shrink-0 bg-green-50 text-green-500 dark:bg-green-900/30 rounded-2xl flex items-center justify-center text-xl transition-colors active:bg-green-100">{isProcessing ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-camera"></i>}</button>
                                            </div>

                                            <div>
                                                <p className="text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Категория</p>
                                                <div className="flex gap-2 overflow-x-auto no-scrollbar pb-2">
                                                    {categories.map(c => (
                                                        <div key={c.name} onClick={()=>{triggerHaptic('light'); setTxCat(c.name); setTxIcon(null);}} className={`flex-shrink-0 flex items-center gap-2 px-3 py-2 rounded-xl cursor-pointer transition-colors border ${txCat === c.name ? 'border-primary bg-primary/5 dark:bg-primary/10' : 'border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900'}`}>
                                                            <div className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] ${c.bg} dark:bg-opacity-20 ${c.color}`}><i className={`fa-solid ${c.icon}`}></i></div>
                                                            <span className={`text-sm font-bold ${txCat === c.name ? 'text-primary' : 'text-gray-600 dark:text-gray-300'}`}>{c.name}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            <div>
                                                <p className="text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Своя иконка (опционально)</p>
                                                <div className="grid grid-cols-6 gap-3">
                                                    {TOP_ICONS.slice(0, 30).map(ic => (
                                                        <div key={ic} onClick={() => {triggerHaptic('light'); setTxIcon(ic);}} className={`aspect-square rounded-2xl flex items-center justify-center text-xl cursor-pointer transition-all ${txIcon === ic ? 'bg-primary text-white shadow-md scale-110' : 'bg-gray-50 dark:bg-gray-800 text-gray-400'}`}><i className={`fa-solid ${ic}`}></i></div>
                                                    ))}
                                                </div>
                                            </div>
                                        </form>
                                    )}
                                </div>

                                <div className="pt-4 border-t border-gray-100 dark:border-gray-800 shrink-0">
                                    <button type="submit" form={addMethod === 'category' ? "addCatForm" : "addTxForm"} className={`w-full text-white font-bold py-4 rounded-2xl shadow-lg transition-transform active:scale-[0.98] ${addMethod === 'income' ? 'bg-green-500 shadow-green-500/30' : 'bg-primary shadow-purple-500/30'}`}>
                                        {addMethod === 'category' ? 'Создать категорию' : (addMethod === 'income' ? 'Добавить доход' : 'Добавить расход')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Bottom Navigation */}
                    {['home', 'reports', 'tips', 'profile', 'categories', 'calculator'].includes(currentScreen) && (
                        <div className="fixed bottom-0 w-full max-w-md bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-t border-gray-100 dark:border-gray-800 px-6 py-2.5 flex justify-between items-center z-40 transition-colors duration-300">
                            <button onClick={() => {triggerHaptic('light'); setCurrentScreen('home');}} className={`flex flex-col items-center p-2 transition-colors ${currentScreen === 'home' ? 'text-primary' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-200'}`}><i className="fa-solid fa-house text-xl mb-1"></i><span className="text-[10px] font-bold">Главная</span></button>
                            <button onClick={() => {triggerHaptic('light'); setCurrentScreen('reports');}} className={`flex flex-col items-center p-2 transition-colors ${currentScreen === 'reports' ? 'text-primary' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-200'}`}><i className="fa-solid fa-chart-pie text-xl mb-1"></i><span className="text-[10px] font-bold">Отчеты</span></button>
                            
                            <div className="relative -top-6">
                                <button onClick={() => {triggerHaptic('medium'); setAddMethod('expense');}} className="w-14 h-14 bg-primary rounded-full flex items-center justify-center text-white text-2xl shadow-lg shadow-purple-500/40 transform active:scale-95 transition-all border-4 border-bgLight dark:border-bgDark"><i className="fa-solid fa-plus"></i></button>
                            </div>

                            <button onClick={() => {triggerHaptic('light'); setCurrentScreen('tips');}} className={`flex flex-col items-center p-2 transition-colors ${currentScreen === 'tips' ? 'text-primary' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-200'}`}><i className="fa-regular fa-lightbulb text-xl mb-1"></i><span className="text-[10px] font-bold">Советы</span></button>
                            <button onClick={() => {triggerHaptic('light'); setCurrentScreen('profile');}} className={`flex flex-col items-center p-2 transition-colors ${currentScreen === 'profile' ? 'text-primary' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-200'}`}><i className="fa-regular fa-user text-xl mb-1"></i><span className="text-[10px] font-bold">Профиль</span></button>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
