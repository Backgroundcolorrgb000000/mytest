<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Финансы Telegram App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#7C3AED',
                        primaryLight: '#8B5CF6',
                        primaryDark: '#5B21B6',
                        bgLight: '#F3F4F6',
                        bgDark: '#030712',
                        textDark: '#111827',
                        cardDark: '#1F2937'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-bgLight dark:bg-bgDark transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_URL = 'https://mytest-production-6436.up.railway.app/api';

        const formatMoney = (num) => Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " сум";

        const encodeFamilyId = (id) => id && id !== 'browser_test_user' ? 'FAM-' + Number(id).toString(36).toUpperCase() : 'FAM-TEST';
        const decodeFamilyId = (code) => {
            if (code === 'FAM-TEST') return 'browser_test_user';
            if (code && code.startsWith('FAM-')) {
                const num = parseInt(code.replace('FAM-', '').toLowerCase(), 36);
                if (!isNaN(num)) return num.toString();
            }
            return null;
        };

        const getGreeting = () => {
            const hour = new Date().getHours();
            if (hour >= 5 && hour < 12) return 'Доброе утро';
            if (hour >= 12 && hour < 18) return 'Добрый день';
            if (hour >= 18 && hour < 23) return 'Добрый вечер';
            return 'Доброй ночи';
        };

        // ТОП-30 Иконок для ежедневных трат
        const TOP_ICONS = [
            'fa-basket-shopping', 'fa-utensils', 'fa-bus', 'fa-car', 'fa-gas-pump', 
            'fa-cart-shopping', 'fa-shirt', 'fa-shoe-prints', 'fa-house', 'fa-bolt', 
            'fa-wifi', 'fa-phone', 'fa-heart-pulse', 'fa-pills', 'fa-tooth', 
            'fa-dumbbell', 'fa-plane', 'fa-train', 'fa-ticket', 'fa-gamepad', 
            'fa-music', 'fa-film', 'fa-paw', 'fa-baby-carriage', 'fa-graduation-cap', 
            'fa-book', 'fa-gift', 'fa-scissors', 'fa-mug-hot', 'fa-wallet'
        ];

        // Цветовые палитры для категорий и иконок
        const COLOR_PALETTES = [
            { c: 'text-orange-500', bg: 'bg-orange-100 dark:bg-orange-900/30', hex: '#f97316' },
            { c: 'text-blue-500', bg: 'bg-blue-100 dark:bg-blue-900/30', hex: '#3b82f6' },
            { c: 'text-emerald-500', bg: 'bg-emerald-100 dark:bg-emerald-900/30', hex: '#10b981' },
            { c: 'text-purple-500', bg: 'bg-purple-100 dark:bg-purple-900/30', hex: '#8b5cf6' },
            { c: 'text-pink-500', bg: 'bg-pink-100 dark:bg-pink-900/30', hex: '#ec4899' },
            { c: 'text-rose-500', bg: 'bg-rose-100 dark:bg-rose-900/30', hex: '#f43f5e' },
            { c: 'text-amber-500', bg: 'bg-amber-100 dark:bg-amber-900/30', hex: '#f59e0b' },
            { c: 'text-cyan-500', bg: 'bg-cyan-100 dark:bg-cyan-900/30', hex: '#06b6d4' }
        ];

        // ГЕНЕРАТОР ДЕМО-ДАННЫХ (За 3 месяца)
        const generateDummyData = (userId) => {
            const txs = [];
            const now = new Date();
            const categories = ['Продукты', 'Транспорт', 'Развлечения', 'Еда вне дома'];
            const icons = ['fa-basket-shopping', 'fa-bus', 'fa-gamepad', 'fa-utensils'];
            const colors = ['text-orange-500', 'text-blue-500', 'text-pink-500', 'text-amber-500'];
            const bgs = ['bg-orange-100', 'bg-blue-100', 'bg-pink-100', 'bg-amber-100'];

            for(let i = 0; i < 15; i++) {
                const d = new Date(now.getTime() - Math.floor(Math.random() * 90) * 24 * 60 * 60 * 1000);
                const isIncome = Math.random() > 0.8;
                const catIdx = Math.floor(Math.random() * categories.length);
                
                txs.push({
                    id: Date.now() - i * 100000,
                    userId,
                    title: isIncome ? 'Зарплата / Перевод' : `Покупка ${i+1}`,
                    category: isIncome ? 'Доход' : categories[catIdx],
                    amount: isIncome ? (Math.floor(Math.random() * 5) + 5) * 1000000 : -(Math.floor(Math.random() * 200) + 15) * 1000,
                    icon: isIncome ? 'fa-wallet' : icons[catIdx],
                    color: isIncome ? 'text-green-500' : colors[catIdx],
                    bg: isIncome ? 'bg-green-100' : bgs[catIdx],
                    date: `${d.getDate().toString().padStart(2, '0')}.${(d.getMonth() + 1).toString().padStart(2, '0')} ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`,
                    rawDate: d.toISOString()
                });
            }
            return txs.sort((a, b) => new Date(b.rawDate) - new Date(a.rawDate));
        };

        const TopHeader = ({ title, showBack = false, onBack, rightIcon = null, onRightClick = null }) => (
            <div className="flex justify-between items-center px-4 py-4 bg-white dark:bg-gray-900 sticky top-0 z-10 transition-colors duration-300 shadow-sm dark:shadow-gray-900">
                <div className="flex items-center gap-3">
                    {showBack && <button onClick={onBack} className="text-gray-600 dark:text-gray-300 hover:text-primary transition-colors"><i className="fa-solid fa-arrow-left text-lg"></i></button>}
                    <h1 className="text-xl font-bold text-textDark dark:text-white transition-colors">{title}</h1>
                </div>
                {rightIcon && <button onClick={onRightClick} className="text-gray-600 dark:text-gray-300 hover:text-primary transition-colors"><i className={`fa-solid ${rightIcon} text-xl`}></i></button>}
            </div>
        );

        const ScreenHome = ({ setScreen, transactions, user, onTransactionClick, onAddClick }) => {
            const userName = (user && user.first_name) ? user.first_name : 'Ильхом';
            const greeting = getGreeting();
            
            const totalIncome = transactions.filter(t => t.amount > 0).reduce((acc, curr) => acc + curr.amount, 0);
            const totalExpense = transactions.filter(t => t.amount < 0).reduce((acc, curr) => acc + Math.abs(curr.amount), 0);
            const currentBalance = totalIncome - totalExpense;

            return (
                <div className="pb-24 animate-fade-in">
                    <div className="px-4 pt-4 pb-2 flex justify-between items-center bg-bgLight dark:bg-bgDark transition-colors">
                        <div>
                            <p className="text-sm text-gray-500 dark:text-gray-400">{greeting},</p>
                            <h2 className="text-xl font-bold text-textDark dark:text-white">{userName}</h2>
                        </div>
                    </div>

                    <div className="px-4 py-2 flex overflow-x-auto snap-x snap-mandatory no-scrollbar space-x-4">
                        <div className="min-w-[90%] snap-center bg-gradient-to-r from-primary to-purple-600 rounded-3xl p-5 text-white shadow-lg relative overflow-hidden flex-shrink-0">
                            <i className="fa-solid fa-wallet absolute -right-4 -bottom-4 text-white opacity-10 text-6xl"></i>
                            <div className="flex justify-between items-center mb-1 relative z-10"><span className="text-sm text-purple-200">Общий баланс</span></div>
                            <h2 className="text-3xl font-bold mb-4 relative z-10">{formatMoney(currentBalance)}</h2>
                            <div className="flex justify-between relative z-10">
                                <div><p className="text-xs text-purple-200">Доходы</p><p className="font-semibold text-sm">{formatMoney(totalIncome)}</p></div>
                                <div className="text-right"><p className="text-xs text-purple-200">Расходы</p><p className="font-semibold text-sm">{formatMoney(totalExpense)}</p></div>
                            </div>
                        </div>
                    </div>

                    <div className="flex justify-between px-6 py-4">
                        <div className="flex flex-col items-center gap-1 cursor-pointer" onClick={() => onAddClick('income')}><div className="w-12 h-12 bg-blue-100 dark:bg-blue-900/40 rounded-2xl flex items-center justify-center text-blue-500 text-xl shadow-sm"><i className="fa-solid fa-arrow-down"></i></div><span className="text-xs font-medium text-gray-600 dark:text-gray-400">Доход</span></div>
                        <div className="flex flex-col items-center gap-1 cursor-pointer" onClick={() => onAddClick('expense')}><div className="w-12 h-12 bg-red-100 dark:bg-red-900/40 rounded-2xl flex items-center justify-center text-red-500 text-xl shadow-sm"><i className="fa-solid fa-arrow-up"></i></div><span className="text-xs font-medium text-gray-600 dark:text-gray-400">Расход</span></div>
                        <div className="flex flex-col items-center gap-1 cursor-pointer" onClick={() => setScreen('calculator')}><div className="w-12 h-12 bg-purple-100 dark:bg-purple-900/40 rounded-2xl flex items-center justify-center text-primary text-xl shadow-sm"><i className="fa-solid fa-calculator"></i></div><span className="text-xs font-medium text-gray-600 dark:text-gray-400">Вклад</span></div>
                        <div className="flex flex-col items-center gap-1 cursor-pointer" onClick={() => setScreen('goals')}><div className="w-12 h-12 bg-green-100 dark:bg-green-900/40 rounded-2xl flex items-center justify-center text-green-500 text-xl shadow-sm"><i className="fa-solid fa-bullseye"></i></div><span className="text-xs font-medium text-gray-600 dark:text-gray-400">Цель</span></div>
                    </div>

                    <div className="px-4 py-4">
                        <div className="flex justify-between items-center mb-3">
                            <h3 className="font-bold text-textDark dark:text-white transition-colors">Последние операции</h3>
                            <button onClick={() => setScreen('analytics')} className="text-xs font-medium text-primary">Все</button>
                        </div>
                        <div className="space-y-3">
                            {transactions.length === 0 ? (
                                <p className="text-center text-sm text-gray-400 py-4">У вас пока нет транзакций.</p>
                            ) : transactions.slice(0, 5).map(t => (
                                <div key={t.id} onClick={() => onTransactionClick(t)} className="flex items-center justify-between bg-white dark:bg-gray-900 p-3 rounded-2xl shadow-sm active:bg-gray-50 transition-colors cursor-pointer">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${t.bg} dark:bg-opacity-20 ${t.color}`}><i className={`fa-solid ${t.icon}`}></i></div>
                                        <div>
                                            <h4 className="font-bold text-sm text-textDark dark:text-white">{t.title}</h4>
                                            <p className="text-xs text-gray-500 dark:text-gray-400">{t.category}</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <p className={`font-bold text-sm ${t.amount > 0 ? 'text-green-500' : 'text-textDark dark:text-white'}`}>{t.amount > 0 ? '+' : ''}{formatMoney(t.amount)}</p>
                                        <p className="text-xs text-gray-500 dark:text-gray-400">{t.date.split(' ')[0]}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenAnalytics = ({ transactions, onTransactionClick, categories }) => {
            const spent = transactions.filter(t => t.amount < 0).reduce((acc, t) => {
                acc[t.category] = (acc[t.category] || 0) + Math.abs(t.amount);
                return acc;
            }, {});

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 transition-colors duration-300">
                    <TopHeader title="Аналитика и Лимиты" rightIcon="fa-chart-pie" />
                    <div className="px-4 py-4 space-y-4">
                        <div className="flex justify-between items-center mb-1">
                            <h3 className="font-bold text-textDark dark:text-white">Бюджет на месяц</h3>
                        </div>
                        <div className="bg-white dark:bg-gray-900 rounded-3xl p-5 shadow-sm space-y-5">
                            {categories.map(cat => {
                                const currentSpent = spent[cat.name] || 0;
                                const limit = cat.limit || 0;
                                const perc = limit > 0 ? Math.min(Math.round((currentSpent / limit) * 100), 100) : (currentSpent > 0 ? 100 : 0);
                                const isOver = limit > 0 && currentSpent > limit;
                                const barColor = isOver ? 'bg-red-500' : 'bg-primary';

                                return (
                                    <div key={cat.name}>
                                        <div className="flex justify-between items-center mb-2">
                                            <div className="flex items-center gap-2.5">
                                                <div className={`w-8 h-8 rounded-xl flex items-center justify-center ${cat.bg} dark:bg-opacity-20 ${cat.color}`}><i className={`fa-solid ${cat.icon} text-sm`}></i></div>
                                                <span className="text-sm font-bold text-textDark dark:text-white">{cat.name}</span>
                                            </div>
                                            <div className="text-right"><span className={`text-sm font-bold ${isOver ? 'text-red-500' : 'text-textDark dark:text-white'}`}>{formatMoney(currentSpent)}</span></div>
                                        </div>
                                        {limit > 0 ? (
                                            <>
                                                <div className="w-full bg-gray-100 dark:bg-gray-800 rounded-full h-2.5 mb-1 overflow-hidden">
                                                    <div className={`${barColor} h-2.5 rounded-full transition-all duration-700 ease-out`} style={{width: `${perc}%`}}></div>
                                                </div>
                                                <div className="flex justify-between mt-1">
                                                    <span className={`text-[10px] font-medium ${isOver ? 'text-red-500' : 'text-gray-500'}`}>{isOver ? 'Лимит превышен!' : `Осталось: ${formatMoney(limit - currentSpent)}`}</span>
                                                    <span className="text-[10px] text-gray-400">из {formatMoney(limit)}</span>
                                                </div>
                                            </>
                                        ) : (
                                            <p className="text-[10px] text-gray-400 mt-1">Без лимита (настройте в профиле)</p>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenCalculator = ({ onBack }) => {
            const [amount, setAmount] = useState(10000000);
            const [rate, setRate] = useState(18);
            const [months, setMonths] = useState(12);

            const profit = Math.round(amount * (rate / 100) * (months / 12));
            const total = amount + profit;
            const perc = (profit / amount) * 100 || 0;

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 transition-colors duration-300">
                    <TopHeader title="Калькулятор вклада" showBack={true} onBack={onBack} />
                    <div className="px-4 py-4 space-y-4">
                        <div className="bg-white dark:bg-gray-900 p-4 rounded-2xl shadow-sm border border-gray-50 dark:border-gray-800 space-y-2">
                            <div className="flex justify-between items-center py-2 border-b border-gray-100 dark:border-gray-800">
                                <span className="text-sm text-gray-500">Сумма вклада (сум)</span>
                                <input type="number" value={amount} onChange={e=>setAmount(Number(e.target.value))} className="w-32 bg-gray-50 dark:bg-gray-800 text-right font-bold rounded p-1 text-textDark dark:text-white focus:outline-none" />
                            </div>
                            <div className="flex justify-between items-center py-2 border-b border-gray-100 dark:border-gray-800">
                                <span className="text-sm text-gray-500">Ставка (% годовых)</span>
                                <input type="number" value={rate} onChange={e=>setRate(Number(e.target.value))} className="w-16 bg-gray-50 dark:bg-gray-800 text-right font-bold rounded p-1 text-textDark dark:text-white focus:outline-none" />
                            </div>
                            <div className="flex justify-between items-center py-2">
                                <span className="text-sm text-gray-500">Срок (месяцев)</span>
                                <input type="number" value={months} onChange={e=>setMonths(Number(e.target.value))} className="w-16 bg-gray-50 dark:bg-gray-800 text-right font-bold rounded p-1 text-textDark dark:text-white focus:outline-none" />
                            </div>
                        </div>
                        <div className="bg-gradient-to-r from-primary to-purple-600 rounded-3xl p-5 text-white shadow-lg relative overflow-hidden">
                            <i className="fa-solid fa-calculator absolute -right-4 -top-4 text-white opacity-10 text-6xl"></i>
                            <p className="text-sm text-purple-200 relative z-10 mb-1">Итоговая сумма</p>
                            <h2 className="text-3xl font-bold mb-2 relative z-10">{formatMoney(total)}</h2>
                            <div className="relative z-10"><p className="text-xs text-purple-200 mb-1">Чистая прибыль</p><p className="text-sm text-emerald-300 font-bold bg-white/10 inline-block px-2 py-1 rounded">+{formatMoney(profit)} ({perc.toFixed(2)}%)</p></div>
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenGoals = ({ onBack, goals, setGoals }) => {
            const [showAddForm, setShowAddForm] = useState(false);
            const [newTitle, setNewTitle] = useState('');
            const [newTarget, setNewTarget] = useState('');
            const [selectedIcon, setSelectedIcon] = useState('fa-star');

            const handleAddGoal = () => {
                if(!newTitle || !newTarget) return;
                setGoals([...goals, { id: Date.now(), title: newTitle, current: 0, target: Number(newTarget), icon: selectedIcon, color: 'bg-primary', iconColor: 'text-primary' }]);
                setShowAddForm(false); setNewTitle(''); setNewTarget(''); setSelectedIcon('fa-star');
            };

            const addFunds = (id) => {
                const amount = Number(prompt("Введите сумму пополнения:"));
                if(!amount) return;
                setGoals(goals.map(g => g.id === id ? { ...g, current: Math.min(g.current + amount, g.target) } : g));
            };

            const deleteGoal = (id) => {
                if(confirm("Удалить эту цель?")) setGoals(goals.filter(g => g.id !== id));
            };

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 transition-colors duration-300">
                    <TopHeader title="Цели" showBack={true} onBack={onBack} rightIcon="fa-plus" onRightClick={() => setShowAddForm(true)} />
                    <div className="px-4 pt-4 space-y-4">
                        {showAddForm && (
                            <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm border border-primary/20 mb-4 animate-fade-in">
                                <h4 className="font-bold text-sm mb-3 text-textDark dark:text-white">Новая цель</h4>
                                <input type="text" value={newTitle} onChange={e=>setNewTitle(e.target.value)} placeholder="Название (напр. Машина)" className="w-full bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 mb-3 text-sm focus:outline-none focus:border-primary border border-transparent text-textDark dark:text-white" />
                                <input type="number" value={newTarget} onChange={e=>setNewTarget(e.target.value)} placeholder="Сумма цели" className="w-full bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 mb-3 text-sm focus:outline-none focus:border-primary border border-transparent text-textDark dark:text-white" />
                                
                                <p className="text-xs text-gray-500 mb-2">Выберите иконку:</p>
                                <div className="flex gap-2 overflow-x-auto no-scrollbar mb-4 py-1">
                                    {TOP_ICONS.map(ic => (
                                        <div key={ic} onClick={() => setSelectedIcon(ic)} className={`w-10 h-10 flex-shrink-0 rounded-full flex items-center justify-center text-lg cursor-pointer transition-all ${selectedIcon === ic ? 'bg-primary text-white shadow-md' : 'bg-gray-100 dark:bg-gray-800 text-gray-500'}`}>
                                            <i className={`fa-solid ${ic}`}></i>
                                        </div>
                                    ))}
                                </div>

                                <div className="flex gap-2">
                                    <button onClick={handleAddGoal} className="flex-1 bg-primary text-white py-3 rounded-xl font-bold text-sm">Создать</button>
                                    <button onClick={()=>setShowAddForm(false)} className="flex-1 bg-gray-100 dark:bg-gray-800 text-gray-500 py-3 rounded-xl font-bold text-sm">Отмена</button>
                                </div>
                            </div>
                        )}

                        {goals.length === 0 && !showAddForm && <p className="text-center text-sm text-gray-400 py-10">У вас пока нет целей. Нажмите + чтобы добавить.</p>}

                        {goals.map(g => {
                            const perc = Math.min(Math.round((g.current / g.target) * 100), 100);
                            return (
                                <div key={g.id} className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm border border-gray-50 dark:border-gray-800 relative group overflow-hidden">
                                    <div className="flex justify-between items-start mb-3">
                                        <div><h4 className="font-bold text-textDark dark:text-white">{g.title}</h4><p className="text-xs text-gray-500 mt-1">{formatMoney(g.current)} / {formatMoney(g.target)}</p></div>
                                        <div className={`w-12 h-12 bg-gray-50 dark:bg-gray-800 rounded-xl flex items-center justify-center ${g.iconColor || 'text-primary'} text-xl`}><i className={`fa-solid ${g.icon}`}></i></div>
                                    </div>
                                    <div className="w-full bg-gray-100 dark:bg-gray-800 rounded-full h-2.5 mb-3"><div className={`${g.color} h-2.5 rounded-full transition-all`} style={{width: `${perc}%`}}></div></div>
                                    <div className="flex justify-between items-center text-xs">
                                        <span className="font-bold text-textDark dark:text-gray-300">Прогресс: {perc}%</span>
                                        <div className="flex gap-2">
                                            <button onClick={()=>addFunds(g.id)} className="bg-green-100 text-green-600 dark:bg-green-900/30 px-3 py-1.5 rounded-lg font-bold">Пополнить</button>
                                            <button onClick={()=>deleteGoal(g.id)} className="bg-red-100 text-red-500 dark:bg-red-900/30 px-3 py-1.5 rounded-lg"><i className="fa-solid fa-trash"></i></button>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const ScreenTips = ({ openAIChat }) => (
            <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 transition-colors duration-300 relative">
                <TopHeader title="Советы" rightIcon="fa-bell" />
                <div className="px-4 py-4 space-y-4">
                    <h3 className="font-bold text-textDark dark:text-white">Анализ ваших финансов</h3>
                    <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm flex gap-4 border border-green-100 dark:border-green-900/30 items-start">
                        <div className="w-10 h-10 rounded-full bg-green-100 dark:bg-green-900/30 flex items-center justify-center text-green-500 text-xl shrink-0"><i className="fa-solid fa-wand-magic-sparkles"></i></div>
                        <div><h4 className="font-bold text-sm text-textDark dark:text-white">ИИ-аналитика включена</h4><p className="text-sm text-gray-600 dark:text-gray-400 mt-1">Я постоянно слежу за вашими расходами. Нажмите на робота в углу, чтобы пообщаться со мной!</p></div>
                    </div>
                </div>
                <button onClick={openAIChat} className="fixed bottom-24 right-4 w-14 h-14 bg-gradient-to-r from-primary to-purple-600 rounded-full shadow-lg flex items-center justify-center text-white text-2xl hover:scale-105 transition-transform z-40">
                    <i className="fa-solid fa-robot"></i><span className="absolute top-0 right-0 w-3.5 h-3.5 bg-red-500 border-2 border-[#F9FAFB] dark:border-gray-950 rounded-full"></span>
                </button>
            </div>
        );

        const ScreenAIChat = ({ onBack, userId }) => {
            const [messages, setMessages] = useState([{ type: 'bot', text: 'Привет! Я ваш финансовый ИИ-помощник. Я вижу вашу базу данных расходов. Что бы вы хотели узнать?' }]);
            const [inputText, setInputText] = useState('');
            const [isTyping, setIsTyping] = useState(false);

            const sendPrompt = async (text) => {
                if (!text.trim()) return;
                setMessages(prev => [...prev, { type: 'user', text }]);
                setInputText(''); setIsTyping(true);
                try {
                    const res = await fetch(`${API_URL}/chat`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json', 'x-tg-user-id': userId },
                        body: JSON.stringify({ message: text })
                    });
                    const data = await res.json();
                    setMessages(prev => [...prev, { type: 'bot', text: data.reply || "Сбой ИИ." }]);
                } catch (e) {
                    setMessages(prev => [...prev, { type: 'bot', text: "Ошибка связи с сервером." }]);
                } finally { setIsTyping(false); }
            };

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen flex flex-col animate-fade-in z-50 relative transition-colors duration-300">
                    <TopHeader title="Чат с ИИ" showBack={true} onBack={onBack} rightIcon="fa-broom" onRightClick={() => setMessages([messages[0]])} />
                    <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-32">
                        {messages.map((msg, i) => (
                            <div key={i} className={`flex ${msg.type === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] rounded-2xl p-3 text-sm ${msg.type === 'user' ? 'bg-gray-200 dark:bg-gray-800 text-textDark dark:text-white rounded-tr-sm' : 'bg-primary text-white rounded-tl-sm shadow-md'}`}>
                                    {msg.text.split('\n').map((line, j) => <p key={j} className="mb-1 last:mb-0">{line}</p>)}
                                </div>
                            </div>
                        ))}
                        {isTyping && <div className="flex justify-start"><div className="bg-primary text-white rounded-2xl rounded-tl-sm p-3 shadow-md flex items-center gap-1"><span className="w-2 h-2 bg-white rounded-full animate-bounce"></span><span className="w-2 h-2 bg-white rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></span><span className="w-2 h-2 bg-white rounded-full animate-bounce" style={{animationDelay: '0.4s'}}></span></div></div>}
                    </div>
                    <div className="fixed bottom-0 w-full max-w-md p-4 bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 z-50">
                        {messages.length === 1 && (
                            <div className="mb-3 flex gap-2 overflow-x-auto no-scrollbar pb-1">
                                {['Проанализируй траты', 'Как накопить больше?', 'Где я много трачу?'].map(q => (
                                    <button key={q} onClick={() => sendPrompt(q)} className="whitespace-nowrap px-4 py-2 text-xs font-medium text-primary bg-primary/10 rounded-full border border-primary/20">{q}</button>
                                ))}
                            </div>
                        )}
                        <div className="flex items-center gap-2">
                            <input type="text" value={inputText} onChange={e=>setInputText(e.target.value)} onKeyPress={e=>e.key==='Enter'&&sendPrompt(inputText)} placeholder="Спросите Gemini..." className="flex-1 bg-gray-100 dark:bg-gray-800 text-textDark dark:text-white rounded-full px-4 py-3 text-sm focus:outline-none" />
                            <button onClick={()=>sendPrompt(inputText)} className="w-11 h-11 bg-primary text-white rounded-full flex items-center justify-center shadow-md"><i className="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenProfile = ({ user, isDarkMode, toggleDarkMode, onOpenCategories, familyId, setFamilyId }) => {
            const userName = (user && user.first_name) ? user.first_name : 'Ильхом';
            const username = (user && user.username) ? `@${user.username}` : '@ilkhom_finance';
            const userPhoto = (user && user.photo_url) ? user.photo_url : `https://placehold.co/150x150/7C3AED/ffffff?text=${userName.charAt(0)}`;
            
            const joinFamily = () => {
                const code = prompt("Введите код семьи (Например: FAM-XXXX):");
                if(code && code.startsWith('FAM-')) { setFamilyId(code); alert("Вы успешно подключены к кошельку семьи!"); window.location.reload(); }
                else if (code) alert("Неверный формат кода!");
            };

            return (
                <div className="bg-[#F3F4F6] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 transition-colors duration-300">
                    <TopHeader title="Профиль" rightIcon="fa-gear" />
                    
                    <div className="bg-white dark:bg-gray-900 px-4 py-6 mb-2 flex items-center gap-4 transition-colors duration-300">
                        <img src={userPhoto} alt="Аватар" className="w-16 h-16 rounded-full border-2 border-primaryLight shadow-sm object-cover" />
                        <div>
                            <h2 className="text-xl font-bold text-textDark dark:text-white transition-colors duration-300">{userName}</h2>
                            <p className="text-gray-500 dark:text-gray-400 text-sm font-medium transition-colors">{username}</p>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-gray-900 px-4 py-3 mb-2">
                        <div className="bg-gradient-to-r from-gray-900 to-indigo-900 rounded-2xl p-4 flex items-center justify-between shadow-md relative overflow-hidden">
                            <i className="fa-brands fa-telegram absolute -right-4 -bottom-4 text-white opacity-10 text-6xl transform -rotate-12"></i>
                            <div className="flex items-center gap-3 relative z-10">
                                <div className="w-10 h-10 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-full flex items-center justify-center text-white shadow-lg"><i className="fa-solid fa-crown text-sm"></i></div>
                                <div><h3 className="font-bold text-white text-sm">Cloud Sync Active</h3><p className="text-xs text-gray-300 mt-0.5">Данные в безопасности на сервере</p></div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-gray-900 px-4 py-4 mb-2">
                        <h3 className="font-bold text-textDark dark:text-white mb-3">Семейный бюджет</h3>
                        <div className="bg-blue-50 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-800/50 rounded-2xl p-4">
                            {familyId ? (
                                <div>
                                    <p className="text-sm text-textDark dark:text-white mb-2">Вы подключены к семье: <strong>{familyId}</strong></p>
                                    <button onClick={()=>{setFamilyId(null); window.location.reload();}} className="bg-red-100 text-red-600 px-4 py-2 rounded-xl text-sm font-bold w-full">Отключиться</button>
                                </div>
                            ) : (
                                <div>
                                    <p className="text-xs text-gray-500 dark:text-gray-400 mb-2">Ваш код: <strong className="text-primary text-sm bg-white dark:bg-gray-800 px-2 py-1 rounded">{encodeFamilyId(user ? user.id : 'browser')}</strong></p>
                                    <button onClick={joinFamily} className="bg-primary text-white px-4 py-2 rounded-xl text-sm font-bold w-full shadow-md">Подключиться к семье</button>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="bg-white dark:bg-gray-900 px-4 py-2 space-y-1">
                        <div onClick={onOpenCategories} className="flex items-center justify-between py-3.5 border-b border-gray-50 dark:border-gray-800/50 cursor-pointer">
                            <div className="flex items-center gap-4"><div className="w-9 h-9 rounded-full flex items-center justify-center bg-amber-100 dark:bg-amber-900/30 text-amber-500"><i className="fa-solid fa-icons text-sm"></i></div><span className="text-textDark dark:text-white font-bold text-sm">Мои категории</span></div>
                            <i className="fa-solid fa-chevron-right text-gray-300 dark:text-gray-600 text-xs"></i>
                        </div>
                        <div onClick={toggleDarkMode} className="flex items-center justify-between py-3.5 cursor-pointer">
                            <div className="flex items-center gap-4"><div className="w-9 h-9 rounded-full flex items-center justify-center bg-indigo-100 dark:bg-indigo-900/30 text-indigo-500"><i className="fa-solid fa-moon text-sm"></i></div><span className="text-textDark dark:text-white font-bold text-sm">Темная тема</span></div>
                            <div className="flex items-center gap-2"><span className="text-xs font-medium text-gray-400">{isDarkMode ? 'Вкл' : 'Выкл'}</span><i className="fa-solid fa-chevron-right text-gray-300 text-xs"></i></div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentScreen, setCurrentScreen] = useState('home');
            const [isAddingMode, setIsAddingMode] = useState(false);
            const [txType, setTxType] = useState('expense');
            const [isLoading, setIsLoading] = useState(true);
            const [transactions, setTransactions] = useState([]);
            const [isSplashVisible, setIsSplashVisible] = useState(true);
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('financeAppTheme') === 'dark');
            const [tgUser, setTgUser] = useState(null);
            
            const [familyId, setFamilyId] = useState(() => {
                const saved = localStorage.getItem('financeAppFamilyId');
                if (saved && !saved.startsWith('FAM-')) { localStorage.removeItem('financeAppFamilyId'); return null; }
                return saved;
            });

            // Категории пользователя
            const defaultCategories = [
                { name: 'Продукты', icon: 'fa-basket-shopping', color: 'text-orange-500', bg: 'bg-orange-100', limit: 2000000 },
                { name: 'Транспорт', icon: 'fa-bus', color: 'text-blue-500', bg: 'bg-blue-100', limit: 500000 },
                { name: 'Еда вне дома', icon: 'fa-utensils', color: 'text-amber-600', bg: 'bg-amber-100', limit: 1000000 },
                { name: 'Развлечения', icon: 'fa-play', color: 'text-pink-500', bg: 'bg-pink-100', limit: 1000000 }
            ];
            const [categories, setCategories] = useState(() => JSON.parse(localStorage.getItem('financeAppCategories')) || defaultCategories);
            const [isCategoryModalOpen, setIsCategoryModalOpen] = useState(false);

            // Цели пользователя
            const defaultGoals = [
                { id: 1, title: 'Новая кухня', current: 600000, target: 2000000, icon: 'fa-house', color: 'bg-primary', iconColor: 'text-primary' }
            ];
            const [goals, setGoals] = useState(() => JSON.parse(localStorage.getItem('financeAppGoals')) || defaultGoals);

            // Форма добавления расхода
            const [newTxAmount, setNewTxAmount] = useState('');
            const [newTxTitle, setNewTxTitle] = useState('');
            const [newTxCat, setNewTxCat] = useState('');
            const [newTxIcon, setNewTxIcon] = useState(TOP_ICONS[0]);

            useEffect(() => { localStorage.setItem('financeAppCategories', JSON.stringify(categories)); }, [categories]);
            useEffect(() => { localStorage.setItem('financeAppGoals', JSON.stringify(goals)); }, [goals]);
            useEffect(() => {
                if (isDarkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('financeAppTheme', 'dark'); } 
                else { document.documentElement.classList.remove('dark'); localStorage.setItem('financeAppTheme', 'light'); }
            }, [isDarkMode]);

            const getEffectiveUserId = () => {
                if (familyId) { const decoded = decodeFamilyId(familyId); if (decoded) return decoded; }
                return tgUser ? tgUser.id.toString() : 'browser_test_user';
            };

            useEffect(() => {
                let currentUserId = 'browser_test_user';
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.expand();
                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        setTgUser(tg.initDataUnsafe.user);
                        currentUserId = tg.initDataUnsafe.user.id.toString();
                    }
                }

                const effectiveId = familyId ? decodeFamilyId(familyId) || currentUserId : currentUserId;

                fetch(`${API_URL}/transactions`, { headers: { 'x-tg-user-id': effectiveId } })
                    .then(res => { if(res.ok) return res.json(); throw new Error(); })
                    .then(data => {
                        if (Array.isArray(data) && data.length > 0) {
                            setTransactions(data);
                        } else {
                            // ЕСЛИ БАЗА ПУСТАЯ - ГЕНЕРИРУЕМ ДЕМО-ДАННЫЕ ЗА 3 МЕСЯЦА
                            setTransactions(generateDummyData(effectiveId));
                        }
                        setIsLoading(false);
                    })
                    .catch(() => { setIsLoading(false); });
                
                setTimeout(() => setIsSplashVisible(false), 2000);
            }, [familyId]);

            const openAddModal = (type = 'expense') => {
                setTxType(type);
                setNewTxCat(categories[0].name);
                setNewTxIcon(TOP_ICONS[0]);
                setIsAddingMode(true);
            };

            const handleSaveTransaction = async (e) => {
                e.preventDefault();
                let finalAmount = parseFloat(newTxAmount);
                if(!finalAmount || !newTxTitle) return;

                const signedAmount = txType === 'income' ? finalAmount : -finalAmount;
                const d = new Date();
                const dateString = d.getDate().toString().padStart(2, '0') + '.' + (d.getMonth() + 1).toString().padStart(2, '0') + ' ' + d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');

                const selectedCatObj = categories.find(c => c.name === newTxCat) || categories[0];
                const newTxPayload = {
                    title: newTxTitle, category: txType === 'income' ? 'Доход' : newTxCat, amount: signedAmount, date: dateString, rawDate: new Date().toISOString(),
                    icon: txType === 'income' ? 'fa-wallet' : newTxIcon, 
                    color: txType === 'income' ? 'text-green-500' : selectedCatObj.color, 
                    bg: txType === 'income' ? 'bg-green-100' : selectedCatObj.bg
                };

                try {
                    const res = await fetch(`${API_URL}/transactions`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-tg-user-id': getEffectiveUserId() }, body: JSON.stringify(newTxPayload) });
                    if(!res.ok) throw new Error();
                    const savedTx = await res.json();
                    setTransactions([savedTx, ...transactions]);
                    setIsAddingMode(false); setNewTxAmount(''); setNewTxTitle('');
                } catch (error) { alert("Ошибка сохранения."); }
            };

            const simulateScan = () => { alert("ИИ сканирует чек... (Демо)"); setNewTxTitle("Супермаркет"); setNewTxAmount("125000"); };
            const simulateVoice = () => { alert("Внимательно слушаю... (Демо)"); setNewTxTitle("Такси"); setNewTxAmount("25000"); setNewTxIcon('fa-car'); };

            const renderScreen = () => {
                if (isLoading) return <div className="h-screen flex items-center justify-center"><i className="fa-solid fa-circle-notch fa-spin text-4xl text-primary"></i></div>;
                switch(currentScreen) {
                    case 'home': return <ScreenHome setScreen={setCurrentScreen} transactions={transactions} user={tgUser} onTransactionClick={() => {}} onAddClick={openAddModal} />;
                    case 'analytics': return <ScreenAnalytics transactions={transactions} categories={categories} onTransactionClick={() => {}} />;
                    case 'calculator': return <ScreenCalculator onBack={() => setCurrentScreen('home')} />;
                    case 'goals': return <ScreenGoals onBack={() => setCurrentScreen('home')} goals={goals} setGoals={setGoals} />;
                    case 'tips': return <ScreenTips openAIChat={() => setCurrentScreen('aichat')} />;
                    case 'aichat': return <ScreenAIChat onBack={() => setCurrentScreen('tips')} userId={getEffectiveUserId()} />;
                    case 'profile': return <ScreenProfile user={tgUser} isDarkMode={isDarkMode} toggleDarkMode={() => setIsDarkMode(!isDarkMode)} onOpenCategories={() => setIsCategoryModalOpen(true)} familyId={familyId} setFamilyId={setFamilyId} />;
                    default: return null;
                }
            };

            if (isSplashVisible) return (
                <div className="h-screen w-full bg-primary flex flex-col items-center justify-center text-white relative z-[100]">
                    <div className="w-24 h-24 bg-white rounded-3xl flex items-center justify-center shadow-2xl mb-6"><i className="fa-solid fa-wallet text-5xl text-primary"></i></div>
                    <h1 className="text-3xl font-bold">FinanceAI</h1>
                </div>
            );

            return (
                <div className="max-w-md mx-auto bg-bgLight dark:bg-bgDark min-h-screen relative shadow-2xl overflow-hidden transition-colors duration-300">
                    {renderScreen()}

                    {}
                    {isAddingMode && (
                        <div className="fixed inset-0 z-[60] flex items-end">
                            <div className="absolute inset-0 bg-black/50 backdrop-blur-sm" onClick={() => setIsAddingMode(false)}></div>
                            <div className="bg-white dark:bg-gray-900 w-full rounded-t-3xl p-6 relative z-10 animate-fade-in max-h-[90vh] overflow-y-auto no-scrollbar">
                                <div className="w-12 h-1.5 bg-gray-200 dark:bg-gray-700 rounded-full mx-auto mb-6"></div>
                                
                                <div className="flex bg-gray-100 dark:bg-gray-800 p-1 rounded-xl mb-6">
                                    <button onClick={()=>setTxType('expense')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${txType==='expense' ? 'bg-white dark:bg-gray-700 text-textDark dark:text-white shadow-sm' : 'text-gray-400'}`}>Расход</button>
                                    <button onClick={()=>setTxType('income')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${txType==='income' ? 'bg-white dark:bg-gray-700 text-green-500 shadow-sm' : 'text-gray-400'}`}>Доход</button>
                                </div>

                                <form onSubmit={handleSaveTransaction}>
                                    <div className="space-y-4 mb-6">
                                        <div>
                                            <label className="text-xs text-gray-500 dark:text-gray-400 ml-1">Сумма (сум)</label>
                                            <input required type="number" value={newTxAmount} onChange={e=>setNewTxAmount(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 text-lg font-bold mt-1 text-textDark dark:text-white focus:outline-none" placeholder="0" />
                                        </div>
                                        <div>
                                            <div className="flex justify-between items-center ml-1 mb-1">
                                                <label className="text-xs text-gray-500 dark:text-gray-400">Название / Место</label>
                                                <div className="flex gap-2">
                                                    <button type="button" onClick={simulateVoice} className="w-7 h-7 bg-blue-100 text-blue-500 rounded-full flex items-center justify-center text-xs"><i className="fa-solid fa-microphone"></i></button>
                                                    <button type="button" onClick={simulateScan} className="w-7 h-7 bg-green-100 text-green-500 rounded-full flex items-center justify-center text-xs"><i className="fa-solid fa-camera"></i></button>
                                                </div>
                                            </div>
                                            <input required type="text" value={newTxTitle} onChange={e=>setNewTxTitle(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 text-textDark dark:text-white focus:outline-none" placeholder={txType === 'income' ? 'Зарплата, Перевод...' : 'Кафе, Магазин...'} />
                                        </div>
                                        
                                        {txType === 'expense' && (
                                            <>
                                                <div>
                                                    <label className="text-xs text-gray-500 dark:text-gray-400 ml-1">Категория</label>
                                                    <select value={newTxCat} onChange={e=>setNewTxCat(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 mt-1 text-textDark dark:text-white focus:outline-none appearance-none">
                                                        {categories.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="text-xs text-gray-500 dark:text-gray-400 ml-1 mb-1 block">Иконка траты</label>
                                                    <div className="grid grid-cols-6 gap-2 max-h-32 overflow-y-auto no-scrollbar p-1">
                                                        {TOP_ICONS.map(ic => (
                                                            <div key={ic} onClick={() => setNewTxIcon(ic)} className={`w-10 h-10 rounded-full flex items-center justify-center text-lg cursor-pointer transition-all ${newTxIcon === ic ? 'bg-primary text-white shadow-md scale-110' : 'bg-gray-100 dark:bg-gray-800 text-gray-500 hover:bg-gray-200'}`}>
                                                                <i className={`fa-solid ${ic}`}></i>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                    <button type="submit" className={`w-full text-white font-bold py-4 rounded-2xl shadow-lg ${txType === 'income' ? 'bg-green-500' : 'bg-primary'}`}>
                                        Сохранить {txType === 'income' ? 'доход' : 'расход'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {}
                    {isCategoryModalOpen && (
                        <div className="fixed inset-0 z-[80] flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm">
                            <div className="bg-white dark:bg-gray-900 w-full h-[85vh] rounded-t-3xl sm:rounded-3xl p-6 animate-fade-in relative z-10 flex flex-col">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-bold text-textDark dark:text-white">Мои категории</h3>
                                    <button onClick={() => setIsCategoryModalOpen(false)} className="text-gray-400"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>
                                <div className="overflow-y-auto mb-6 pr-2 space-y-3 no-scrollbar flex-1 pb-4">
                                    {categories.map((cat, idx) => (
                                        <div key={idx} className="flex flex-col gap-2 bg-gray-50 dark:bg-gray-800 p-3 rounded-2xl border border-gray-100 dark:border-gray-700">
                                            <div className="flex justify-between items-center">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${cat.bg} dark:bg-opacity-20 ${cat.color}`}><i className={`fa-solid ${cat.icon}`}></i></div>
                                                    <span className="font-bold text-sm text-textDark dark:text-white">{cat.name}</span>
                                                </div>
                                                <button onClick={() => setCategories(categories.filter((_, i) => i !== idx))} className="text-red-500 w-8 h-8 flex items-center justify-center bg-red-50 dark:bg-red-900/30 rounded-lg"><i className="fa-solid fa-trash text-sm"></i></button>
                                            </div>
                                            <div className="flex items-center justify-between pl-1">
                                                <span className="text-xs text-gray-500">Лимит:</span>
                                                <input type="number" value={cat.limit || 0} onChange={(e) => { const val = parseInt(e.target.value) || 0; const newCats = [...categories]; newCats[idx].limit = val; setCategories(newCats); }} className="w-28 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-600 rounded-lg px-2 py-1 text-sm text-right font-bold focus:outline-none text-textDark dark:text-white" />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {currentScreen !== 'aichat' && currentScreen !== 'product' && currentScreen !== 'calculator' && currentScreen !== 'goals' && (
                        <div className="fixed bottom-0 w-full max-w-md bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 px-6 py-2 flex justify-between items-center z-40 transition-colors">
                            <button onClick={() => setCurrentScreen('home')} className={`flex flex-col items-center p-2 ${currentScreen === 'home' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-solid fa-house text-xl mb-1"></i><span className="text-[10px] font-medium">Главная</span></button>
                            <button onClick={() => setCurrentScreen('analytics')} className={`flex flex-col items-center p-2 ${currentScreen === 'analytics' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-solid fa-chart-pie text-xl mb-1"></i><span className="text-[10px] font-medium">Аналитика</span></button>
                            <div className="relative -top-5"><button onClick={() => openAddModal('expense')} className="w-14 h-14 bg-primary rounded-full flex items-center justify-center text-white text-2xl shadow-lg transform hover:scale-105 transition-all"><i className="fa-solid fa-plus"></i></button></div>
                            <button onClick={() => setCurrentScreen('tips')} className={`flex flex-col items-center p-2 ${currentScreen === 'tips' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-regular fa-lightbulb text-xl mb-1"></i><span className="text-[10px] font-medium">Советы</span></button>
                            <button onClick={() => setCurrentScreen('profile')} className={`flex flex-col items-center p-2 ${currentScreen === 'profile' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-regular fa-user text-xl mb-1"></i><span className="text-[10px] font-medium">Профиль</span></button>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
