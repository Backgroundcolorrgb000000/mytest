<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Финансы Telegram App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#7C3AED',
                        primaryLight: '#8B5CF6',
                        primaryDark: '#5B21B6',
                        bgLight: '#F3F4F6',
                        bgDark: '#030712',
                        textDark: '#111827',
                        cardDark: '#1F2937'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes scanline { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
        .animate-scanline { position: absolute; left: 0; width: 100%; height: 2px; background-color: #10B981; box-shadow: 0 0 10px #10B981; animation: scanline 2s linear infinite; }
        @keyframes ping-slow { 75%, 100% { transform: scale(1.5); opacity: 0; } }
        .animate-ping-slow { animation: ping-slow 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-bgLight dark:bg-bgDark transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_URL = 'https://mytest-production-6436.up.railway.app/api';

        const formatMoney = (num) => Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " сум";

        const encodeFamilyId = (id) => id && id !== 'browser_test_user' ? 'FAM-' + Number(id).toString(36).toUpperCase() : 'FAM-TEST';
        const decodeFamilyId = (code) => {
            if (code === 'FAM-TEST') return 'browser_test_user';
            if (code && code.startsWith('FAM-')) {
                const num = parseInt(code.replace('FAM-', '').toLowerCase(), 36);
                if (!isNaN(num)) return num.toString();
            }
            return null;
        };

        const TopHeader = ({ title, showBack = false, onBack, rightIcon = null, onRightClick = null }) => (
            <div className="flex justify-between items-center px-4 py-4 bg-white dark:bg-gray-900 sticky top-0 z-10 transition-colors duration-300">
                <div className="flex items-center gap-3">
                    {showBack && <button onClick={onBack} className="text-gray-600 dark:text-gray-300 hover:text-primary transition-colors"><i className="fa-solid fa-arrow-left text-lg"></i></button>}
                    <h1 className="text-xl font-bold text-textDark dark:text-white transition-colors">{title}</h1>
                </div>
                {rightIcon && <button onClick={onRightClick} className="text-gray-600 dark:text-gray-300 hover:text-primary transition-colors"><i className={`fa-regular ${rightIcon} text-xl`}></i></button>}
            </div>
        );

        const ScreenHome = ({ setScreen, transactions, user, onTransactionClick }) => {
            const userName = (user && user.first_name) ? user.first_name : 'Ильхом';
            
            const totalIncome = transactions.filter(t => t.amount > 0).reduce((acc, curr) => acc + curr.amount, 0) + 12150000;
            const totalExpense = transactions.filter(t => t.amount < 0).reduce((acc, curr) => acc + Math.abs(curr.amount), 0);
            const currentBalance = totalIncome - totalExpense;

            return (
                <div className="pb-24 animate-fade-in">
                    <div className="px-4 pt-4 pb-2 flex justify-between items-center bg-bgLight dark:bg-bgDark transition-colors">
                        <div>
                            <p className="text-sm text-gray-500 dark:text-gray-400">Добрый день,</p>
                            <h2 className="text-xl font-bold text-textDark dark:text-white">{userName}</h2>
                        </div>
                    </div>

                    <div className="px-4 py-2 flex overflow-x-auto snap-x snap-mandatory no-scrollbar space-x-4">
                        <div className="min-w-[90%] snap-center bg-gradient-to-r from-primary to-purple-600 rounded-3xl p-5 text-white shadow-lg relative overflow-hidden flex-shrink-0">
                            <i className="fa-solid fa-wallet absolute -right-4 -bottom-4 text-white opacity-10 text-6xl"></i>
                            <div className="flex justify-between items-center mb-1 relative z-10"><span className="text-sm text-purple-200">Общий баланс</span></div>
                            <h2 className="text-3xl font-bold mb-4 relative z-10">{formatMoney(currentBalance)}</h2>
                            <div className="flex justify-between relative z-10">
                                <div><p className="text-xs text-purple-200">Доходы</p><p className="font-semibold text-sm">{formatMoney(totalIncome)}</p></div>
                                <div className="text-right"><p className="text-xs text-purple-200">Расходы</p><p className="font-semibold text-sm">{formatMoney(-totalExpense)}</p></div>
                            </div>
                        </div>
                    </div>

                    <div className="flex justify-between px-6 py-4">
                        <div className="flex flex-col items-center gap-1 cursor-pointer" onClick={() => document.getElementById('mainAddBtn')?.click()}><div className="w-12 h-12 bg-blue-100 dark:bg-blue-900/40 rounded-2xl flex items-center justify-center text-blue-500 text-xl"><i className="fa-solid fa-arrow-down"></i></div><span className="text-xs font-medium text-gray-600 dark:text-gray-400">Доход</span></div>
                        <div className="flex flex-col items-center gap-1 cursor-pointer" onClick={() => document.getElementById('mainAddBtn')?.click()}><div className="w-12 h-12 bg-red-100 dark:bg-red-900/40 rounded-2xl flex items-center justify-center text-red-500 text-xl"><i className="fa-solid fa-arrow-up"></i></div><span className="text-xs font-medium text-gray-600 dark:text-gray-400">Расход</span></div>
                        <div className="flex flex-col items-center gap-1 cursor-pointer" onClick={() => setScreen('calculator')}><div className="w-12 h-12 bg-purple-100 dark:bg-purple-900/40 rounded-2xl flex items-center justify-center text-primary text-xl"><i className="fa-solid fa-calculator"></i></div><span className="text-xs font-medium text-gray-600 dark:text-gray-400">Вклад</span></div>
                        <div className="flex flex-col items-center gap-1 cursor-pointer" onClick={() => setScreen('goals')}><div className="w-12 h-12 bg-green-100 dark:bg-green-900/40 rounded-2xl flex items-center justify-center text-green-500 text-xl"><i className="fa-solid fa-bullseye"></i></div><span className="text-xs font-medium text-gray-600 dark:text-gray-400">Цель</span></div>
                    </div>

                    <div className="px-4 py-4">
                        <div className="flex justify-between items-center mb-3">
                            <h3 className="font-bold text-textDark dark:text-white transition-colors">Последние операции</h3>
                            <button onClick={() => setScreen('analytics')} className="text-xs font-medium text-primary">Все</button>
                        </div>
                        <div className="space-y-3">
                            {transactions.length === 0 ? (
                                <p className="text-center text-sm text-gray-400 py-4">У вас пока нет транзакций.</p>
                            ) : transactions.slice(0, 4).map(t => (
                                <div key={t.id} onClick={() => onTransactionClick(t)} className="flex items-center justify-between bg-white dark:bg-gray-900 p-3 rounded-2xl shadow-sm active:bg-gray-50 transition-colors cursor-pointer">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${t.bg} dark:bg-opacity-20 ${t.color}`}><i className={`fa-solid ${t.icon}`}></i></div>
                                        <div>
                                            <h4 className="font-bold text-sm text-textDark dark:text-white">{t.title}</h4>
                                            <p className="text-xs text-gray-500 dark:text-gray-400">{t.category}</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <p className={`font-bold text-sm ${t.amount > 0 ? 'text-green-500' : 'text-textDark dark:text-white'}`}>{t.amount > 0 ? '+' : ''}{formatMoney(t.amount)}</p>
                                        {t.originalCurrency && t.originalCurrency !== 'UZS' && (
                                            <p className="text-[10px] text-gray-400">{t.originalAmount} {t.originalCurrency}</p>
                                        )}
                                        {!t.originalCurrency && <p className="text-xs text-gray-500 dark:text-gray-400">{t.date}</p>}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenAnalytics = ({ transactions, onTransactionClick, categories }) => {
            const spent = transactions.filter(t => t.amount < 0).reduce((acc, t) => {
                acc[t.category] = (acc[t.category] || 0) + Math.abs(t.amount);
                return acc;
            }, {});

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 transition-colors duration-300">
                    <TopHeader title="Расходы и Лимиты" rightIcon="fa-chart-bar" />
                    <div className="px-4 py-4 space-y-4">
                        <div className="bg-white dark:bg-gray-900 rounded-3xl p-5 shadow-sm space-y-5">
                            {categories.map(cat => {
                                const currentSpent = spent[cat.name] || 0;
                                const limit = cat.limit || 0;
                                const perc = limit > 0 ? Math.min(Math.round((currentSpent / limit) * 100), 100) : 100;
                                const isOver = limit > 0 && currentSpent > limit;
                                const barColor = isOver ? 'bg-red-500' : cat.barBg;

                                return (
                                    <div key={cat.name}>
                                        <div className="flex justify-between items-center mb-2">
                                            <div className="flex items-center gap-2.5">
                                                <div className={`w-8 h-8 rounded-xl flex items-center justify-center ${cat.bg} dark:bg-opacity-20 ${cat.color}`}><i className={`fa-solid ${cat.icon} text-sm`}></i></div>
                                                <span className="text-sm font-bold text-textDark dark:text-white">{cat.name}</span>
                                            </div>
                                            <div className="text-right"><span className={`text-sm font-bold ${isOver ? 'text-red-500' : 'text-textDark dark:text-white'}`}>{formatMoney(currentSpent)}</span></div>
                                        </div>
                                        {limit > 0 ? (
                                            <>
                                                <div className="w-full bg-gray-100 dark:bg-gray-800 rounded-full h-2.5 mb-1 overflow-hidden">
                                                    <div className={`${barColor} h-2.5 rounded-full transition-all duration-700 ease-out`} style={{width: `${perc}%`}}></div>
                                                </div>
                                                <div className="flex justify-between mt-1">
                                                    <span className={`text-[10px] font-medium ${isOver ? 'text-red-500' : 'text-gray-500'}`}>{isOver ? 'Лимит превышен!' : `Осталось: ${formatMoney(limit - currentSpent)}`}</span>
                                                    <span className="text-[10px] text-gray-400">из {formatMoney(limit)}</span>
                                                </div>
                                            </>
                                        ) : (
                                            <p className="text-[10px] text-gray-400 mt-1">Без лимита</p>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenCalculator = ({ onBack }) => (
            <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 transition-colors">
                <TopHeader title="Калькулятор вклада" showBack={true} onBack={onBack} />
                <div className="px-4 py-4 space-y-4">
                    <div className="bg-white dark:bg-gray-900 p-4 rounded-2xl shadow-sm space-y-3">
                        <div className="flex justify-between border-b border-gray-100 dark:border-gray-800 pb-3"><span className="text-sm text-gray-500">Сумма вклада</span><span className="font-bold text-textDark dark:text-white">10 000 000 сум</span></div>
                        <div className="flex justify-between border-b border-gray-100 dark:border-gray-800 pb-3"><span className="text-sm text-gray-500">Процентная ставка</span><span className="font-bold text-textDark dark:text-white">18 % годовых</span></div>
                        <div className="flex justify-between"><span className="text-sm text-gray-500">Срок вклада</span><span className="font-bold text-textDark dark:text-white">12 месяцев</span></div>
                    </div>
                    <div className="bg-gradient-to-r from-primary to-purple-600 rounded-3xl p-5 text-white shadow-lg relative overflow-hidden">
                        <i className="fa-solid fa-calculator absolute -right-4 -top-4 text-white opacity-10 text-6xl"></i>
                        <p className="text-sm text-purple-200 relative z-10 mb-1">Итоговая сумма</p>
                        <h2 className="text-3xl font-bold mb-2 relative z-10">11 895 000 сум</h2>
                        <div className="relative z-10"><p className="text-xs text-purple-200 mb-1">Прибыль</p><p className="text-sm text-emerald-300 font-bold bg-white/10 inline-block px-2 py-1 rounded">+1 895 000 сум (18.95%)</p></div>
                    </div>
                </div>
            </div>
        );

        const ScreenGoals = ({ onBack }) => (
            <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 transition-colors">
                <TopHeader title="Цели" showBack={true} onBack={onBack} rightIcon="fa-plus" />
                <div className="px-4 pt-4 space-y-4">
                    <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm border border-gray-50 dark:border-gray-800">
                        <div className="flex justify-between items-start mb-2">
                            <div><h4 className="font-bold text-textDark dark:text-white">Новая кухня</h4><p className="text-xs text-gray-500 mt-1">600 000 / 2 000 000 сум</p></div>
                            <div className="text-2xl w-12 h-12 bg-gray-50 dark:bg-gray-800 rounded-xl flex items-center justify-center">🍳</div>
                        </div>
                        <div className="w-full bg-gray-100 dark:bg-gray-800 rounded-full h-2.5 mb-2"><div className="bg-primary h-2.5 rounded-full" style={{width: '30%'}}></div></div>
                        <div className="flex justify-between text-xs text-gray-500"><span>Осталось 8 месяцев</span><span className="font-bold text-textDark dark:text-gray-300">30%</span></div>
                    </div>
                    <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm border border-gray-50 dark:border-gray-800">
                        <div className="flex justify-between items-start mb-2">
                            <div><h4 className="font-bold text-textDark dark:text-white">Путешествие в Турцию</h4><p className="text-xs text-gray-500 mt-1">3 200 000 / 8 000 000 сум</p></div>
                            <div className="text-2xl w-12 h-12 bg-gray-50 dark:bg-gray-800 rounded-xl flex items-center justify-center">✈️</div>
                        </div>
                        <div className="w-full bg-gray-100 dark:bg-gray-800 rounded-full h-2.5 mb-2"><div className="bg-blue-500 h-2.5 rounded-full" style={{width: '40%'}}></div></div>
                        <div className="flex justify-between text-xs text-gray-500"><span>Осталось 12 месяцев</span><span className="font-bold text-textDark dark:text-gray-300">40%</span></div>
                    </div>
                </div>
            </div>
        );

        const ScreenProduct = ({ onBack }) => {
            const chartRef = useRef(null);
            useEffect(() => {
                const ctx = document.getElementById('priceChart');
                if (ctx && !chartRef.current) {
                    chartRef.current = new Chart(ctx, {
                        type: 'line',
                        data: { labels: ['Фев', 'Мар', 'Апр', 'Май'], datasets: [{ data: [3500, 4000, 4800, 6250], borderColor: '#7C3AED', backgroundColor: 'rgba(124, 58, 237, 0.1)', fill: true, tension: 0.4 }] },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false, min: 3000 }, x: { grid: { display: false }, border: {display: false} } } }
                    });
                }
            }, []);
            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 transition-colors">
                    <TopHeader title="Продукт" showBack={true} onBack={onBack} rightIcon="fa-star" />
                    <div className="px-4 py-2">
                        <div className="flex items-center gap-3 mb-6"><div className="w-16 h-16 bg-orange-100 dark:bg-orange-900/30 rounded-2xl flex items-center justify-center text-3xl">🥔</div><div><h2 className="text-2xl font-bold text-textDark dark:text-white">Картошка</h2><p className="text-sm text-gray-500">Все магазины</p></div></div>
                        <div className="mb-6"><p className="text-sm text-gray-500 mb-1">Средняя цена</p><h3 className="text-3xl font-bold text-textDark dark:text-white">6 250 <span className="text-lg text-gray-500">сум/кг</span></h3><p className="text-xs text-red-500 mt-1"><i className="fa-solid fa-arrow-trend-up"></i> +24% за 3 месяца</p></div>
                        <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 h-48 mb-4 shadow-sm"><canvas id="priceChart"></canvas></div>
                        <div className="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-2xl border border-blue-100 dark:border-blue-800"><div className="flex gap-3"><div className="text-primary text-xl"><i className="fa-solid fa-robot"></i></div><div><h4 className="font-bold text-textDark dark:text-white text-sm mb-1">Умный совет</h4><p className="text-xs text-gray-600 dark:text-gray-300">Вы покупали дешевле на 35% в феврале. Лучшее время для покупки оптом: февраль-март.</p></div></div></div>
                    </div>
                </div>
            );
        };

        const ScreenTips = ({ openAIChat }) => (
            <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 transition-colors relative">
                <TopHeader title="Советы" rightIcon="fa-bell" />
                <div className="px-4 py-4 space-y-4">
                    <h3 className="font-bold text-textDark dark:text-white">Анализ ваших финансов</h3>
                    <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm flex gap-4 border border-green-100 dark:border-green-900/30">
                        <div className="w-10 h-10 rounded-full bg-green-100 dark:bg-green-900/30 flex items-center justify-center text-green-500 text-xl shrink-0">🎉</div>
                        <div><h4 className="font-bold text-sm text-textDark dark:text-white">Отличная работа!</h4><p className="text-sm text-gray-600 dark:text-gray-400 mt-1">Вы используете умный анализ финансов.</p></div>
                    </div>
                    <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm flex gap-4 border border-amber-100 dark:border-amber-900/30">
                        <div className="w-10 h-10 rounded-full bg-amber-100 dark:bg-amber-900/30 flex items-center justify-center text-amber-500 text-xl shrink-0">🍔</div>
                        <div><h4 className="font-bold text-sm text-textDark dark:text-white">Траты на еду</h4><p className="text-sm text-gray-600 dark:text-gray-400 mt-1">Попробуйте готовить дома, это сэкономит до 500 000 сум в месяц.</p></div>
                    </div>
                </div>
                <button onClick={openAIChat} className="fixed bottom-24 right-4 w-14 h-14 bg-gradient-to-r from-primary to-purple-600 rounded-full shadow-lg flex items-center justify-center text-white text-2xl hover:scale-105 transition-transform z-40">
                    <i className="fa-solid fa-robot"></i><span className="absolute top-0 right-0 w-3.5 h-3.5 bg-red-500 border-2 border-[#F9FAFB] dark:border-gray-950 rounded-full"></span>
                </button>
            </div>
        );

        const ScreenAIChat = ({ onBack, userId }) => {
            const [messages, setMessages] = useState([{ type: 'bot', text: 'Привет! Я подключен к Gemini и вижу ваши расходы в базе данных. Чем могу помочь?' }]);
            const [inputText, setInputText] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const sendPrompt = async (text) => {
                if (!text.trim()) return;
                setMessages(p => [...p, { type: 'user', text }]);
                setInputText(''); setIsTyping(true);
                try {
                    const res = await fetch(`https://mytest-production-6436.up.railway.app/api/chat`, { method: 'POST', headers: {'Content-Type':'application/json','x-tg-user-id':userId}, body: JSON.stringify({message:text})});
                    const data = await res.json();
                    setMessages(p => [...p, { type: 'bot', text: data.reply || "Сбой связи." }]);
                } catch(e) {
                    setMessages(p => [...p, { type: 'bot', text: 'Сервер сейчас недоступен.' }]);
                } finally { setIsTyping(false); }
            };
            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen flex flex-col animate-fade-in z-50 relative transition-colors">
                    <TopHeader title="Финансовый помощник" showBack={true} onBack={onBack} />
                    <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-32">
                        {messages.map((m, i) => (
                            <div key={i} className={`flex ${m.type === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[80%] rounded-2xl p-3 text-sm ${m.type === 'user' ? 'bg-gray-200 dark:bg-gray-800 text-textDark dark:text-white rounded-tr-sm' : 'bg-primary text-white rounded-tl-sm shadow-sm'}`}>
                                    {m.text}
                                </div>
                            </div>
                        ))}
                        {isTyping && (
                            <div className="flex justify-start">
                                <div className="bg-primary text-white rounded-2xl rounded-tl-sm p-3 shadow-md flex items-center gap-1">
                                    <span className="w-2 h-2 bg-white rounded-full animate-bounce"></span>
                                    <span className="w-2 h-2 bg-white rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></span>
                                    <span className="w-2 h-2 bg-white rounded-full animate-bounce" style={{animationDelay: '0.4s'}}></span>
                                </div>
                            </div>
                        )}
                    </div>
                    <div className="fixed bottom-0 w-full max-w-md p-4 bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800">
                        <div className="flex gap-2">
                            <input value={inputText} onChange={e=>setInputText(e.target.value)} onKeyPress={e=>e.key==='Enter'&&sendPrompt(inputText)} placeholder="Спросите Gemini..." className="flex-1 bg-gray-100 dark:bg-gray-800 text-textDark dark:text-white rounded-full px-4 py-3 focus:outline-none" />
                            <button onClick={()=>sendPrompt(inputText)} className="w-11 h-11 bg-primary text-white rounded-full flex items-center justify-center"><i className="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenProfile = ({ user, isDarkMode, toggleDarkMode, transactions, familyId, setFamilyId, onOpenCategorySettings }) => {
            const userName = (user && user.first_name) ? `${user.first_name}` : 'Ильхом';
            const userPhoto = (user && user.photo_url) ? user.photo_url : `https://placehold.co/150x150/7C3AED/ffffff?text=${userName.charAt(0)}`;
            const myFamilyCode = encodeFamilyId(user ? user.id.toString() : 'browser_test_user');

            const handleExport = () => {
                let csvContent = "Дата,Категория,Название,Сумма\n" + transactions.map(t => `"${t.date}","${t.category}","${t.title}",${t.amount}`).join("\n");
                const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob); link.download = `FinanceApp_Export.csv`; link.click();
            };

            return (
                <div className="bg-[#F3F4F6] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 transition-colors">
                    <TopHeader title="Профиль" rightIcon="fa-gear" />
                    <div className="bg-white dark:bg-gray-900 px-4 py-6 mb-2 flex items-center gap-4"><img src={userPhoto} alt="Аватар" className="w-16 h-16 rounded-full border-2 border-primaryLight shadow-sm object-cover" /><div><h2 className="text-xl font-bold text-textDark dark:text-white">{userName}</h2><p className="text-gray-500 text-sm font-medium">Premium</p></div></div>
                    
                    <div className="bg-white dark:bg-gray-900 px-4 py-4 mb-2">
                        <h3 className="font-bold text-textDark dark:text-white mb-3">Семейный бюджет</h3>
                        {familyId ? (
                            <div className="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-2xl border border-blue-100 dark:border-blue-800">
                                <p className="text-sm text-textDark dark:text-white mb-3">Вы подключены к семье (ID: <strong>{familyId}</strong>).</p>
                                <button onClick={() => { setFamilyId(null); localStorage.removeItem('financeAppFamilyId'); window.location.reload(); }} className="w-full py-3 bg-red-500 text-white rounded-xl text-sm font-bold shadow-md">Отключиться и вернуть свой</button>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                <p className="text-xs text-gray-500">Поделитесь кодом с близкими или введите их код.</p>
                                <div className="bg-gray-50 dark:bg-gray-800 p-3 rounded-xl border border-gray-200 dark:border-gray-700 flex justify-between items-center"><div><p className="text-xs text-gray-500">Ваш код семьи:</p><p className="font-mono text-lg tracking-widest font-bold text-textDark dark:text-white">{myFamilyCode}</p></div></div>
                                <div className="flex gap-2">
                                    <input id="joinFamilyInput" type="text" maxLength="15" placeholder="Например: FAM-..." className="flex-1 uppercase bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-sm text-textDark dark:text-white focus:outline-none" />
                                    <button onClick={() => { const code = document.getElementById('joinFamilyInput').value.trim().toUpperCase(); if (!code.startsWith('FAM-')) { alert('Неверный формат!'); return; } setFamilyId(code); localStorage.setItem('financeAppFamilyId', code); window.location.reload(); }} className="bg-primary text-white px-4 py-2 rounded-xl text-sm font-bold">Вступить</button>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="bg-white dark:bg-gray-900 px-4 py-2 mt-2">
                        {[
                            { id: 'categories', icon: 'fa-icons', title: 'Мои категории', color: 'text-amber-500', bg: 'bg-amber-100 dark:bg-amber-900/30' },
                            { id: 'theme', icon: 'fa-moon', title: 'Темная тема', value: isDarkMode ? 'Вкл' : 'Выкл', color: 'text-indigo-500', bg: 'bg-indigo-100 dark:bg-indigo-900/30' },
                            { id: 'export', icon: 'fa-file-csv', title: 'Экспорт данных', color: 'text-emerald-500', bg: 'bg-emerald-100 dark:bg-emerald-900/30' },
                        ].map((item, i) => (
                            <div key={i} onClick={() => { if(item.id==='theme') toggleDarkMode(); if(item.id==='export') handleExport(); if(item.id==='categories') onOpenCategorySettings(); }} className="flex items-center justify-between py-3.5 border-b border-gray-50 dark:border-gray-800/50 last:border-0 active:bg-gray-50 cursor-pointer">
                                <div className="flex items-center gap-4"><div className={`w-9 h-9 rounded-full flex items-center justify-center ${item.bg} ${item.color}`}><i className={`fa-solid ${item.icon} text-sm`}></i></div><span className="text-textDark dark:text-white font-bold text-sm">{item.title}</span></div>
                                <div className="flex items-center gap-2">{item.value && <span className="text-xs font-medium text-gray-400">{item.value}</span>}<i className="fa-solid fa-chevron-right text-gray-300 text-xs"></i></div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentScreen, setCurrentScreen] = useState('home');
            const [isAddingMode, setIsAddingMode] = useState(false);
            const [isLoading, setIsLoading] = useState(true);
            const [transactions, setTransactions] = useState([]);
            const [isSplashVisible, setIsSplashVisible] = useState(true);
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('financeAppTheme') === 'dark');
            const [tgUser, setTgUser] = useState(null);
            
            const [addMethod, setAddMethod] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            const [scannedData, setScannedData] = useState({});
            const [selectedTransaction, setSelectedTransaction] = useState(null);
            
            const [familyId, setFamilyId] = useState(() => {
                const saved = localStorage.getItem('financeAppFamilyId');
                if (saved && !saved.startsWith('FAM-')) { localStorage.removeItem('financeAppFamilyId'); return null; }
                return saved;
            });

            const [exchangeRates, setExchangeRates] = useState({ USD: 12650, EUR: 13600 });
            const [txCurrency, setTxCurrency] = useState('UZS');
            const [txAmount, setTxAmount] = useState('');

            // Categories logic
            const defaultCategories = [
                { name: 'Продукты', icon: 'fa-basket-shopping', color: 'text-orange-500', bg: 'bg-orange-100', barBg: 'bg-orange-500', limit: 2000000 },
                { name: 'Транспорт', icon: 'fa-bus', color: 'text-blue-500', bg: 'bg-blue-100', barBg: 'bg-blue-500', limit: 500000 },
                { name: 'Еда вне дома', icon: 'fa-utensils', color: 'text-amber-600', bg: 'bg-amber-100', barBg: 'bg-amber-500', limit: 1000000 },
                { name: 'Развлечения', icon: 'fa-play', color: 'text-pink-500', bg: 'bg-pink-100', barBg: 'bg-pink-500', limit: 1000000 },
                { name: 'Покупки', icon: 'fa-bag-shopping', color: 'text-purple-500', bg: 'bg-purple-100', barBg: 'bg-purple-500', limit: 1000000 }
            ];
            const [categories, setCategories] = useState(() => {
                const saved = localStorage.getItem('financeAppCategories');
                return saved ? JSON.parse(saved) : defaultCategories;
            });
            const [isCategoryModalOpen, setIsCategoryModalOpen] = useState(false);
            const [newCatName, setNewCatName] = useState('');
            const [newCatIcon, setNewCatIcon] = useState('fa-paw');
            const [newCatColor, setNewCatColor] = useState(0);

            const availableIcons = ['fa-paw', 'fa-gamepad', 'fa-car', 'fa-house', 'fa-heart', 'fa-plane', 'fa-book', 'fa-dumbbell', 'fa-gift', 'fa-laptop'];
            const availableColorPalettes = [
                { c: 'text-blue-500', bg: 'bg-blue-100', bBg: 'bg-blue-500', hex: '#3B82F6' },
                { c: 'text-emerald-500', bg: 'bg-emerald-100', bBg: 'bg-emerald-500', hex: '#10B981' },
                { c: 'text-purple-500', bg: 'bg-purple-100', bBg: 'bg-purple-500', hex: '#8B5CF6' },
                { c: 'text-rose-500', bg: 'bg-rose-100', bBg: 'bg-rose-500', hex: '#F43F5E' },
                { c: 'text-orange-500', bg: 'bg-orange-100', bBg: 'bg-orange-500', hex: '#F97316' },
            ];

            const getEffectiveUserId = () => {
                if (familyId) { const decoded = decodeFamilyId(familyId); if (decoded) return decoded; }
                return tgUser ? tgUser.id.toString() : 'browser_test_user';
            };

            useEffect(() => { localStorage.setItem('financeAppCategories', JSON.stringify(categories)); }, [categories]);

            useEffect(() => {
                let initialUserId = 'browser_test_user';
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.expand();
                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        setTgUser(tg.initDataUnsafe.user);
                        initialUserId = tg.initDataUnsafe.user.id.toString();
                    }
                    if (tg.colorScheme === 'dark' && !localStorage.getItem('financeAppTheme')) setIsDarkMode(true);
                }

                fetch(`${API_URL}/rates`).then(res => res.json()).then(data => setExchangeRates(data)).catch(() => {});
                fetch(`${API_URL}/transactions`, { headers: { 'x-tg-user-id': familyId ? decodeFamilyId(familyId) || initialUserId : initialUserId } })
                    .then(res => res.json())
                    .then(data => { if (Array.isArray(data)) setTransactions(data); setIsLoading(false); })
                    .catch(() => setIsLoading(false));
                setTimeout(() => setIsSplashVisible(false), 2000);
            }, []);

            useEffect(() => {
                if (isDarkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('financeAppTheme', 'dark'); } 
                else { document.documentElement.classList.remove('dark'); localStorage.setItem('financeAppTheme', 'light'); }
            }, [isDarkMode]);

            const handleVoiceSimulate = () => {
                setAddMethod('voice');
                setIsProcessing(true);
                setTimeout(() => {
                    setIsProcessing(false);
                    setScannedData({ title: 'Проезд', category: 'Транспорт' });
                    setTxAmount(15000);
                    setAddMethod('manual_prefilled');
                }, 2000);
            };

            const handleReceiptScan = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setAddMethod('scan'); setIsProcessing(true);
                const reader = new FileReader();
                reader.onloadend = async () => {
                    try {
                        const res = await fetch(`${API_URL}/scan`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'x-tg-user-id': getEffectiveUserId() },
                            body: JSON.stringify({ imageBase64: reader.result.split(',')[1], mimeType: file.type })
                        });
                        const data = await res.json();
                        setScannedData({ amount: data.amount || '', title: data.title || '', category: data.category || categories[0].name });
                        setTxAmount(data.amount || '');
                        setAddMethod('manual_prefilled');
                    } catch (error) { alert("Не удалось прочитать чек."); } finally { setIsProcessing(false); }
                };
                reader.readAsDataURL(file);
            };

            const handleManualAdd = async (e) => {
                e.preventDefault();
                let finalAmount = parseFloat(txAmount);
                const title = e.target.title.value;
                const categoryName = e.target.category.value;
                if(!finalAmount || !title) return;

                if (txCurrency === 'USD') finalAmount = finalAmount * exchangeRates.USD;
                if (txCurrency === 'EUR') finalAmount = finalAmount * exchangeRates.EUR;

                const selectedCat = categories.find(c => c.name === categoryName) || categories[0];
                const d = new Date();
                const dateString = d.getDate().toString().padStart(2, '0') + '.' + (d.getMonth() + 1).toString().padStart(2, '0') + ' ' + d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');

                const newTxPayload = {
                    title, category: categoryName, amount: -finalAmount, date: dateString, rawDate: new Date().toISOString(),
                    icon: selectedCat.icon, color: selectedCat.color, bg: selectedCat.bg,
                    originalCurrency: txCurrency, originalAmount: txCurrency !== 'UZS' ? txAmount : null
                };

                try {
                    const res = await fetch(`${API_URL}/transactions`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-tg-user-id': getEffectiveUserId() }, body: JSON.stringify(newTxPayload) });
                    const savedTx = await res.json();
                    setTransactions([savedTx, ...transactions]);
                    setIsAddingMode(false); setAddMethod(null); setTxAmount(''); setTxCurrency('UZS');
                } catch (error) { alert("Ошибка сохранения."); }
            };

            const handleDeleteTransaction = async (id) => {
                try {
                    await fetch(`${API_URL}/transactions/${id}`, { method: 'DELETE', headers: { 'x-tg-user-id': getEffectiveUserId() } });
                    setTransactions(transactions.filter(t => t.id !== id));
                    setSelectedTransaction(null);
                } catch (error) { alert("Не удалось удалить."); }
            };

            const handleTransactionClick = (t) => {
                if (t.category === 'Продукты') setCurrentScreen('product');
                else setSelectedTransaction(t);
            };

            const createCategory = () => {
                if(!newCatName.trim()) return;
                const palette = availableColorPalettes[newCatColor];
                setCategories([...categories, { name: newCatName, icon: newCatIcon, color: palette.c, bg: palette.bg, barBg: palette.bBg, limit: 1000000 }]);
                setNewCatName('');
            };

            const renderScreen = () => {
                if (isLoading) return <div className="h-screen flex items-center justify-center"><i className="fa-solid fa-circle-notch fa-spin text-4xl text-primary"></i></div>;
                switch(currentScreen) {
                    case 'home': return <ScreenHome setScreen={setCurrentScreen} transactions={transactions} user={tgUser} onTransactionClick={handleTransactionClick} />;
                    case 'analytics': return <ScreenAnalytics transactions={transactions} onTransactionClick={handleTransactionClick} categories={categories} />;
                    case 'product': return <ScreenProduct onBack={() => setCurrentScreen('home')} />;
                    case 'calculator': return <ScreenCalculator onBack={() => setCurrentScreen('home')} />;
                    case 'goals': return <ScreenGoals onBack={() => setCurrentScreen('home')} />;
                    case 'tips': return <ScreenTips openAIChat={() => setCurrentScreen('aichat')} />;
                    case 'aichat': return <ScreenAIChat onBack={() => setCurrentScreen('tips')} userId={getEffectiveUserId()} />;
                    case 'profile': return <ScreenProfile user={tgUser} isDarkMode={isDarkMode} toggleDarkMode={() => setIsDarkMode(!isDarkMode)} transactions={transactions} familyId={familyId} setFamilyId={setFamilyId} onOpenCategorySettings={() => setIsCategoryModalOpen(true)} />;
                    default: return <ScreenHome setScreen={setCurrentScreen} transactions={transactions} user={tgUser} onTransactionClick={handleTransactionClick} />;
                }
            };

            if (isSplashVisible) return (
                <div className="h-screen w-full bg-primary flex flex-col items-center justify-center text-white relative z-[100]">
                    <div className="w-24 h-24 bg-white rounded-3xl flex items-center justify-center shadow-2xl mb-6 animate-pulse"><i className="fa-solid fa-wallet text-5xl text-primary"></i></div>
                    <h1 className="text-3xl font-bold mb-2">Finance<span className="font-light">AI</span></h1>
                </div>
            );

            return (
                <div className="max-w-md mx-auto bg-bgLight dark:bg-bgDark min-h-screen relative shadow-2xl overflow-hidden transition-colors">
                    {renderScreen()}

                    {/* Транзакция Детали (Удаление) */}
                    {selectedTransaction && (
                        <div className="fixed inset-0 z-[60] flex items-end">
                            <div className="absolute inset-0 bg-black/50 backdrop-blur-sm" onClick={() => setSelectedTransaction(null)}></div>
                            <div className="bg-white dark:bg-gray-900 w-full rounded-t-3xl p-6 relative z-10 animate-fade-in">
                                <div className="w-12 h-1.5 bg-gray-200 dark:bg-gray-700 rounded-full mx-auto mb-6"></div>
                                <div className="text-center mb-6">
                                    <div className={`w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-3 ${selectedTransaction.bg} dark:bg-opacity-20 ${selectedTransaction.color} text-2xl`}>
                                        <i className={`fa-solid ${selectedTransaction.icon}`}></i>
                                    </div>
                                    <h3 className="text-xl font-bold text-textDark dark:text-white mb-1">{selectedTransaction.title}</h3>
                                    <p className="text-sm text-gray-500">{selectedTransaction.category} • {selectedTransaction.date}</p>
                                    <h2 className={`text-3xl font-bold mt-4 ${selectedTransaction.amount > 0 ? 'text-green-500' : 'text-textDark dark:text-white'}`}>
                                        {selectedTransaction.amount > 0 ? '+' : ''}{formatMoney(selectedTransaction.amount)}
                                    </h2>
                                </div>
                                <button onClick={() => handleDeleteTransaction(selectedTransaction.id)} className="w-full bg-red-50 text-red-500 dark:bg-red-900/20 font-bold py-3.5 rounded-2xl mb-4">Удалить операцию</button>
                                <button onClick={() => setSelectedTransaction(null)} className="w-full bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold py-3.5 rounded-2xl">Закрыть</button>
                            </div>
                        </div>
                    )}

                    {/* МОДАЛКА: Категории и Лимиты */}
                    {isCategoryModalOpen && (
                        <div className="fixed inset-0 z-[80] flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm">
                            <div className="bg-white dark:bg-gray-900 w-full h-[85vh] rounded-t-3xl sm:rounded-3xl p-6 animate-fade-in relative z-10 flex flex-col">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-bold text-textDark dark:text-white">Настройки категорий</h3>
                                    <button onClick={() => setIsCategoryModalOpen(false)} className="text-gray-400"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>

                                <div className="overflow-y-auto mb-6 pr-2 space-y-3 no-scrollbar flex-1 border-b border-gray-100 dark:border-gray-800 pb-4">
                                    {categories.map((cat, idx) => (
                                        <div key={idx} className="flex flex-col gap-2 bg-gray-50 dark:bg-gray-800 p-3 rounded-2xl">
                                            <div className="flex justify-between items-center">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${cat.bg} dark:bg-opacity-20 ${cat.color}`}><i className={`fa-solid ${cat.icon}`}></i></div>
                                                    <span className="font-bold text-sm text-textDark dark:text-white">{cat.name}</span>
                                                </div>
                                                {categories.length > 1 && (
                                                    <button onClick={() => setCategories(categories.filter((_, i) => i !== idx))} className="text-red-500 w-8 h-8 flex items-center justify-center rounded-lg hover:bg-red-100 dark:hover:bg-red-900/30 transition-colors">
                                                        <i className="fa-solid fa-trash text-sm"></i>
                                                    </button>
                                                )}
                                            </div>
                                            <div className="flex items-center justify-between pl-1">
                                                <span className="text-xs text-gray-500 font-medium">Лимит (сум):</span>
                                                <input
                                                    type="number"
                                                    value={cat.limit || 0}
                                                    onChange={(e) => {
                                                        const val = parseInt(e.target.value) || 0;
                                                        const newCats = [...categories];
                                                        newCats[idx].limit = val;
                                                        setCategories(newCats);
                                                    }}
                                                    className="w-28 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg px-2 py-1.5 text-sm text-right font-bold text-textDark dark:text-white focus:outline-none"
                                                />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                
                                <div className="mt-auto">
                                    <h4 className="font-bold text-sm text-textDark dark:text-white mb-3">Добавить новую</h4>
                                    <input value={newCatName} onChange={e=>setNewCatName(e.target.value)} placeholder="Название (напр. Питомцы)" className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 mb-4 text-textDark dark:text-white focus:outline-none" />
                                    <p className="text-xs text-gray-500 mb-2">Иконка</p>
                                    <div className="flex gap-3 overflow-x-auto no-scrollbar mb-4 py-1">
                                        {availableIcons.map(ic => <div key={ic} onClick={() => setNewCatIcon(ic)} className={`w-12 h-12 flex-shrink-0 rounded-full flex items-center justify-center text-xl cursor-pointer transition-all ${newCatIcon === ic ? 'bg-primary text-white scale-110 shadow-md' : 'bg-gray-100 dark:bg-gray-800 text-gray-500'}`}><i className={`fa-solid ${ic}`}></i></div>)}
                                    </div>
                                    <p className="text-xs text-gray-500 mb-2">Цвет</p>
                                    <div className="flex gap-3 mb-4 overflow-x-auto no-scrollbar">
                                        {availableColorPalettes.map((pal, idx) => <div key={idx} onClick={() => setNewCatColor(idx)} className={`w-10 h-10 flex-shrink-0 rounded-full cursor-pointer transition-transform ${newCatColor === idx ? 'scale-125 shadow-lg border-2 border-white dark:border-gray-900' : ''}`} style={{backgroundColor: pal.hex}}></div>)}
                                    </div>
                                    <button onClick={createCategory} className="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-lg">Создать</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* МОДАЛКА: Добавление расхода */}
                    {isAddingMode && (
                        <div className="fixed inset-0 z-[60] flex items-end">
                            <div className="absolute inset-0 bg-black/50 backdrop-blur-sm" onClick={() => { setIsAddingMode(false); setAddMethod(null); setTxAmount(''); }}></div>
                            <div className="bg-white dark:bg-gray-900 w-full rounded-t-3xl p-6 relative z-10 animate-fade-in">
                                <div className="w-12 h-1.5 bg-gray-200 dark:bg-gray-700 rounded-full mx-auto mb-6"></div>
                                <input type="file" accept="image/*" capture="environment" id="cameraInput" className="hidden" onChange={handleReceiptScan} />

                                {!addMethod && (
                                    <>
                                        <h3 className="text-xl font-bold text-center mb-6 text-textDark dark:text-white">Добавить расход</h3>
                                        <div className="grid grid-cols-3 gap-3 mb-6">
                                            <div onClick={handleVoiceSimulate} className="flex flex-col items-center gap-2 cursor-pointer bg-gray-50 dark:bg-gray-800 p-3 rounded-2xl active:bg-gray-100">
                                                <div className="w-14 h-14 bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center text-blue-500 text-xl"><i className="fa-solid fa-microphone"></i></div>
                                                <span className="text-[10px] font-bold text-textDark dark:text-gray-200">Голосом</span>
                                            </div>
                                            <div onClick={() => document.getElementById('cameraInput').click()} className="flex flex-col items-center gap-2 cursor-pointer bg-gray-50 dark:bg-gray-800 p-3 rounded-2xl active:bg-gray-100">
                                                <div className="w-14 h-14 bg-green-100 dark:bg-green-900/30 rounded-full flex items-center justify-center text-green-500 text-xl"><i className="fa-solid fa-camera"></i></div>
                                                <span className="text-[10px] font-bold text-textDark dark:text-gray-200">Скан чека</span>
                                            </div>
                                            <div onClick={() => setAddMethod('manual')} className="flex flex-col items-center gap-2 cursor-pointer bg-gray-50 dark:bg-gray-800 p-3 rounded-2xl active:bg-gray-100">
                                                <div className="w-14 h-14 bg-purple-100 dark:bg-purple-900/30 rounded-full flex items-center justify-center text-primary text-xl"><i className="fa-solid fa-pen"></i></div>
                                                <span className="text-[10px] font-bold text-textDark dark:text-gray-200">Вручную</span>
                                            </div>
                                        </div>
                                    </>
                                )}

                                {addMethod === 'voice' && (
                                    <div className="py-8 text-center flex flex-col items-center">
                                        <div className="w-20 h-20 bg-blue-100 dark:bg-blue-900/50 rounded-full flex items-center justify-center text-blue-500 text-3xl mb-4 relative">
                                            {isProcessing ? <i className="fa-solid fa-microphone animate-ping-slow"></i> : <i className="fa-solid fa-check text-green-500"></i>}
                                        </div>
                                        <h3 className="text-lg font-bold text-textDark dark:text-white">{isProcessing ? "Внимательно слушаю..." : "Распознано!"}</h3>
                                        {isProcessing && <p className="text-sm text-gray-500 mt-2">Скажите: "Проезд 15 тысяч"</p>}
                                    </div>
                                )}

                                {addMethod === 'scan' && (
                                    <div className="py-6 text-center">
                                        <div className="w-48 h-64 mx-auto border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl relative overflow-hidden mb-6 flex items-center justify-center">
                                            {isProcessing ? <><i className="fa-solid fa-receipt text-6xl text-gray-300 dark:text-gray-600"></i><div className="animate-scanline"></div></> : <i className="fa-solid fa-camera text-4xl text-gray-400"></i>}
                                        </div>
                                        <h3 className="text-lg font-bold text-textDark dark:text-white">{isProcessing ? "ИИ читает чек..." : "Обработка..."}</h3>
                                    </div>
                                )}

                                {(addMethod === 'manual' || addMethod === 'manual_prefilled') && (
                                    <form onSubmit={handleManualAdd}>
                                        <h3 className="text-xl font-bold text-center mb-4 text-textDark dark:text-white">Новая операция</h3>
                                        <div className="space-y-4 mb-6">
                                            <div>
                                                <label className="text-xs text-gray-500 ml-1">Сумма и Валюта</label>
                                                <div className="flex gap-2 mt-1">
                                                    <input required type="number" name="amount" value={txAmount} onChange={e=>setTxAmount(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 text-lg font-bold text-textDark dark:text-white focus:outline-none" placeholder="0" />
                                                    <select name="currency" value={txCurrency} onChange={e=>setTxCurrency(e.target.value)} className="w-24 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-2 py-3 text-sm font-bold text-textDark dark:text-white focus:outline-none appearance-none text-center">
                                                        <option value="UZS">UZS</option>
                                                        <option value="USD">USD</option>
                                                        <option value="EUR">EUR</option>
                                                    </select>
                                                </div>
                                                {txCurrency !== 'UZS' && txAmount && <p className="text-xs text-green-500 mt-1 ml-1 font-medium"><i className="fa-solid fa-arrow-right-arrow-left"></i> ~ {formatMoney(txAmount * exchangeRates[txCurrency])} по курсу ЦБ</p>}
                                            </div>
                                            <div>
                                                <label className="text-xs text-gray-500 ml-1">Название / Место</label>
                                                <input required type="text" name="title" defaultValue={scannedData.title || ''} className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 mt-1 text-textDark dark:text-white focus:outline-none" placeholder="Например: Супермаркет" />
                                            </div>
                                            <div>
                                                <label className="text-xs text-gray-500 ml-1">Категория</label>
                                                <select name="category" defaultValue={scannedData.category || categories[0].name} className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 mt-1 text-textDark dark:text-white focus:outline-none appearance-none">
                                                    {categories.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                        <button type="submit" className="w-full bg-primary text-white font-bold py-4 rounded-2xl shadow-lg">Добавить расход</button>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Навигация */}
                    {currentScreen !== 'aichat' && currentScreen !== 'product' && currentScreen !== 'calculator' && currentScreen !== 'goals' && (
                        <div className="fixed bottom-0 w-full max-w-md bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 px-6 py-2 flex justify-between items-center z-40 transition-colors">
                            <button onClick={() => setCurrentScreen('home')} className={`flex flex-col items-center p-2 ${currentScreen === 'home' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-solid fa-house text-xl mb-1"></i><span className="text-[10px] font-medium">Главная</span></button>
                            <button onClick={() => setCurrentScreen('analytics')} className={`flex flex-col items-center p-2 ${currentScreen === 'analytics' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-solid fa-chart-pie text-xl mb-1"></i><span className="text-[10px] font-medium">Аналитика</span></button>
                            <div className="relative -top-5"><button id="mainAddBtn" onClick={() => setIsAddingMode(true)} className="w-14 h-14 bg-primary rounded-full flex items-center justify-center text-white text-2xl shadow-lg transform hover:scale-105 transition-all"><i className="fa-solid fa-plus"></i></button></div>
                            <button onClick={() => setCurrentScreen('tips')} className={`flex flex-col items-center p-2 ${currentScreen === 'tips' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-regular fa-lightbulb text-xl mb-1"></i><span className="text-[10px] font-medium">Советы</span></button>
                            <button onClick={() => setCurrentScreen('profile')} className={`flex flex-col items-center p-2 ${currentScreen === 'profile' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-regular fa-user text-xl mb-1"></i><span className="text-[10px] font-medium">Профиль</span></button>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
