<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinanceAI</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#7C3AED', primaryLight: '#8B5CF6', primaryDark: '#5B21B6', bgLight: '#F3F4F6', bgDark: '#030712', textDark: '#111827', cardDark: '#1F2937' } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes pulse-ring { 0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(124, 58, 237, 0); } 100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); } }
        .animate-pulse-ring { animation: pulse-ring 2s infinite cubic-bezier(0.66, 0, 0, 1); }
        @keyframes scanline { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
        .animate-scanline { position: absolute; left: 0; width: 100%; height: 2px; background-color: #10B981; box-shadow: 0 0 10px #10B981, 0 0 20px #10B981; animation: scanline 2s linear infinite; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-bgLight dark:bg-bgDark transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_URL = 'https://mytest-production-6436.up.railway.app/api';

        const TOP_ICONS = [
            'fa-basket-shopping', 'fa-bus', 'fa-utensils', 'fa-play', 'fa-cart-shopping', 'fa-pills', 
            'fa-car', 'fa-house', 'fa-bolt', 'fa-mobile-screen', 'fa-wifi', 'fa-plane', 'fa-dumbbell', 
            'fa-paw', 'fa-book', 'fa-gamepad', 'fa-mug-hot', 'fa-shirt', 'fa-gift', 'fa-music', 
            'fa-baby-carriage', 'fa-scissors', 'fa-hammer', 'fa-camera', 'fa-graduation-cap', 'fa-heart', 
            'fa-briefcase', 'fa-gas-pump', 'fa-tooth', 'fa-seedling', 'fa-bicycle', 'fa-burger',
            'fa-ticket', 'fa-laptop', 'fa-pen', 'fa-wallet', 'fa-piggy-bank', 'fa-coins', 'fa-gem',
            'fa-globe', 'fa-medal', 'fa-key', 'fa-truck', 'fa-tools', 'fa-umbrella', 'fa-fire',
            'fa-water', 'fa-leaf', 'fa-moon', 'fa-sun'
        ];

        const CATEGORY_COLORS = [
            'text-red-500 bg-red-100 dark:bg-red-900/30', 'text-orange-500 bg-orange-100 dark:bg-orange-900/30', 
            'text-amber-500 bg-amber-100 dark:bg-amber-900/30', 'text-green-500 bg-green-100 dark:bg-green-900/30', 
            'text-blue-500 bg-blue-100 dark:bg-blue-900/30', 'text-purple-500 bg-purple-100 dark:bg-purple-900/30',
            'text-emerald-500 bg-emerald-100 dark:bg-emerald-900/30', 'text-teal-500 bg-teal-100 dark:bg-teal-900/30', 
            'text-cyan-500 bg-cyan-100 dark:bg-cyan-900/30', 'text-sky-500 bg-sky-100 dark:bg-sky-900/30', 
            'text-indigo-500 bg-indigo-100 dark:bg-indigo-900/30', 'text-violet-500 bg-violet-100 dark:bg-violet-900/30', 
            'text-fuchsia-500 bg-fuchsia-100 dark:bg-fuchsia-900/30', 'text-pink-500 bg-pink-100 dark:bg-pink-900/30', 
            'text-rose-500 bg-rose-100 dark:bg-rose-900/30', 'text-lime-500 bg-lime-100 dark:bg-lime-900/30',
            'text-yellow-500 bg-yellow-100 dark:bg-yellow-900/30', 'text-stone-500 bg-stone-100 dark:bg-stone-900/30',
            'text-gray-500 bg-gray-100 dark:bg-gray-900/30', 'text-zinc-500 bg-zinc-100 dark:bg-zinc-900/30'
        ];

        const PRO_EMOJIS = [
            '🍔', '🚕', '🛒', '💊', '🏠', '🎮', '🐾', '👕', '📱', '✈️',
            '🍕', '🍣', '🥩', '🍩', '☕', '🍷', '🥂', '🚗', '🚌', '🚂', 
            '🛳️', '🛥️', '🚀', '⛽', '🏡', '🏢', '🛍️', '👗', '👠', '👟', 
            '💍', '💎', '💄', '💻', '⌚', '📺', '🎧', '🧸', '🎈', '📚', 
            '🖊️', '🎨', '🎵', '🎸', '⚽', '🏀', '🎾', '🏋️‍♂️', '🚴', '🏊'
        ];

        const triggerHaptic = (type = 'light') => {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred(type);
            }
        };

        const formatMoneyInput = (value) => {
            return value.replace(/\D/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        };

        const getMonthYear = (dateStr) => {
            if(!dateStr) return "";
            const parts = dateStr.split(' ');
            if(!parts[0]) return "";
            const [d, m, y] = parts[0].split('.');
            if(!m || !y) return "";
            return `${m}.${y}`;
        };

        const getMonthName = (monthYearStr) => {
            if(!monthYearStr) return "";
            const [m, y] = monthYearStr.split('.');
            const months = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
            return `${months[parseInt(m)-1]}, ${y}`;
        };

        const TopHeader = ({ title, showBack = false, onBack, rightIcon = null, onRightClick = null }) => (
            <div className="flex justify-between items-center px-4 py-4 bg-white dark:bg-gray-900 sticky top-0 z-10 transition-colors duration-300 border-b border-gray-50 dark:border-gray-800/50">
                <div className="flex items-center gap-3">
                    {showBack && (
                        <button onClick={() => {triggerHaptic('light'); onBack();}} className="text-gray-600 dark:text-gray-300 hover:text-primary transition-colors">
                            <i className="fa-solid fa-arrow-left text-lg"></i>
                        </button>
                    )}
                    <h1 className="text-xl font-bold text-textDark dark:text-white transition-colors">{title}</h1>
                </div>
                <div className="flex gap-4">
                    {rightIcon && (
                        <button onClick={() => {triggerHaptic('light'); if(onRightClick) onRightClick();}} className="text-gray-600 dark:text-gray-300 hover:text-primary transition-colors">
                            <i className={`fa-regular ${rightIcon} text-xl`}></i>
                        </button>
                    )}
                </div>
            </div>
        );

        const ScreenHome = ({ setScreen, transactions, user, onTransactionClick, activeMonth, prevMonth, nextMonth, currency, rates, openAddModal }) => {
            const userName = (user && user.first_name) ? user.first_name : 'Ильхом';
            const [activeCard, setActiveCard] = useState('all');

            const filteredTxs = activeCard === 'all' ? transactions : transactions.filter(t => t.wallet === activeCard);
            const totalIncome = transactions.filter(t => t.amount > 0).reduce((acc, curr) => acc + curr.amount, 0);
            const totalExpense = transactions.filter(t => t.amount < 0).reduce((acc, curr) => acc + Math.abs(curr.amount), 0);
            
            const baseBalance = 12150000;
            const currentBalance = baseBalance + totalIncome - totalExpense;

            const formatCurrency = (amount) => {
                if(currency === 'USD') return '$ ' + (amount / rates.USD).toFixed(2);
                if(currency === 'EUR') return '€ ' + (amount / rates.EUR).toFixed(2);
                return amount.toLocaleString('ru-RU').replace(/,/g, ' ') + ' сум';
            };

            return (
                <div className="pb-24 animate-fade-in">
                    <div className="px-4 pt-4 pb-2 flex justify-between items-center bg-bgLight dark:bg-bgDark transition-colors">
                        <div>
                            <p className="text-sm text-gray-500 dark:text-gray-400">Добрый день,</p>
                            <h2 className="text-xl font-bold text-textDark dark:text-white">{userName}</h2>
                        </div>
                        <div className="flex gap-3">
                            <div className="w-10 h-10 bg-white dark:bg-gray-800 rounded-full flex items-center justify-center shadow-sm text-gray-600 dark:text-gray-300 transition-colors">
                                <i className="fa-regular fa-calendar"></i>
                            </div>
                        </div>
                    </div>

                    <div className="flex justify-center items-center gap-4 py-2">
                        <button onClick={() => {triggerHaptic('light'); prevMonth();}} className="text-gray-400 hover:text-primary p-2"><i className="fa-solid fa-chevron-left"></i></button>
                        <h2 className="font-bold text-textDark dark:text-white w-32 text-center capitalize">{getMonthName(activeMonth)}</h2>
                        <button onClick={() => {triggerHaptic('light'); nextMonth();}} className="text-gray-400 hover:text-primary p-2"><i className="fa-solid fa-chevron-right"></i></button>
                    </div>

                    <div className="px-4 py-2 flex overflow-x-auto snap-x snap-mandatory no-scrollbar space-x-4">
                        <div onClick={() => {triggerHaptic('medium'); setActiveCard('all');}} className={`min-w-[90%] snap-center rounded-3xl p-5 text-white shadow-lg relative overflow-hidden flex-shrink-0 cursor-pointer transition-transform ${activeCard === 'all' ? 'bg-gradient-to-r from-primary to-purple-600 scale-100 ring-2 ring-primaryLight' : 'bg-gray-400 dark:bg-gray-700 scale-95 opacity-80'}`}>
                            <i className="fa-solid fa-wallet absolute -right-4 -bottom-4 text-white opacity-10 text-6xl"></i>
                            <div className="flex justify-between items-center mb-1 relative z-10">
                                <span className="text-sm text-white/80">Общий баланс</span>
                            </div>
                            <h2 className="text-3xl font-bold mb-4 relative z-10">{formatCurrency(currentBalance)}</h2>
                            <div className="flex justify-between relative z-10">
                                <div>
                                    <p className="text-xs text-white/80">Доходы</p>
                                    <p className="font-semibold text-sm">{formatCurrency(totalIncome)}</p>
                                </div>
                                <div className="text-right">
                                    <p className="text-xs text-white/80">Расходы</p>
                                    <p className="font-semibold text-sm">{formatCurrency(totalExpense)}</p>
                                </div>
                            </div>
                        </div>

                        <div onClick={() => {triggerHaptic('medium'); setActiveCard('card');}} className={`min-w-[90%] snap-center rounded-3xl p-5 text-white shadow-lg relative overflow-hidden flex-shrink-0 cursor-pointer transition-transform ${activeCard === 'card' ? 'bg-gray-900 scale-100 ring-2 ring-gray-400' : 'bg-gray-400 dark:bg-gray-700 scale-95 opacity-80'}`}>
                            <div className="absolute right-4 top-4 text-gray-400 text-2xl font-bold italic">UZCARD</div>
                            <div className="flex justify-between items-center mb-1 relative z-10">
                                <span className="text-sm text-gray-400">Зарплатная карта</span>
                            </div>
                            <h2 className="text-3xl font-bold mb-6 relative z-10">{formatCurrency(8400000 + transactions.filter(t => t.wallet === 'card' && t.amount > 0).reduce((a,c)=>a+c.amount,0) - transactions.filter(t => t.wallet === 'card' && t.amount < 0).reduce((a,c)=>a+Math.abs(c.amount),0))}</h2>
                            <div className="flex justify-between items-end relative z-10">
                                <p className="font-mono tracking-widest text-sm text-gray-300">**** 4512</p>
                            </div>
                        </div>

                        <div onClick={() => {triggerHaptic('medium'); setActiveCard('cash');}} className={`min-w-[90%] snap-center rounded-3xl p-5 text-white shadow-lg relative overflow-hidden flex-shrink-0 cursor-pointer transition-transform ${activeCard === 'cash' ? 'bg-gradient-to-br from-emerald-500 to-green-600 scale-100 ring-2 ring-emerald-400' : 'bg-gray-400 dark:bg-gray-700 scale-95 opacity-80'}`}>
                            <i className="fa-solid fa-money-bill absolute -right-2 -bottom-2 text-white opacity-20 text-6xl"></i>
                            <div className="flex justify-between items-center mb-1 relative z-10">
                                <span className="text-sm text-green-100">Наличные</span>
                            </div>
                            <h2 className="text-3xl font-bold mb-6 relative z-10">{formatCurrency(1200000 + transactions.filter(t => t.wallet === 'cash' && t.amount > 0).reduce((a,c)=>a+c.amount,0) - transactions.filter(t => t.wallet === 'cash' && t.amount < 0).reduce((a,c)=>a+Math.abs(c.amount),0))}</h2>
                            <div className="flex justify-between items-end relative z-10">
                                <p className="text-sm text-green-100">В кошельке</p>
                            </div>
                        </div>
                    </div>

                    <div className="flex justify-between px-6 py-4">
                        <div className="flex flex-col items-center gap-1 cursor-pointer" onClick={() => {triggerHaptic('light'); openAddModal('income');}}>
                            <div className="w-12 h-12 bg-green-100 dark:bg-green-900/40 rounded-2xl flex items-center justify-center text-green-500 text-xl shadow-sm transition-colors"><i className="fa-solid fa-arrow-down"></i></div>
                            <span className="text-xs font-medium text-gray-600 dark:text-gray-400 transition-colors">Доход</span>
                        </div>
                        <div className="flex flex-col items-center gap-1 cursor-pointer" onClick={() => {triggerHaptic('light'); openAddModal('expense');}}>
                            <div className="w-12 h-12 bg-red-100 dark:bg-red-900/40 rounded-2xl flex items-center justify-center text-red-500 text-xl shadow-sm transition-colors"><i className="fa-solid fa-arrow-up"></i></div>
                            <span className="text-xs font-medium text-gray-600 dark:text-gray-400 transition-colors">Расход</span>
                        </div>
                        <div className="flex flex-col items-center gap-1 cursor-pointer" onClick={() => {triggerHaptic('light'); setScreen('calculator');}}>
                            <div className="w-12 h-12 bg-purple-100 dark:bg-purple-900/40 rounded-2xl flex items-center justify-center text-primary text-xl shadow-sm transition-colors"><i className="fa-solid fa-piggy-bank"></i></div>
                            <span className="text-xs font-medium text-gray-600 dark:text-gray-400 transition-colors">Вклад</span>
                        </div>
                        <div className="flex flex-col items-center gap-1 cursor-pointer" onClick={() => {triggerHaptic('light'); setScreen('categories');}}>
                            <div className="w-12 h-12 bg-blue-100 dark:bg-blue-900/40 rounded-2xl flex items-center justify-center text-blue-500 text-xl shadow-sm transition-colors"><i className="fa-solid fa-layer-group"></i></div>
                            <span className="text-xs font-medium text-gray-600 dark:text-gray-400 transition-colors">Категории</span>
                        </div>
                    </div>

                    <div className="px-4 py-4">
                        <div className="flex justify-between items-center mb-3">
                            <h3 className="font-bold text-textDark dark:text-white transition-colors">{activeCard === 'all' ? 'Последние операции' : (activeCard === 'card' ? 'Операции по карте' : 'Наличные')}</h3>
                            <button onClick={() => {triggerHaptic('light'); setScreen('analytics');}} className="text-xs font-medium text-primary">Отчеты <i className="fa-solid fa-chevron-right ml-1"></i></button>
                        </div>
                        <div className="space-y-3">
                            {filteredTxs.length === 0 ? (
                                <p className="text-center text-sm text-gray-400 py-4">У вас пока нет транзакций.</p>
                            ) : filteredTxs.slice(0, 10).map(t => (
                                <div key={t.id} onClick={() => onTransactionClick(t)} className="flex items-center justify-between bg-white dark:bg-gray-900 p-3 rounded-2xl shadow-sm active:bg-gray-50 dark:active:bg-gray-800 transition-colors cursor-pointer border border-gray-50 dark:border-gray-800/50">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${t.bg} dark:bg-opacity-20 ${t.color}`}>
                                            {t.icon.startsWith('fa-') ? <i className={`fa-solid ${t.icon}`}></i> : <span className="text-xl">{t.icon}</span>}
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-sm text-textDark dark:text-white transition-colors">{t.title}</h4>
                                            <p className="text-xs text-gray-500 dark:text-gray-400 transition-colors">{t.category}</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <p className={`font-bold text-sm ${t.amount > 0 ? 'text-green-500' : 'text-textDark dark:text-white transition-colors'}`}>
                                            {t.amount > 0 ? '+' : ''}{formatCurrency(t.amount)}
                                        </p>
                                        <p className="text-[10px] text-gray-500 dark:text-gray-400 transition-colors">{t.date}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenAnalytics = ({ transactions, onTransactionClick, activeMonth, prevMonth, nextMonth, currency, rates }) => {
            const chartRef = useRef(null);
            const [expandedCat, setExpandedCat] = useState(null);
            
            const formatCurrency = (amount) => {
                if(currency === 'USD') return '$ ' + (amount / rates.USD).toFixed(2);
                if(currency === 'EUR') return '€ ' + (amount / rates.EUR).toFixed(2);
                return amount.toLocaleString('ru-RU').replace(/,/g, ' ') + ' сум';
            };

            const expenses = transactions.filter(t => t.amount < 0);
            const totalExp = expenses.reduce((sum, t) => sum + Math.abs(t.amount), 0);

            const catData = {};
            expenses.forEach(t => {
                if(!catData[t.category]) catData[t.category] = { total: 0, items: [], color: t.color, icon: t.icon, bg: t.bg };
                catData[t.category].total += Math.abs(t.amount);
                catData[t.category].items.push(t);
            });

            const categoryData = Object.keys(catData).map(k => ({
                name: k, ...catData[k], percent: totalExp ? Math.round((catData[k].total / totalExp) * 100) : 0
            })).sort((a,b) => b.total - a.total);

            const getHexColor = (colorClass) => {
                if(!colorClass) return '#9CA3AF';
                if(colorClass.includes('orange')) return '#F97316';
                if(colorClass.includes('blue') || colorClass.includes('sky')) return '#3B82F6';
                if(colorClass.includes('pink') || colorClass.includes('rose') || colorClass.includes('fuchsia')) return '#EC4899';
                if(colorClass.includes('green') || colorClass.includes('emerald') || colorClass.includes('teal') || colorClass.includes('lime')) return '#10B981';
                if(colorClass.includes('purple') || colorClass.includes('violet') || colorClass.includes('indigo') || colorClass.includes('primary')) return '#7C3AED';
                if(colorClass.includes('amber') || colorClass.includes('yellow')) return '#F59E0B';
                if(colorClass.includes('red')) return '#EF4444';
                if(colorClass.includes('cyan')) return '#06B6D4';
                return '#9CA3AF';
            };

            useEffect(() => {
                const ctx = document.getElementById('donutChart');
                if (ctx && categoryData.length > 0) {
                    if (chartRef.current) chartRef.current.destroy();
                    chartRef.current = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: categoryData.map(c => c.name),
                            datasets: [{
                                data: categoryData.map(c => c.total),
                                backgroundColor: categoryData.map(c => getHexColor(c.color)),
                                borderWidth: 0, hoverOffset: 4
                            }]
                        },
                        options: {
                            cutout: '75%', responsive: true, maintainAspectRatio: false, animation: false,
                            plugins: { legend: { display: false }, tooltip: { enabled: false } }
                        }
                    });
                }
            }, [categoryData]); 

            const renderGroupedItems = (catItems, catName) => {
                const groups = {};
                catItems.forEach(t => {
                    const cleanName = t.title.trim();
                    if(!groups[cleanName]) groups[cleanName] = { total: 0, txs: [] };
                    groups[cleanName].total += Math.abs(t.amount);
                    groups[cleanName].txs.push(t);
                });

                const groupArr = Object.keys(groups).map(k => ({ name: k, ...groups[k] })).sort((a,b) => b.total - a.total);

                return groupArr.map((group, idx) => (
                    <details key={idx} className="group mb-2 last:mb-0 border border-gray-100 dark:border-gray-800 rounded-xl overflow-hidden">
                        <summary className="flex justify-between items-center p-3 bg-gray-50 dark:bg-gray-800/50 cursor-pointer list-none active:bg-gray-100 dark:active:bg-gray-800 transition-colors">
                            <div className="flex items-center gap-2">
                                <span className="font-bold text-sm text-textDark dark:text-white">{group.name}</span>
                                <span className="text-[10px] bg-white dark:bg-gray-700 px-1.5 py-0.5 rounded shadow-sm text-gray-500 dark:text-gray-300">x{group.txs.length}</span>
                            </div>
                            <div className="flex items-center gap-3">
                                <span className="font-bold text-sm text-textDark dark:text-white">{formatCurrency(group.total)}</span>
                                <i className="fa-solid fa-chevron-down text-xs text-gray-400 group-open:rotate-180 transition-transform"></i>
                            </div>
                        </summary>
                        <div className="bg-white dark:bg-gray-900 px-3 py-2 space-y-2">
                            {group.txs.map((t, tidx) => {
                                let diffElement = null;
                                if (tidx < group.txs.length - 1) {
                                    const prevT = group.txs[tidx + 1];
                                    const currAmt = Math.abs(t.amount);
                                    const prevAmt = Math.abs(prevT.amount);
                                    if (currAmt !== prevAmt && prevAmt > 0) {
                                        const diffPerc = Math.round(((currAmt - prevAmt) / prevAmt) * 100);
                                        if (diffPerc > 0) {
                                            diffElement = <span className="text-[10px] text-red-500 bg-red-100 dark:bg-red-900/30 px-1.5 py-0.5 rounded ml-2">↑ +{diffPerc}%</span>;
                                        } else if (diffPerc < 0) {
                                            diffElement = <span className="text-[10px] text-green-500 bg-green-100 dark:bg-green-900/30 px-1.5 py-0.5 rounded ml-2">↓ {Math.abs(diffPerc)}%</span>;
                                        }
                                    }
                                }

                                const timeParts = t.date.split(' ');
                                const dateStr = timeParts[0];
                                const timeStr = timeParts[1] || "12:00";
                                const hour = parseInt(timeStr.split(':')[0]);
                                const isNight = hour >= 18 || hour < 6;
                                const timeIcon = isNight ? '🌙' : '☀️';

                                return (
                                    <div key={t.id} className="flex justify-between items-center py-1 border-b border-gray-50 dark:border-gray-800/50 last:border-0" onClick={() => {triggerHaptic('light'); onTransactionClick(t);}}>
                                        <div>
                                            <p className="text-[11px] text-gray-500 dark:text-gray-400 flex items-center">{timeIcon} <span className="ml-1 font-medium">{dateStr}</span> <span className="ml-1.5 opacity-70">{timeStr}</span></p>
                                            <div className="mt-0.5">{diffElement}</div>
                                        </div>
                                        <span className="text-sm font-bold text-textDark dark:text-gray-300">{formatCurrency(Math.abs(t.amount))}</span>
                                    </div>
                                );
                            })}
                        </div>
                    </details>
                ));
            };

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 transition-colors duration-300">
                    <TopHeader title="Отчет" rightIcon="fa-chart-pie" />
                    
                    <div className="flex justify-center items-center gap-4 py-2">
                        <button onClick={() => {triggerHaptic('light'); prevMonth();}} className="text-gray-400 hover:text-primary p-2"><i className="fa-solid fa-chevron-left"></i></button>
                        <h2 className="font-bold text-textDark dark:text-white w-32 text-center capitalize">{getMonthName(activeMonth)}</h2>
                        <button onClick={() => {triggerHaptic('light'); nextMonth();}} className="text-gray-400 hover:text-primary p-2"><i className="fa-solid fa-chevron-right"></i></button>
                    </div>

                    {totalExp > 0 ? (
                        <>
                            <div className="relative w-56 h-56 mx-auto my-6">
                                <canvas id="donutChart"></canvas>
                                <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                                    <p className="text-xs text-gray-500 dark:text-gray-400">Всего</p>
                                    <h2 className="text-xl font-bold text-textDark dark:text-white">{formatCurrency(totalExp)}</h2>
                                </div>
                            </div>

                            <div className="px-4 space-y-3">
                                {categoryData.map(c => (
                                    <div key={c.name} className="bg-white dark:bg-gray-900 rounded-2xl shadow-sm border border-gray-50 dark:border-gray-800 overflow-hidden transition-colors">
                                        <div onClick={() => {triggerHaptic('light'); setExpandedCat(expandedCat === c.name ? null : c.name);}} className="flex justify-between items-center p-4 cursor-pointer active:bg-gray-50 dark:active:bg-gray-800 transition-colors">
                                            <div className="flex items-center gap-3">
                                                <div className={`w-3 h-3 rounded-full`} style={{backgroundColor: getHexColor(c.color)}}></div>
                                                <span className="font-bold text-sm text-textDark dark:text-white">{c.name}</span>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <span className="font-bold text-sm text-textDark dark:text-white">{formatCurrency(c.total)}</span>
                                                <span className="text-xs text-gray-400 font-mono w-8 text-right">{c.percent}%</span>
                                            </div>
                                        </div>
                                        {expandedCat === c.name && (
                                            <div className="px-4 pb-4 animate-fade-in border-t border-gray-50 dark:border-gray-800 pt-3">
                                                {renderGroupedItems(c.items, c.name)}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </>
                    ) : (
                        <div className="text-center py-20 text-gray-400">В этом месяце операций нет.</div>
                    )}
                </div>
            );
        };

        const AddTransactionModal = ({ close, saveTx, categories, addCategory, isPremium, initialTab = 'expense' }) => {
            const [tab, setTab] = useState(initialTab);
            const [amount, setAmount] = useState('');
            const [title, setTitle] = useState('');
            const [selCat, setSelCat] = useState('');
            const [wallet, setWallet] = useState('card');
            const [isProcessing, setIsProcessing] = useState(false);
            const [smsText, setSmsText] = useState('');
            const [addMethod, setAddMethod] = useState(null);
            
            const [newCatName, setNewCatName] = useState('');
            const [newCatColor, setNewCatColor] = useState(CATEGORY_COLORS[0]);
            const [newCatIcon, setNewCatIcon] = useState(TOP_ICONS[0]);
            const [iconTab, setIconTab] = useState('icons');

            useEffect(() => {
                if (categories.length > 0 && !selCat) setSelCat(categories[0].name);
            }, [categories]);

            const simulateAI = (type) => {
                setIsProcessing(true);
                setTimeout(() => {
                    setIsProcessing(false);
                    setAmount(type === 'sms' ? '45000' : '150000');
                    setTitle(type === 'sms' ? 'Yandex GO' : 'Супермаркет');
                    setSelCat(type === 'sms' ? 'Транспорт' : 'Продукты');
                    setAddMethod(null);
                    triggerHaptic('success');
                }, 2500);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if(tab === 'category') {
                    if(!newCatName) return;
                    addCategory({ name: newCatName, icon: newCatIcon, colorClass: newCatColor, limit: null });
                    setSelCat(newCatName);
                    setTab('expense');
                    triggerHaptic('success');
                    return;
                }

                if(!amount || !title) return;
                const numAmt = parseInt(amount.replace(/\s/g, ''));
                const catObj = categories.find(c => c.name === selCat) || categories[0];
                saveTx({
                    title, category: selCat, wallet,
                    amount: tab === 'expense' ? -numAmt : numAmt,
                    icon: catObj.icon, color: catObj.colorClass.split(' ')[0], bg: catObj.colorClass.split(' ')[1]
                });
            };

            return (
                <div className="fixed inset-0 z-[60] flex items-end">
                    <div className="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onClick={close}></div>
                    <div className="bg-white dark:bg-gray-900 w-full rounded-t-3xl p-6 relative z-10 animate-fade-in max-h-[90vh] overflow-y-auto no-scrollbar transition-colors">
                        <div className="w-12 h-1.5 bg-gray-200 dark:bg-gray-700 rounded-full mx-auto mb-6"></div>
                        
                        {(addMethod === 'voice' || addMethod === 'scan' || addMethod === 'sms') ? (
                            <div className="py-6 text-center">
                                {addMethod === 'voice' && (
                                    <>
                                        <div className="relative mb-6 mx-auto w-24 h-24">
                                            <div className="w-full h-full bg-blue-500 rounded-full flex items-center justify-center text-white text-4xl relative z-10">{isProcessing ? <i className="fa-solid fa-robot animate-pulse"></i> : <i className="fa-solid fa-microphone"></i>}</div>
                                            {!isProcessing && <div className="absolute inset-0 rounded-full bg-blue-500 animate-pulse-ring z-0"></div>}
                                        </div>
                                        <h3 className="text-xl font-bold text-textDark dark:text-white mb-2">{isProcessing ? "AI распознает речь..." : "Внимательно слушаю"}</h3>
                                        <button onClick={() => simulateAI('voice')} className="mt-6 bg-blue-50 text-blue-500 font-bold px-6 py-2 rounded-full">Имитировать</button>
                                    </>
                                )}
                                {addMethod === 'scan' && (
                                    <>
                                        <div className="w-48 h-64 bg-gray-100 dark:bg-gray-800 mx-auto rounded-xl relative overflow-hidden flex items-center justify-center mb-6">
                                            <i className="fa-solid fa-receipt text-6xl text-gray-300"></i>
                                            {isProcessing && <div className="animate-scanline"></div>}
                                        </div>
                                        <h3 className="text-xl font-bold text-textDark dark:text-white mb-2">{isProcessing ? "AI читает чек..." : "Наведите камеру"}</h3>
                                        <button onClick={() => simulateAI('scan')} className="mt-2 bg-green-50 text-green-500 font-bold px-6 py-2 rounded-full">Фото</button>
                                    </>
                                )}
                                {addMethod === 'sms' && (
                                    <>
                                        <div className="w-16 h-16 bg-purple-100 text-purple-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-4"><i className="fa-solid fa-comment-sms"></i></div>
                                        <textarea value={smsText} onChange={e => setSmsText(e.target.value)} placeholder="Вставьте текст SMS..." className="w-full h-24 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm focus:border-primary mb-4 text-textDark dark:text-white"></textarea>
                                        <button onClick={() => simulateAI('sms')} className="w-full bg-primary text-white py-3 rounded-xl font-bold shadow-lg shadow-primary/30">Анализировать</button>
                                    </>
                                )}
                            </div>
                        ) : (
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div className="flex bg-gray-100 dark:bg-gray-800 rounded-xl p-1 mb-4 overflow-x-auto no-scrollbar">
                                    <button type="button" onClick={() => {triggerHaptic('light'); setTab('expense');}} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors whitespace-nowrap px-3 ${tab === 'expense' ? 'bg-white dark:bg-gray-700 shadow text-red-500' : 'text-gray-500'}`}>Расход</button>
                                    <button type="button" onClick={() => {triggerHaptic('light'); setTab('income');}} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors whitespace-nowrap px-3 ${tab === 'income' ? 'bg-white dark:bg-gray-700 shadow text-green-500' : 'text-gray-500'}`}>Доход</button>
                                    <button type="button" onClick={() => {triggerHaptic('light'); setTab('category');}} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors whitespace-nowrap px-3 ${tab === 'category' ? 'bg-white dark:bg-gray-700 shadow text-primary' : 'text-gray-500'}`}>Категория +</button>
                                </div>

                                {tab === 'category' ? (
                                    <div className="space-y-4 animate-fade-in">
                                        <div>
                                            <label className="text-xs text-gray-500 dark:text-gray-400 ml-1">Название категории</label>
                                            <input required type="text" value={newCatName} onChange={e=>setNewCatName(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 mt-1 text-textDark dark:text-white focus:outline-none focus:border-primary" placeholder="Например: Питомцы" />
                                        </div>
                                        <div>
                                            <label className="text-xs text-gray-500 dark:text-gray-400 ml-1 mb-2 block flex justify-between">
                                                Выберите цвет <span className="text-primary font-bold text-[10px] bg-primary/10 px-2 py-0.5 rounded">PRO: 20 цветов</span>
                                            </label>
                                            <div className="flex flex-wrap gap-2">
                                                {CATEGORY_COLORS.map((c, i) => {
                                                    const locked = !isPremium && i >= 6;
                                                    return (
                                                        <div key={i} onClick={() => { if(!locked) { triggerHaptic('light'); setNewCatColor(c); } else { alert("Требуется PRO версия!"); } }} className={`w-8 h-8 rounded-full cursor-pointer relative ${c} ${newCatColor === c ? 'ring-2 ring-offset-2 ring-gray-400 dark:ring-offset-gray-900 scale-110' : ''} ${locked ? 'opacity-50' : ''}`}>
                                                            {locked && <i className="fa-solid fa-lock absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-white/80 text-[10px]"></i>}
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                        </div>
                                        <div>
                                            <div className="flex justify-between items-center mb-2">
                                                <label className="text-xs text-gray-500 dark:text-gray-400 ml-1">Выберите иконку</label>
                                                <div className="flex bg-gray-100 dark:bg-gray-800 rounded-lg p-0.5">
                                                    <button type="button" onClick={() => setIconTab('icons')} className={`px-3 py-1 text-[10px] font-bold rounded-md ${iconTab==='icons'?'bg-white dark:bg-gray-700 shadow text-textDark dark:text-white':'text-gray-500'}`}>Иконки</button>
                                                    <button type="button" onClick={() => setIconTab('emojis')} className={`px-3 py-1 text-[10px] font-bold rounded-md ${iconTab==='emojis'?'bg-white dark:bg-gray-700 shadow text-textDark dark:text-white':'text-gray-500'}`}>Эмодзи 👑</button>
                                                </div>
                                            </div>
                                            <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto no-scrollbar p-1 border border-gray-100 dark:border-gray-800 rounded-xl bg-gray-50 dark:bg-gray-900">
                                                {iconTab === 'icons' && TOP_ICONS.map((ic, i) => (
                                                    <div key={i} onClick={() => {triggerHaptic('light'); setNewCatIcon(ic);}} className={`w-10 h-10 rounded-xl flex items-center justify-center cursor-pointer text-lg transition-colors ${newCatIcon === ic ? 'bg-primary text-white shadow-md' : 'text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-800'}`}>
                                                        <i className={`fa-solid ${ic}`}></i>
                                                    </div>
                                                ))}
                                                {iconTab === 'emojis' && PRO_EMOJIS.map((em, i) => {
                                                    const locked = !isPremium && i >= 10;
                                                    return (
                                                        <div key={i} onClick={() => { if(!locked) { triggerHaptic('light'); setNewCatIcon(em); } else { alert("Требуется PRO версия!"); } }} className={`w-10 h-10 rounded-xl flex items-center justify-center cursor-pointer text-xl relative transition-colors ${newCatIcon === em ? 'bg-primary text-white shadow-md' : 'hover:bg-gray-200 dark:hover:bg-gray-800'} ${locked ? 'opacity-30' : ''}`}>
                                                            {em}
                                                            {locked && <i className="fa-solid fa-lock absolute top-1 right-1 text-gray-500 text-[8px]"></i>}
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                        </div>
                                        <div className="mt-4 p-4 rounded-xl border border-gray-100 dark:border-gray-800 flex items-center gap-3 bg-gray-50 dark:bg-gray-800/50">
                                            <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-xl shadow-sm ${newCatColor}`}>
                                                {newCatIcon.startsWith('fa-') ? <i className={`fa-solid ${newCatIcon}`}></i> : <span>{newCatIcon}</span>}
                                            </div>
                                            <span className="font-bold text-textDark dark:text-white">{newCatName || 'Предпросмотр'}</span>
                                        </div>
                                        <button type="submit" className="w-full bg-primary text-white font-bold py-4 rounded-2xl shadow-lg shadow-purple-500/30 mt-2 hover:bg-primaryDark transition-colors">Создать категорию</button>
                                    </div>
                                ) : (
                                    <div className="space-y-4 animate-fade-in">
                                        <div className="flex justify-between items-center bg-gray-50 dark:bg-gray-800 rounded-xl p-1 mb-2">
                                            <button type="button" onClick={() => setWallet('card')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${wallet === 'card' ? 'bg-white dark:bg-gray-700 shadow text-textDark dark:text-white' : 'text-gray-500'}`}><i className="fa-regular fa-credit-card mr-2 text-primary"></i>Карта</button>
                                            <button type="button" onClick={() => setWallet('cash')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${wallet === 'cash' ? 'bg-white dark:bg-gray-700 shadow text-textDark dark:text-white' : 'text-gray-500'}`}><i className="fa-solid fa-money-bill mr-2 text-emerald-500"></i>Наличные</button>
                                        </div>
                                        <div>
                                            <label className="text-xs text-gray-500 dark:text-gray-400 ml-1">Сумма</label>
                                            <input required type="text" inputMode="numeric" value={amount} onChange={(e) => setAmount(formatMoneyInput(e.target.value))} className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 text-2xl font-bold mt-1 text-textDark dark:text-white focus:outline-none focus:border-primary transition-colors" placeholder="0" />
                                        </div>
                                        <div>
                                            <div className="flex justify-between items-center mb-1">
                                                <label className="text-xs text-gray-500 dark:text-gray-400 ml-1">Название / Место</label>
                                                <div className="flex gap-2">
                                                    <button type="button" onClick={() => setAddMethod('voice')} className="text-primary text-xs font-bold bg-purple-100 dark:bg-purple-900/30 px-2 py-0.5 rounded"><i className="fa-solid fa-microphone"></i></button>
                                                    <button type="button" onClick={() => setAddMethod('scan')} className="text-green-500 text-xs font-bold bg-green-100 dark:bg-green-900/30 px-2 py-0.5 rounded"><i className="fa-solid fa-camera"></i></button>
                                                    <button type="button" onClick={() => setAddMethod('sms')} className="text-orange-500 text-xs font-bold bg-orange-100 dark:bg-orange-900/30 px-2 py-0.5 rounded"><i className="fa-solid fa-comment-sms"></i> SMS</button>
                                                </div>
                                            </div>
                                            <input required type="text" value={title} onChange={(e) => setTitle(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 mt-1 text-textDark dark:text-white focus:outline-none focus:border-primary transition-colors" placeholder="Например: Супермаркет" />
                                        </div>
                                        <div>
                                            <label className="text-xs text-gray-500 dark:text-gray-400 ml-1">Категория</label>
                                            <div className="relative mt-1">
                                                <select value={selCat} onChange={(e) => setSelCat(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-12 py-3 text-textDark dark:text-white focus:outline-none focus:border-primary transition-colors appearance-none font-bold">
                                                    {categories.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
                                                </select>
                                                <div className="absolute left-3 top-1/2 transform -translate-y-1/2 w-7 h-7 rounded-lg flex items-center justify-center text-sm shadow-sm" style={{backgroundColor: 'rgba(124, 58, 237, 0.1)', color: '#7C3AED'}}>
                                                    {categories.find(c=>c.name===selCat)?.icon?.startsWith('fa-') ? <i className={`fa-solid ${categories.find(c=>c.name===selCat)?.icon}`}></i> : categories.find(c=>c.name===selCat)?.icon}
                                                </div>
                                                <i className="fa-solid fa-chevron-down absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-xs pointer-events-none"></i>
                                            </div>
                                        </div>
                                        <button type="submit" className={`w-full text-white font-bold py-4 rounded-2xl shadow-lg mt-2 transition-transform hover:scale-[1.02] ${tab === 'expense' ? 'bg-red-500 shadow-red-500/30' : 'bg-green-500 shadow-green-500/30'}`}>
                                            Добавить {tab === 'expense' ? 'расход' : 'доход'}
                                        </button>
                                    </div>
                                )}
                            </form>
                        )}
                    </div>
                </div>
            );
        };

        const ScreenCalculator = ({ onBack, debts, setDebts }) => {
            const [tab, setTab] = useState('deposit');
            const [amount, setAmount] = useState('10000000');
            const [percent, setPercent] = useState('18');
            const [months, setMonths] = useState('12');

            // Debts State
            const [debtName, setDebtName] = useState('');
            const [debtAmount, setDebtAmount] = useState('');
            const [debtType, setDebtType] = useState('they_owe'); // they_owe, i_owe

            const numAmt = parseInt(amount.replace(/\s/g, '')) || 0;
            const numPerc = parseFloat(percent) || 0;
            const numMonths = parseInt(months) || 1;

            // Deposit Math
            const depositProfit = Math.round((numAmt * (numPerc / 100) * (numMonths / 12)));
            const depositMonthly = Math.round(depositProfit / numMonths);

            // Credit Math
            const i = (numPerc / 100) / 12;
            const creditMonthly = i === 0 ? Math.round(numAmt / numMonths) : Math.round(numAmt * (i + (i / (Math.pow(1 + i, numMonths) - 1))));
            const creditTotal = creditMonthly * numMonths;
            const creditOverpay = creditTotal - numAmt;

            const handleAddDebt = () => {
                if(!debtName || !debtAmount) return;
                const newDebt = {
                    id: Date.now(),
                    name: debtName,
                    amount: parseInt(debtAmount.replace(/\s/g, '')),
                    type: debtType,
                    date: new Date().toLocaleDateString('ru-RU')
                };
                setDebts([newDebt, ...debts]);
                setDebtName('');
                setDebtAmount('');
                triggerHaptic('success');
            };

            const shareDebt = (debt) => {
                triggerHaptic('light');
                const text = debt.type === 'they_owe' 
                    ? `Привет! Напоминаю про долг в размере ${formatMoneyInput(debt.amount.toString())} сум (${debt.name}). Заранее спасибо! 🤝`
                    : `Привет! Помню про свой долг в размере ${formatMoneyInput(debt.amount.toString())} сум (${debt.name}). Скоро верну! 🙏`;
                window.location.href = `https://t.me/share/url?url=&text=${encodeURIComponent(text)}`;
            };

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 z-50 relative transition-colors duration-300">
                    <TopHeader title="Финансовые инструменты" showBack={true} onBack={onBack} />
                    <div className="px-4 py-4 space-y-4">
                        <div className="flex bg-gray-200 dark:bg-gray-800 rounded-xl p-1 overflow-x-auto no-scrollbar">
                            <button onClick={() => {triggerHaptic(); setTab('deposit');}} className={`min-w-fit px-3 py-2 text-sm font-bold rounded-lg transition-colors ${tab === 'deposit' ? 'bg-white dark:bg-gray-700 shadow text-primary' : 'text-gray-500'}`}>Вклад</button>
                            <button onClick={() => {triggerHaptic(); setTab('credit');}} className={`min-w-fit px-3 py-2 text-sm font-bold rounded-lg transition-colors ${tab === 'credit' ? 'bg-white dark:bg-gray-700 shadow text-red-500' : 'text-gray-500'}`}>Кредит</button>
                            <button onClick={() => {triggerHaptic(); setTab('goals');}} className={`min-w-fit px-3 py-2 text-sm font-bold rounded-lg transition-colors ${tab === 'goals' ? 'bg-white dark:bg-gray-700 shadow text-green-500' : 'text-gray-500'}`}>Копилки</button>
                            <button onClick={() => {triggerHaptic(); setTab('debts');}} className={`min-w-fit px-3 py-2 text-sm font-bold rounded-lg transition-colors ${tab === 'debts' ? 'bg-white dark:bg-gray-700 shadow text-orange-500' : 'text-gray-500'}`}>Долги</button>
                        </div>

                        {tab === 'debts' ? (
                            <div className="space-y-4 animate-fade-in">
                                <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm border border-gray-50 dark:border-gray-800 space-y-3">
                                    <div className="flex bg-gray-50 dark:bg-gray-800 rounded-xl p-1">
                                        <button onClick={() => setDebtType('they_owe')} className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-colors ${debtType === 'they_owe' ? 'bg-green-100 text-green-600 dark:bg-green-900/30' : 'text-gray-500'}`}>Мне должны</button>
                                        <button onClick={() => setDebtType('i_owe')} className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-colors ${debtType === 'i_owe' ? 'bg-red-100 text-red-600 dark:bg-red-900/30' : 'text-gray-500'}`}>Я должен</button>
                                    </div>
                                    <div className="flex gap-2">
                                        <div className="flex-1">
                                            <input type="text" placeholder="Имя / За что" value={debtName} onChange={e=>setDebtName(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-sm text-textDark dark:text-white focus:outline-none focus:border-primary" />
                                        </div>
                                        <div className="flex-1">
                                            <input type="text" placeholder="Сумма" value={debtAmount} onChange={e=>setDebtAmount(formatMoneyInput(e.target.value))} className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-sm text-textDark dark:text-white focus:outline-none focus:border-primary font-bold" />
                                        </div>
                                    </div>
                                    <button onClick={handleAddDebt} className="w-full bg-gray-900 dark:bg-white dark:text-gray-900 text-white font-bold py-3 rounded-xl hover:scale-[1.02] transition-transform">Добавить запись</button>
                                </div>

                                <div className="space-y-3">
                                    {debts.length === 0 && <p className="text-center text-sm text-gray-400 py-4">У вас нет активных долгов.</p>}
                                    {debts.map(d => (
                                        <div key={d.id} className="bg-white dark:bg-gray-900 p-4 rounded-2xl shadow-sm border border-gray-50 dark:border-gray-800 flex justify-between items-center transition-colors">
                                            <div>
                                                <div className="flex items-center gap-2 mb-1">
                                                    <span className={`w-2 h-2 rounded-full ${d.type === 'they_owe' ? 'bg-green-500' : 'bg-red-500'}`}></span>
                                                    <h4 className="font-bold text-sm text-textDark dark:text-white">{d.name}</h4>
                                                </div>
                                                <p className={`font-bold text-lg ${d.type === 'they_owe' ? 'text-green-500' : 'text-red-500'}`}>{formatMoneyInput(d.amount.toString())} сум</p>
                                                <p className="text-[10px] text-gray-400">{d.date}</p>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => shareDebt(d)} className="w-10 h-10 bg-blue-50 text-blue-500 dark:bg-blue-900/30 rounded-xl flex items-center justify-center text-lg transition-colors hover:bg-blue-100"><i className="fa-brands fa-telegram"></i></button>
                                                <button onClick={() => {triggerHaptic('medium'); setDebts(debts.filter(item => item.id !== d.id));}} className="w-10 h-10 bg-gray-100 text-gray-400 dark:bg-gray-800 rounded-xl flex items-center justify-center transition-colors hover:bg-green-100 hover:text-green-500"><i className="fa-solid fa-check"></i></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ) : tab === 'goals' ? (
                            <div className="space-y-4 animate-fade-in">
                                <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-800 transition-colors duration-300">
                                    <div className="flex justify-between items-start mb-2">
                                        <div>
                                            <h4 className="font-bold text-textDark dark:text-white transition-colors">Новая машина</h4>
                                            <p className="text-xs text-gray-500 dark:text-gray-400 mt-1 transition-colors">10 000 000 / 50 000 000 сум</p>
                                        </div>
                                        <div className="w-12 h-12 bg-blue-100 dark:bg-blue-900/30 rounded-xl flex items-center justify-center text-xl transition-colors">🚗</div>
                                    </div>
                                    <div className="w-full bg-gray-100 dark:bg-gray-800 rounded-full h-2.5 mb-2 transition-colors">
                                        <div className="bg-blue-500 h-2.5 rounded-full" style={{width: '20%'}}></div>
                                    </div>
                                    <div className="flex justify-between items-end">
                                        <div>
                                            <p className="text-[10px] text-gray-500 dark:text-gray-400">Осталось 10 месяцев</p>
                                            <p className="text-xs font-bold text-primary mt-0.5">Откладывать: 4 000 000 / мес</p>
                                        </div>
                                        <span className="font-bold text-textDark dark:text-gray-300">20%</span>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="animate-fade-in space-y-4">
                                <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm border border-gray-50 dark:border-gray-800 space-y-3">
                                    <div>
                                        <label className="text-xs text-gray-500 dark:text-gray-400">Сумма</label>
                                        <input type="text" value={formatMoneyInput(amount.toString())} onChange={e=>setAmount(e.target.value.replace(/\D/g, ''))} className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 mt-1 font-bold text-textDark dark:text-white focus:outline-none focus:border-primary" />
                                    </div>
                                    <div className="flex gap-3">
                                        <div className="flex-1">
                                            <label className="text-xs text-gray-500 dark:text-gray-400">Ставка (%)</label>
                                            <input type="number" value={percent} onChange={e=>setPercent(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 mt-1 font-bold text-textDark dark:text-white focus:outline-none focus:border-primary" />
                                        </div>
                                        <div className="flex-1">
                                            <label className="text-xs text-gray-500 dark:text-gray-400">Срок (мес)</label>
                                            <input type="number" value={months} onChange={e=>setMonths(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 mt-1 font-bold text-textDark dark:text-white focus:outline-none focus:border-primary" />
                                        </div>
                                    </div>
                                </div>

                                {tab === 'deposit' ? (
                                    <div className="bg-gradient-to-br from-primary to-purple-600 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden animate-fade-in">
                                        <i className="fa-solid fa-piggy-bank absolute -right-4 -bottom-4 opacity-10 text-7xl"></i>
                                        <p className="text-sm text-purple-200 mb-1 relative z-10">Итоговая сумма</p>
                                        <h2 className="text-3xl font-bold mb-4 relative z-10">{formatMoneyInput((numAmt + depositProfit).toString())}</h2>
                                        <div className="flex justify-between bg-white/10 rounded-xl p-3 relative z-10">
                                            <div><p className="text-xs text-purple-200">Прибыль</p><p className="font-bold">+{formatMoneyInput(depositProfit.toString())}</p></div>
                                            <div className="text-right"><p className="text-xs text-purple-200">В месяц</p><p className="font-bold">+{formatMoneyInput(depositMonthly.toString())}</p></div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-gradient-to-br from-red-500 to-orange-500 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden animate-fade-in">
                                        <i className="fa-solid fa-file-invoice-dollar absolute -right-4 -bottom-4 opacity-10 text-7xl"></i>
                                        <p className="text-sm text-red-100 mb-1 relative z-10">Ежемесячный платеж</p>
                                        <h2 className="text-3xl font-bold mb-4 relative z-10">{formatMoneyInput(creditMonthly.toString())}</h2>
                                        <div className="flex justify-between bg-white/10 rounded-xl p-3 relative z-10">
                                            <div><p className="text-xs text-red-100">Итого выплатить</p><p className="font-bold">{formatMoneyInput(creditTotal.toString())}</p></div>
                                            <div className="text-right"><p className="text-xs text-red-100">Переплата</p><p className="font-bold">{formatMoneyInput(creditOverpay.toString())}</p></div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const ScreenCategories = ({ onBack, categories, setCategories, isPremium, openPaywall, transactions }) => {
            const [editingLimitCat, setEditingLimitCat] = useState(null);
            const [limitVal, setLimitVal] = useState('');

            const handleEditLimitClick = (c) => {
                if (!isPremium) return openPaywall();
                if (editingLimitCat === c.name) {
                    setEditingLimitCat(null);
                } else {
                    setLimitVal(c.limit ? formatMoneyInput(c.limit.toString()) : '');
                    setEditingLimitCat(c.name);
                }
            };

            const saveLimit = (cName) => {
                const num = parseInt(limitVal.replace(/\D/g, '')) || null;
                setCategories(categories.map(c => c.name === cName ? { ...c, limit: num } : c));
                setEditingLimitCat(null);
                triggerHaptic('success');
            };

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 z-50 relative transition-colors duration-300">
                    <TopHeader title="Категории и Лимиты" showBack={true} onBack={onBack} />
                    <div className="px-4 py-4 space-y-3">
                        <p className="text-xs text-gray-500 dark:text-gray-400 mb-2">Управление вашими категориями и бюджетом</p>
                        {categories.map((c, i) => {
                            const totalSpent = transactions.filter(t => t.category === c.name && t.amount < 0).reduce((sum, t) => sum + Math.abs(t.amount), 0);
                            const limit = c.limit || 0;
                            const progress = limit > 0 ? Math.min((totalSpent / limit) * 100, 100) : 0;
                            const isWarning = progress >= 90;

                            return (
                                <div key={i} className="bg-white dark:bg-gray-900 p-4 rounded-2xl shadow-sm border border-gray-50 dark:border-gray-800 transition-colors">
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-4">
                                            <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-xl ${c.colorClass}`}>
                                                {c.icon.startsWith('fa-') ? <i className={`fa-solid ${c.icon}`}></i> : <span>{c.icon}</span>}
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-textDark dark:text-white">{c.name}</h4>
                                                <p className="text-xs text-gray-500">{totalSpent > 0 ? formatMoneyInput(totalSpent.toString()) + ' сум' : 'Нет трат'}</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => handleEditLimitClick(c)} className={`w-10 h-10 rounded-xl transition-colors flex items-center justify-center ${c.limit ? 'bg-orange-50 text-orange-500 dark:bg-orange-900/30' : 'bg-gray-50 text-gray-400 dark:bg-gray-800'}`}>
                                                {c.limit ? <i className="fa-solid fa-pen"></i> : <i className="fa-solid fa-bullseye"></i>}
                                                {!isPremium && <i className="fa-solid fa-lock ml-1 text-[8px]"></i>}
                                            </button>
                                            <button onClick={() => {triggerHaptic('medium'); setCategories(categories.filter(cat => cat.name !== c.name));}} className="w-10 h-10 bg-red-50 dark:bg-red-900/20 text-red-500 rounded-xl transition-colors hover:bg-red-100 flex items-center justify-center"><i className="fa-solid fa-trash-can"></i></button>
                                        </div>
                                    </div>
                                    
                                    {editingLimitCat === c.name && (
                                        <div className="mt-4 flex gap-2 animate-fade-in border-t border-gray-50 dark:border-gray-800 pt-3">
                                            <input type="text" value={limitVal} onChange={e => setLimitVal(formatMoneyInput(e.target.value))} placeholder="Сумма лимита (0 для удаления)" className="flex-1 bg-gray-50 dark:bg-gray-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-primary border border-gray-200 dark:border-gray-700 text-textDark dark:text-white"/>
                                            <button onClick={() => saveLimit(c.name)} className="bg-primary text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm">ОК</button>
                                        </div>
                                    )}

                                    {limit > 0 && (
                                        <div className="mt-4">
                                            <div className="flex justify-between text-[10px] mb-1.5">
                                                <span className={isWarning ? 'text-red-500 font-bold' : 'text-gray-500 font-bold'}>
                                                    {isWarning ? '⚠️ Лимит почти исчерпан!' : `${Math.round(progress)}%`}
                                                </span>
                                                <span className="text-gray-400 font-medium">из {formatMoneyInput(limit.toString())} сум</span>
                                            </div>
                                            <div className="w-full bg-gray-100 dark:bg-gray-800 rounded-full h-2 overflow-hidden">
                                                <div className={`h-2 rounded-full transition-all duration-500 ${isWarning ? 'bg-red-500' : 'bg-primary'}`} style={{width: `${progress}%`}}></div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const ScreenTips = ({ openAIChat }) => {
            const tipsData = [
                { title: "Правило 50/30/20", text: "Разделите доход: 50% на базовые нужды (жилье, еда), 30% на желания (развлечения), 20% в накопления и инвестиции." },
                { title: "Сложный процент", text: "Восьмое чудо света. Проценты начисляются на проценты. Начните инвестировать раньше, даже малыми суммами." },
                { title: "Инфляция", text: "Обесценивание денег со временем. Храните деньги на вкладах, чтобы обогнать инфляцию." },
                { title: "Подушка безопасности", text: "Накопите сумму, равную вашим расходам за 3-6 месяцев. Храните её на ликвидном вкладе." },
                { title: "Диверсификация", text: "Не кладите все яйца в одну корзину. Разделяйте инвестиции по классам активов." }
            ];

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 transition-colors duration-300 relative">
                    <TopHeader title="Финансовая Грамотность" rightIcon="fa-graduation-cap" />
                    
                    <div className="px-4 space-y-4 pt-4">
                        <div className="bg-gradient-to-r from-primary to-purple-600 rounded-2xl p-4 shadow-sm flex gap-4 items-center text-white relative overflow-hidden">
                            <i className="fa-solid fa-brain absolute -right-4 -bottom-4 opacity-10 text-7xl"></i>
                            <div className="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center text-xl flex-shrink-0 relative z-10"><i className="fa-solid fa-robot"></i></div>
                            <div className="relative z-10">
                                <h4 className="font-bold text-sm">Ваш личный ИИ-ментор</h4>
                                <p className="text-xs text-purple-100 mt-1">Готов проанализировать вашу ситуацию.</p>
                            </div>
                        </div>

                        <h3 className="font-bold text-textDark dark:text-white mt-6 mb-2">Золотые Правила</h3>
                        <div className="space-y-3">
                            {tipsData.map((tip, idx) => (
                                <details key={idx} className="bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-2xl p-4 shadow-sm group transition-colors duration-300">
                                    <summary className="font-bold text-sm text-textDark dark:text-white cursor-pointer list-none flex justify-between items-center">
                                        <div className="flex items-center gap-3">
                                            <span className="text-primary opacity-50 font-mono text-xs">{String(idx+1).padStart(2, '0')}</span>
                                            {tip.title}
                                        </div>
                                        <i className="fa-solid fa-chevron-down text-gray-400 group-open:rotate-180 transition-transform"></i>
                                    </summary>
                                    <p className="text-sm text-gray-600 dark:text-gray-400 mt-3 leading-relaxed border-t border-gray-50 dark:border-gray-800 pt-3">{tip.text}</p>
                                </details>
                            ))}
                        </div>
                    </div>

                    <button onClick={openAIChat} className="fixed bottom-24 right-4 w-14 h-14 bg-gradient-to-r from-primary to-purple-600 rounded-full shadow-lg shadow-purple-500/30 flex items-center justify-center text-white text-2xl z-40 hover:scale-105 transition-transform">
                        <i className="fa-solid fa-robot"></i>
                        <span className="absolute top-0 right-0 w-3.5 h-3.5 bg-red-500 border-2 border-[#F9FAFB] dark:border-gray-950 rounded-full"></span>
                    </button>
                </div>
            );
        };

        const ScreenAIChat = ({ onBack, userId }) => {
            const [messages, setMessages] = useState([{ type: 'bot', text: 'Привет! Я подключен к Gemini и вижу ваши расходы в базе данных. Чем могу помочь?' }]);
            const [isTyping, setIsTyping] = useState(false);
            const [inputText, setInputText] = useState('');

            const sendPrompt = async (text) => {
                if (!text.trim()) return;
                setMessages(prev => [...prev, { type: 'user', text }]);
                setInputText('');
                setIsTyping(true);
                
                try {
                    const res = await fetch(`${API_URL}/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'x-tg-user-id': userId },
                        body: JSON.stringify({ message: text })
                    });
                    const data = await res.json();
                    setMessages(prev => [...prev, { type: 'bot', text: data.reply || "Извините, не смог получить ответ от ИИ." }]);
                } catch (error) {
                    setMessages(prev => [...prev, { type: 'bot', text: "Серверы Google временно перегружены. Попробуйте через пару минут." }]);
                } finally {
                    setIsTyping(false);
                }
            };

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen flex flex-col animate-fade-in z-50 relative transition-colors duration-300">
                    <TopHeader title="Финансовый помощник" showBack={true} onBack={onBack} rightIcon="fa-broom" />
                    
                    <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-40">
                        <p className="text-center text-xs text-gray-400">Ваш AI ассистент (Gemini)</p>
                        {messages.map((msg, i) => (
                            <div key={i} className={`flex ${msg.type === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[80%] rounded-2xl p-3 text-sm ${msg.type === 'user' ? 'bg-gray-200 dark:bg-gray-800 text-textDark dark:text-white rounded-tr-sm' : 'bg-primary text-white rounded-tl-sm shadow-md'}`}>
                                    {msg.text.split('\n').map((line, j) => <p key={j} className="mb-1 last:mb-0">{line}</p>)}
                                </div>
                            </div>
                        ))}
                        {isTyping && (
                            <div className="flex justify-start">
                                <div className="bg-primary text-white rounded-2xl rounded-tl-sm p-3 shadow-md flex items-center gap-1">
                                    <span className="w-2 h-2 bg-white rounded-full animate-bounce"></span>
                                    <span className="w-2 h-2 bg-white rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></span>
                                    <span className="w-2 h-2 bg-white rounded-full animate-bounce" style={{animationDelay: '0.4s'}}></span>
                                </div>
                            </div>
