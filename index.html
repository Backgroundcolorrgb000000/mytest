                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        setTgUser(tg.initDataUnsafe.user);
                        currentUserId = tg.initDataUnsafe.user.id.toString();
                    }
                    if (tg.colorScheme === 'dark' && !localStorage.getItem('financeAppTheme')) setIsDarkMode(true);
                }

                const loadData = async () => {
                    try {
                        const savedTxs = localStorage.getItem('financeAppTxs');
                        if (savedTxs) {
                            setTransactions(JSON.parse(savedTxs));
                        } else {
                            const demo = generateDemoData();
                            setTransactions(demo);
                            localStorage.setItem('financeAppTxs', JSON.stringify(demo));
                        }
                    } catch (e) {
                        console.error(e);
                    } finally {
                        setIsLoading(false);
                    }
                };
                loadData();
            }, []);

            useEffect(() => {
                if (!isLoading) localStorage.setItem('financeAppTxs', JSON.stringify(transactions));
            }, [transactions, isLoading]);

            useEffect(() => {
                if (isDarkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('financeAppTheme', 'dark'); } 
                else { document.documentElement.classList.remove('dark'); localStorage.setItem('financeAppTheme', 'light'); }
            }, [isDarkMode]);

            const getCurrencyRate = () => {
                if (currencyMode === 'USD') return { rate: 1 / rates.USD, symbol: '$', name: 'USD' };
                if (currencyMode === 'EUR') return { rate: 1 / rates.EUR, symbol: '€', name: 'EUR' };
                return { rate: 1, symbol: '', name: 'UZS' }; 
            };

            const achievements = useMemo(() => generate100Achievements(transactions, goals), [transactions, goals]);

            const closeAddModal = () => {
                setIsAddingMode(false);
                setAddMethod(null);
                setPrefill({ amount: '', title: '', category: 'Продукты' });
                setDisplayAmount(''); setTxTitle(''); setTxWallet('card');
            };

            const handleAmountChange = (e) => {
                const rawValue = e.target.value.replace(/\D/g, '');
                setDisplayAmount(rawValue.replace(/\B(?=(\d{3})+(?!\d))/g, " "));
            };

            const handleAddCategory = (e) => {
                e.preventDefault();
                if(newCatName.trim()) {
                    setCategories([{ name: newCatName, icon: newCatIcon, bg: newCatColor.bg, color: newCatColor.color, hex: newCatColor.hex, isCustom: true }, ...categories]);
                    triggerHaptic('medium');
                    setTxCat(newCatName);
                    setAddMethod('expense');
                    setNewCatName('');
                }
            };

            const handleSaveTransaction = (e) => {
                e.preventDefault();
                const num = parseInt(displayAmount.replace(/\s/g, ''));
                if (!num || !txTitle) return;

                const catObj = categories.find(c => c.name === txCat) || categories[0];
                
                const d = new Date();
                const dateString = d.getDate().toString().padStart(2, '0') + '.' + (d.getMonth() + 1).toString().padStart(2, '0') + ' ' + d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');

                let finalAmount = addMethod === 'income' ? num : -num;
                
                if(currencyMode === 'USD') finalAmount = finalAmount * rates.USD;
                if(currencyMode === 'EUR') finalAmount = finalAmount * rates.EUR;

                const newTx = {
                    id: Date.now(), title: txTitle, category: txCat,
                    amount: finalAmount, date: dateString, rawDate: new Date().toISOString(),
                    icon: catObj.icon, color: catObj.color, bg: catObj.bg,
                    wallet: txWallet
                };

                triggerHaptic('heavy');
                setTransactions([newTx, ...transactions]);
                closeAddModal();
            };

            const handleDeleteTx = (id) => {
                triggerHaptic('medium');
                setTransactions(transactions.filter(t => t.id !== id));
                setSelectedTransaction(null);
            };

            const executeTelegramPayment = () => {
                setIsProcessing(true);
                triggerHaptic('medium');
                setTimeout(() => {
                    setIsProcessing(false);
                    setIsPremium(true);
                    localStorage.setItem('financeAppPremium', 'true');
                    setShowPaywall(false);
                    triggerHaptic('success');
                }, 1500);
            };

            const setupPin = () => {
                const pin = prompt("Введите новый 4-значный ПИН-код (только цифры):");
                if (pin && pin.length === 4 && /^\d+$/.test(pin)) {
                    localStorage.setItem('financeAppPin', pin);
                    triggerHaptic('success');
                } else {
                    triggerHaptic('error');
                }
            };

            const simulateAIProcessing = (method) => {
                triggerHaptic('medium');
                setAddMethod(method);
                setIsProcessing(true);

                let data = { amount: 35000, title: 'Кофе с собой', category: 'Еда вне дома', wallet: 'card' };
                if (method === 'sms_parsing') {
                    data = { amount: 45000, title: 'Yandex GO', category: 'Транспорт', wallet: 'card' };
                } else if (method === 'scan') {
                    data = { amount: 152000, title: 'Супермаркет Korzinka', category: 'Продукты', wallet: 'card' };
                }

                setTimeout(() => {
                    triggerHaptic('success');
                    setIsProcessing(false);
                    setPrefill(data);
                    setDisplayAmount(data.amount.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "));
                    setTxTitle(data.title);
                    setTxCat(data.category);
                    setTxWallet(data.wallet || 'card');
                    setAddMethod('manual_prefilled');
                }, 2500);
            };

            if (isLocked) {
                return <ScreenPin onUnlock={() => setIsLocked(false)} />;
            }

            const renderScreen = () => {
                if (isLoading) return <div className="h-screen flex flex-col items-center justify-center"><i className="fa-solid fa-circle-notch fa-spin text-4xl text-primary mb-4"></i></div>;
                const cr = getCurrencyRate();
                switch(currentScreen) {
                    case 'home': return <ScreenHome setScreen={setCurrentScreen} transactions={transactions} user={tgUser} onTransactionClick={setSelectedTransaction} currencyRate={cr} setAddMethod={(m) => {setAddMethod(m); setIsAddingMode(true);}} />;
                    case 'reports': return <ScreenReports transactions={transactions} onTransactionClick={setSelectedTransaction} currencyRate={cr} />;
                    case 'invest': return <ScreenInvest onBack={() => setCurrentScreen('home')} currencyRate={cr} goals={goals} setGoals={setGoals} isPremium={isPremium} setShowPaywall={setShowPaywall} />;
                    case 'categories': return <ScreenCategories onBack={() => setCurrentScreen('home')} categories={categories} setCategories={setCategories} />;
                    case 'tips': return <ScreenTips openAIChat={() => setCurrentScreen('aichat')} />;
                    case 'aichat': return <ScreenAIChat onBack={() => setCurrentScreen('tips')} userId={tgUser ? tgUser.id.toString() : 'browser_test_user'} />;
                    case 'profile': return <ScreenProfile user={tgUser} isDarkMode={isDarkMode} toggleDarkMode={() => setIsDarkMode(!isDarkMode)} transactions={transactions} achievements={achievements} currencyRate={cr} setCurrencyMode={setCurrencyMode} isPremium={isPremium} setShowPaywall={setShowPaywall} onSetPin={setupPin} />;
                    default: return <ScreenHome setScreen={setCurrentScreen} transactions={transactions} user={tgUser} onTransactionClick={setSelectedTransaction} currencyRate={cr} setAddMethod={(m) => {setAddMethod(m); setIsAddingMode(true);}} />;
                }
            };

            return (
                <div className="max-w-md mx-auto bg-bgLight dark:bg-bgDark min-h-screen relative shadow-2xl overflow-hidden transition-colors duration-300">
                    {renderScreen()}

                    {selectedTransaction && (
                        <div className="fixed inset-0 z-[60] flex items-end">
                            <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={() => setSelectedTransaction(null)}></div>
                            <div className="bg-white dark:bg-gray-900 w-full rounded-t-3xl p-6 relative z-10 animate-fade-in border-t border-gray-100 dark:border-gray-800">
                                <div className="w-12 h-1.5 bg-gray-200 dark:bg-gray-800 rounded-full mx-auto mb-6"></div>
                                <div className="text-center mb-6">
                                    <div className={`w-20 h-20 rounded-2xl mx-auto flex items-center justify-center mb-4 ${selectedTransaction.bg} dark:bg-opacity-20 ${selectedTransaction.color} text-4xl shadow-sm`}>
                                        <IconRenderer icon={selectedTransaction.icon} />
                                    </div>
                                    <h3 className="text-2xl font-bold text-textDark dark:text-white mb-1">{selectedTransaction.title}</h3>
                                    <p className="text-sm font-medium text-gray-500">{selectedTransaction.category} • {selectedTransaction.wallet === 'cash' ? 'Наличные' : 'Карта'} • {selectedTransaction.date}</p>
                                    <h2 className={`text-4xl font-bold mt-5 tracking-tight ${selectedTransaction.amount > 0 ? 'text-green-500' : 'text-textDark dark:text-white'}`}>
                                        {selectedTransaction.amount > 0 ? '+' : ''}{getCurrencyRate().symbol + ' ' + Math.round(Math.abs(selectedTransaction.amount) * getCurrencyRate().rate).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ")}
                                    </h2>
                                </div>
                                <button onClick={() => handleDeleteTx(selectedTransaction.id)} className="w-full bg-red-50 text-red-500 dark:bg-red-900/20 font-bold py-4 rounded-2xl mb-3 transition-colors active:bg-red-100">Удалить операцию</button>
                                <button onClick={() => setSelectedTransaction(null)} className="w-full bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold py-4 rounded-2xl transition-colors">Закрыть</button>
                            </div>
                        </div>
                    )}

                    {isAddingMode && (
                        <div className="fixed inset-0 z-[70] flex items-end">
                            <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={closeAddModal}></div>
                            <div className="bg-white dark:bg-gray-900 w-full h-[92vh] rounded-t-3xl p-5 relative z-10 animate-fade-in flex flex-col border-t border-gray-100 dark:border-gray-800">
                                <div className="w-12 h-1.5 bg-gray-200 dark:bg-gray-800 rounded-full mx-auto mb-4"></div>
                                
                                <div className="flex bg-gray-100 dark:bg-gray-800 p-1 rounded-xl mb-5 shrink-0">
                                    <button onClick={()=>{triggerHaptic(); setAddMethod('expense');}} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${(addMethod==='expense' || addMethod==='manual_prefilled' || !addMethod) ? 'bg-white dark:bg-gray-700 text-red-500 shadow-sm' : 'text-gray-400'}`}>Расход</button>
                                    <button onClick={()=>{triggerHaptic(); setAddMethod('income');}} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${addMethod==='income' ? 'bg-white dark:bg-gray-700 text-green-500 shadow-sm' : 'text-gray-400'}`}>Доход</button>
                                    <button onClick={()=>{triggerHaptic(); setAddMethod('category');}} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${addMethod==='category' ? 'bg-white dark:bg-gray-700 text-primary shadow-sm' : 'text-gray-400'}`}>Категория</button>
                                </div>

                                <div className="flex-1 overflow-y-auto no-scrollbar pb-10 px-1">
                                    {addMethod === 'category' ? (
                                        <form id="addCatForm" onSubmit={handleAddCategory} className="space-y-6 animate-fade-in">
                                            <input required type="text" value={newCatName} onChange={e=>setNewCatName(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 rounded-2xl px-4 py-4 font-bold text-lg text-textDark dark:text-white focus:outline-none border border-gray-200 dark:border-gray-700" placeholder="Название категории" />
                                            
                                            <div>
                                                <p className="text-xs font-bold text-gray-400 uppercase mb-3 ml-1">Базовые цвета</p>
                                                <div className="flex flex-wrap gap-3 mb-4">
                                                    {CATEGORY_COLORS.map((c, i) => (
                                                        <div key={i} onClick={() => {triggerHaptic('light'); setNewCatColor(c);}} className={`w-10 h-10 rounded-full cursor-pointer flex items-center justify-center transition-transform ${newCatColor.hex === c.hex ? 'scale-110 shadow-md ring-2 ring-primary ring-offset-2 dark:ring-offset-gray-900' : ''}`} style={{backgroundColor: c.hex}}></div>
                                                    ))}
                                                </div>
                                                <p className="text-xs font-bold text-gray-400 uppercase mb-3 ml-1">Premium Градиенты <i className="fa-solid fa-crown text-yellow-500"></i></p>
                                                <div className="flex flex-wrap gap-3 relative">
                                                    {PREMIUM_COLORS.map((c, i) => (
                                                        <div key={`p${i}`} onClick={() => { if(!isPremium){setShowPaywall(true); return;} triggerHaptic('light'); setNewCatColor(c);}} className={`w-10 h-10 rounded-full cursor-pointer flex items-center justify-center transition-transform ${newCatColor.hex === c.hex ? 'scale-110 shadow-md ring-2 ring-primary ring-offset-2 dark:ring-offset-gray-900' : ''}`} style={{background: c.hex}}></div>
                                                    ))}
                                                </div>
                                            </div>

                                            <div>
                                                <div className="flex gap-4 mb-3">
                                                    <p onClick={() => {triggerHaptic(); setNewCatIconType('icons'); setNewCatIcon(TOP_ICONS[0]);}} className={`text-xs font-bold uppercase cursor-pointer ${newCatIconType === 'icons' ? 'text-primary' : 'text-gray-400'}`}>Иконки</p>
                                                    <p onClick={() => {triggerHaptic(); setNewCatIconType('emojis'); setNewCatIcon(PREMIUM_EMOJIS[0]);}} className={`text-xs font-bold uppercase cursor-pointer flex items-center gap-1 ${newCatIconType === 'emojis' ? 'text-primary' : 'text-gray-400'}`}>Эмодзи <i className="fa-solid fa-crown text-yellow-500 text-[10px]"></i></p>
                                                </div>
                                                <div className="grid grid-cols-6 gap-3 relative">
                                                    {newCatIconType === 'icons' ? TOP_ICONS.map(ic => (
                                                        <div key={ic} onClick={() => {triggerHaptic('light'); setNewCatIcon(ic);}} className={`aspect-square rounded-2xl flex items-center justify-center text-xl cursor-pointer transition-all ${newCatIcon === ic ? 'bg-primary text-white shadow-md scale-110' : 'bg-gray-50 dark:bg-gray-800 text-gray-400'}`}><i className={`fa-solid ${ic}`}></i></div>
                                                    )) : PREMIUM_EMOJIS.map(em => (
                                                        <div key={em} onClick={() => { if(!isPremium){setShowPaywall(true); return;} triggerHaptic('light'); setNewCatIcon(em);}} className={`aspect-square rounded-2xl flex items-center justify-center text-2xl cursor-pointer transition-all ${newCatIcon === em ? 'bg-primary text-white shadow-md scale-110' : 'bg-gray-50 dark:bg-gray-800'}`}>{em}</div>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="p-4 bg-gray-50 dark:bg-gray-800 rounded-2xl flex items-center gap-4 border border-gray-200 dark:border-gray-700">
                                                <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-2xl ${newCatColor.bg} dark:bg-opacity-20 ${newCatColor.color}`} style={newCatColor.hex.includes('gradient') ? {background: newCatColor.hex} : {}}>
                                                    <IconRenderer icon={newCatIcon} />
                                                </div>
                                                <div>
                                                    <p className="text-xs text-gray-400 font-medium">Предпросмотр</p>
                                                    <p className="font-bold text-textDark dark:text-white text-lg">{newCatName || 'Новая категория'}</p>
                                                </div>
                                            </div>
                                        </form>
                                    ) : (
                                        <div className="animate-fade-in">
                                            {!addMethod && (
                                                <div className="grid grid-cols-2 gap-4 mb-6">
                                                    <div onClick={() => simulateAIProcessing('voice')} className="bg-blue-50 dark:bg-blue-900/30 text-blue-500 py-4 rounded-2xl flex flex-col items-center justify-center gap-2 font-bold cursor-pointer active:scale-95 transition-transform"><i className="fa-solid fa-microphone text-2xl"></i> Голосом</div>
                                                    <div onClick={() => simulateAIProcessing('scan')} className="bg-green-50 dark:bg-green-900/30 text-green-500 py-4 rounded-2xl flex flex-col items-center justify-center gap-2 font-bold cursor-pointer active:scale-95 transition-transform"><i className="fa-solid fa-receipt text-2xl"></i> Скан чека</div>
                                                    <div onClick={() => setAddMethod('sms_input')} className="bg-orange-50 dark:bg-orange-900/30 text-orange-500 py-4 rounded-2xl flex flex-col items-center justify-center gap-2 font-bold cursor-pointer active:scale-95 transition-transform"><i className="fa-solid fa-comment-sms text-2xl"></i> SMS от банка</div>
                                                    <div onClick={() => { setPrefill({ amount: '', title: '', category: 'Продукты' }); setDisplayAmount(''); setTxTitle(''); setAddMethod('manual'); }} className="bg-purple-50 dark:bg-purple-900/30 text-primary py-4 rounded-2xl flex flex-col items-center justify-center gap-2 font-bold cursor-pointer active:scale-95 transition-transform"><i className="fa-solid fa-pen text-2xl"></i> Вручную</div>
                                                </div>
                                            )}

                                            {addMethod === 'sms_input' && (
                                                <div className="py-4 animate-fade-in">
                                                    <h3 className="text-lg font-bold text-textDark dark:text-white mb-3">Вставьте SMS от банка</h3>
                                                    <textarea 
                                                        className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-4 text-sm focus:outline-none focus:border-primary transition-colors text-textDark dark:text-white h-32 resize-none" 
                                                        placeholder="Например: Списание 45 000 UZS. Карта *4512. Получатель: Yandex GO"
                                                    ></textarea>
                                                    <button onClick={() => simulateAIProcessing('sms_parsing')} className="w-full mt-4 bg-primary text-white font-bold py-3.5 rounded-2xl shadow-md active:scale-[0.98] transition-transform">Анализировать SMS</button>
                                                </div>
                                            )}

                                            {addMethod === 'voice' && (
                                                <div className="py-10 text-center flex flex-col items-center animate-fade-in mb-6">
                                                    <div className="relative mb-6">
                                                        <div className="w-20 h-20 bg-blue-100 dark:bg-blue-900/50 rounded-full flex items-center justify-center text-blue-500 text-3xl relative z-10">
                                                            <i className="fa-solid fa-microphone animate-pulse"></i>
                                                        </div>
                                                        <div className="absolute inset-0 rounded-full bg-blue-500 animate-pulse-ring z-0"></div>
                                                    </div>
                                                    <h3 className="text-lg font-bold text-textDark dark:text-white mb-2">Внимательно слушаю...</h3>
                                                    <p className="text-sm text-gray-500">Скажите: "Купил кофе за 35 тысяч"</p>
                                                </div>
                                            )}
                                            {addMethod === 'scan' && (
                                                <div className="py-6 text-center flex flex-col items-center animate-fade-in mb-6">
                                                    <div className="w-48 h-64 bg-gray-100 dark:bg-gray-800 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl relative overflow-hidden mb-6 flex items-center justify-center">
                                                        <i className="fa-solid fa-receipt text-6xl text-gray-300 dark:text-gray-600"></i>
                                                        <div className="animate-scanline"></div>
                                                    </div>
                                                    <h3 className="text-lg font-bold text-textDark dark:text-white">AI анализирует позиции...</h3>
                                                </div>
                                            )}
                                            {addMethod === 'sms_parsing' && (
                                                <div className="py-10 text-center flex flex-col items-center animate-fade-in mb-6">
                                                    <div className="relative mb-6">
                                                        <div className="w-20 h-20 bg-purple-100 dark:bg-purple-900/50 rounded-full flex items-center justify-center text-primary text-3xl relative z-10">
                                                            <i className="fa-solid fa-robot animate-pulse"></i>
                                                        </div>
                                                        <div className="absolute inset-0 rounded-full bg-primary animate-pulse-ring z-0"></div>
                                                    </div>
                                                    <h3 className="text-lg font-bold text-textDark dark:text-white mb-2">ИИ читает сообщение...</h3>
                                                </div>
                                            )}

                                            {(addMethod === 'manual' || addMethod === 'manual_prefilled' || addMethod === 'expense' || addMethod === 'income') && (
                                                <form id="addTxForm" onSubmit={handleSaveTransaction} className={`space-y-4 transition-opacity`}>
                                                    <div className="bg-gray-50 dark:bg-gray-800 rounded-3xl p-4 flex items-center justify-center mb-2 border border-gray-200 dark:border-gray-700">
                                                        <span className="text-2xl text-gray-400 font-bold mr-2">{getCurrencyRate().symbol || 'UZS'}</span>
                                                        <input required type="text" value={displayAmount} onChange={handleAmountChange} className="w-full bg-transparent text-center font-bold text-4xl text-textDark dark:text-white focus:outline-none placeholder-gray-300 dark:placeholder-gray-600" placeholder="0" />
                                                    </div>
                                                    
                                                    <div className="flex gap-2">
                                                        <input required type="text" value={txTitle} onChange={e=>setTxTitle(e.target.value)} className="flex-1 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl px-4 py-4 font-bold text-textDark dark:text-white focus:outline-none" placeholder="Название (напр. Кофе)" />
                                                    </div>

                                                    <div>
                                                        <p className="text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Счет оплаты</p>
                                                        <div className="flex bg-gray-100 dark:bg-gray-800 p-1 rounded-xl mb-4">
                                                            <button type="button" onClick={()=>{triggerHaptic('light'); setTxWallet('card');}} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${txWallet==='card' ? 'bg-white dark:bg-gray-700 text-textDark dark:text-white shadow-sm' : 'text-gray-400'}`}><i className="fa-regular fa-credit-card mr-1"></i> Карта</button>
                                                            <button type="button" onClick={()=>{triggerHaptic('light'); setTxWallet('cash');}} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${txWallet==='cash' ? 'bg-white dark:bg-gray-700 text-emerald-500 shadow-sm' : 'text-gray-400'}`}><i className="fa-solid fa-money-bill-wave mr-1"></i> Наличные</button>
                                                        </div>
                                                    </div>

                                                    <div>
                                                        <p className="text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Категория</p>
                                                        <div className="flex gap-2 overflow-x-auto no-scrollbar pb-2">
                                                            {categories.map(c => (
                                                                <div key={c.name} onClick={()=>{triggerHaptic('light'); setTxCat(c.name);}} className={`flex-shrink-0 flex items-center gap-2 px-3 py-2 rounded-xl cursor-pointer transition-colors border ${txCat === c.name ? 'border-primary bg-primary/5 dark:bg-primary/10' : 'border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800'}`}>
                                                                    <div className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] ${c.bg} dark:bg-opacity-20 ${c.color}`} style={c.hex && c.hex.includes('gradient') ? {background: c.hex} : {}}>
                                                                        <IconRenderer icon={c.icon} />
                                                                    </div>
                                                                    <span className={`text-sm font-bold ${txCat === c.name ? 'text-primary' : 'text-gray-600 dark:text-gray-300'}`}>{c.name}</span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </form>
                                            )}
                                        </div>
                                    )}
                                </div>

                                <div className="pt-4 border-t border-gray-100 dark:border-gray-800 shrink-0">
                                    <button type="submit" form={addMethod === 'category' ? "addCatForm" : "addTxForm"} disabled={isProcessing} className={`w-full text-white font-bold py-4 rounded-2xl shadow-lg transition-transform active:scale-[0.98] ${isProcessing || !addMethod || addMethod === 'sms_input' ? 'hidden' : ''} ${addMethod === 'income' ? 'bg-green-500 shadow-green-500/30' : 'bg-primary shadow-purple-500/30'}`}>
                                        {addMethod === 'category' ? 'Создать категорию' : (addMethod === 'income' ? 'Добавить доход' : 'Добавить расход')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showPaywall && (
                        <div className="fixed inset-0 z-[80] flex items-end">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setShowPaywall(false)}></div>
                            <div className="bg-white dark:bg-gray-900 w-full rounded-t-[32px] p-6 relative z-10 animate-fade-in flex flex-col items-center">
                                <div className="w-12 h-1.5 bg-gray-200 dark:bg-gray-800 rounded-full mx-auto mb-6 relative z-10"></div>
                                <div className="w-20 h-20 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-full flex items-center justify-center text-white text-3xl shadow-xl shadow-orange-500/30 mb-4 border-4 border-white dark:border-gray-900">
                                    <i className="fa-solid fa-crown"></i>
                                </div>
                                <h2 className="text-3xl font-bold text-textDark dark:text-white mb-2">FinanceAI <span className="text-transparent bg-clip-text bg-gradient-to-r from-yellow-500 to-orange-500">PRO</span></h2>
                                <p className="text-center text-gray-500 text-sm mb-6 px-4">Разблокируйте все возможности умного кошелька. Разовая оплата навсегда.</p>
                                
                                <div className="w-full space-y-3 mb-6">
                                    <div className="flex items-center gap-4 bg-gray-50 dark:bg-gray-800 p-3.5 rounded-2xl">
                                        <div className="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center text-primary"><i className="fa-solid fa-robot"></i></div>
                                        <div><h4 className="font-bold text-sm text-textDark dark:text-white">Безлимитный ИИ</h4></div>
                                    </div>
                                    <div className="flex items-center gap-4 bg-gray-50 dark:bg-gray-800 p-3.5 rounded-2xl">
                                        <div className="w-10 h-10 rounded-full bg-pink-100 flex items-center justify-center text-pink-500"><i className="fa-solid fa-palette"></i></div>
                                        <div><h4 className="font-bold text-sm text-textDark dark:text-white">Эмодзи и Градиенты</h4></div>
                                    </div>
                                    <div className="flex items-center gap-4 bg-gray-50 dark:bg-gray-800 p-3.5 rounded-2xl">
                                        <div className="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-500"><i className="fa-solid fa-file-csv"></i></div>
                                        <div><h4 className="font-bold text-sm text-textDark dark:text-white">Экспорт отчетов в CSV</h4></div>
                                    </div>
                                </div>

                                <div className="bg-blue-50 dark:bg-blue-900/20 rounded-xl p-4 mb-6 w-full text-center border border-blue-100 dark:border-blue-800/50">
                                    <p className="text-xs text-blue-600 dark:text-blue-400 font-medium">Оплата производится через официальные <strong className="font-bold">Telegram Stars ⭐️</strong>. Их можно купить с любой карты.</p>
                                    <a href="https://t.me/PremiumBot" target="_blank" className="text-xs text-primary font-bold mt-2 block underline">Как купить Звезды?</a>
                                </div>

                                <button onClick={executeTelegramPayment} disabled={isProcessing} className="w-full bg-[#2AABEE] text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-lg shadow-blue-500/30">
                                    {isProcessing ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <><i className="fa-solid fa-star text-yellow-300"></i> Оплатить 100 Звезд</>}
                                </button>
                            </div>
                        </div>
                    )}

                    {['home', 'reports', 'invest', 'categories', 'tips', 'profile'].includes(currentScreen) && (
                        <div className="fixed bottom-0 w-full max-w-md bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-t border-gray-100 dark:border-gray-800 px-6 py-2.5 flex justify-between items-center z-40 transition-colors duration-300">
                            <button onClick={() => {triggerHaptic('light'); setCurrentScreen('home');}} className={`flex flex-col items-center p-2 transition-colors ${currentScreen === 'home' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-solid fa-house text-xl mb-1"></i><span className="text-[10px] font-bold">Главная</span></button>
                            <button onClick={() => {triggerHaptic('light'); setCurrentScreen('reports');}} className={`flex flex-col items-center p-2 transition-colors ${currentScreen === 'reports' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-solid fa-chart-pie text-xl mb-1"></i><span className="text-[10px] font-bold">Отчеты</span></button>
                            
                            <div className="relative -top-6">
                                <button onClick={() => {triggerHaptic('medium'); setIsAddingMode(true); setAddMethod(null);}} className="w-14 h-14 bg-primary rounded-full flex items-center justify-center text-white text-2xl shadow-lg shadow-purple-500/40 transform active:scale-95 transition-all border-4 border-bgLight dark:border-bgDark"><i className="fa-solid fa-plus"></i></button>
                            </div>

                            <button onClick={() => {triggerHaptic('light'); setCurrentScreen('tips');}} className={`flex flex-col items-center p-2 transition-colors ${currentScreen === 'tips' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-regular fa-lightbulb text-xl mb-1"></i><span className="text-[10px] font-bold">Советы</span></button>
                            <button onClick={() => {triggerHaptic('light'); setCurrentScreen('profile');}} className={`flex flex-col items-center p-2 transition-colors ${currentScreen === 'profile' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-regular fa-user text-xl mb-1"></i><span className="text-[10px] font-bold">Профиль</span></button>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
