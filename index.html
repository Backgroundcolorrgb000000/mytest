<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Финансы Telegram App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#7C3AED', primaryLight: '#8B5CF6', primaryDark: '#5B21B6',
                        bgLight: '#F9FAFB', bgDark: '#030712', textDark: '#111827', cardDark: '#111827'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes pulse-ring { 0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(124, 58, 237, 0); } 100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); } }
        .animate-pulse-ring { animation: pulse-ring 2s infinite cubic-bezier(0.66, 0, 0, 1); }
        @keyframes scanline { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
        .animate-scanline { position: absolute; left: 0; width: 100%; height: 2px; background-color: #10B981; box-shadow: 0 0 10px #10B981, 0 0 20px #10B981; animation: scanline 2s linear infinite; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-bgLight dark:bg-bgDark transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const API_URL = 'https://mytest-production-6436.up.railway.app/api';

        const TOP_ICONS = [
            'fa-basket-shopping', 'fa-bus', 'fa-utensils', 'fa-play', 'fa-bag-shopping', 'fa-pills', 'fa-house', 'fa-car',
            'fa-plane', 'fa-dumbbell', 'fa-paw', 'fa-gamepad', 'fa-mug-hot', 'fa-scissors', 'fa-music', 'fa-book',
            'fa-shirt', 'fa-shoe-prints', 'fa-glasses', 'fa-baby-carriage', 'fa-graduation-cap', 'fa-laptop', 'fa-mobile',
            'fa-tv', 'fa-camera', 'fa-couch', 'fa-bed', 'fa-bath', 'fa-tooth', 'fa-screwdriver-wrench', 'fa-hammer',
            'fa-lightbulb', 'fa-plug', 'fa-droplet', 'fa-fire', 'fa-gas-pump', 'fa-ticket', 'fa-popcorn', 'fa-mask',
            'fa-palette', 'fa-bicycle', 'fa-motorcycle', 'fa-train', 'fa-ship', 'fa-taxi', 'fa-hotel', 'fa-campground',
            'fa-tree', 'fa-mountain', 'fa-umbrella-beach'
        ];

        const CATEGORY_COLORS = [
            { bg: 'bg-red-100', color: 'text-red-500', hex: '#EF4444' }, { bg: 'bg-orange-100', color: 'text-orange-500', hex: '#F97316' },
            { bg: 'bg-amber-100', color: 'text-amber-500', hex: '#F59E0B' }, { bg: 'bg-yellow-100', color: 'text-yellow-500', hex: '#EAB308' },
            { bg: 'bg-lime-100', color: 'text-lime-500', hex: '#84CC16' }, { bg: 'bg-green-100', color: 'text-green-500', hex: '#22C55E' },
            { bg: 'bg-emerald-100', color: 'text-emerald-500', hex: '#10B981' }, { bg: 'bg-teal-100', color: 'text-teal-500', hex: '#14B8A6' },
            { bg: 'bg-cyan-100', color: 'text-cyan-500', hex: '#06B6D4' }, { bg: 'bg-sky-100', color: 'text-sky-500', hex: '#0EA5E9' },
            { bg: 'bg-blue-100', color: 'text-blue-500', hex: '#3B82F6' }, { bg: 'bg-indigo-100', color: 'text-indigo-500', hex: '#6366F1' },
            { bg: 'bg-violet-100', color: 'text-violet-500', hex: '#8B5CF6' }, { bg: 'bg-purple-100', color: 'text-purple-500', hex: '#A855F7' },
            { bg: 'bg-fuchsia-100', color: 'text-fuchsia-500', hex: '#D946EF' }, { bg: 'bg-pink-100', color: 'text-pink-500', hex: '#EC4899' },
            { bg: 'bg-rose-100', color: 'text-rose-500', hex: '#F43F5E' }
        ];

        const triggerHaptic = (style = 'light') => {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred(style);
            }
        };

        const formatMoneyInput = (value) => {
            if (!value) return '';
            const num = value.toString().replace(/\D/g, '');
            return num.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        };

        const generateDemoData = () => {
            const txs = [];
            let idCounter = Date.now();
            const places = {
                'Продукты': ['Korzinka', 'Makro', 'Базар', 'Korzinka'],
                'Транспорт': ['Яндекс Такси', 'Метро', 'Яндекс Такси'],
                'Еда вне дома': ['Кофейня', 'Evos', 'KFC', 'Кофейня'],
                'Развлечения': ['Кинотеатр', 'Подписка Netflix', 'Кинотеатр'],
                'Покупки': ['Zara', 'Техника', 'Zara']
            };

            const colors = {
                'Продукты': {icon: 'fa-basket-shopping', bg: 'bg-orange-100', color: 'text-orange-500'},
                'Транспорт': {icon: 'fa-bus', bg: 'bg-blue-100', color: 'text-blue-500'},
                'Еда вне дома': {icon: 'fa-utensils', bg: 'bg-amber-100', color: 'text-amber-600'},
                'Развлечения': {icon: 'fa-play', bg: 'bg-pink-100', color: 'text-pink-500'},
                'Покупки': {icon: 'fa-bag-shopping', bg: 'bg-purple-100', color: 'text-purple-500'}
            };

            const now = new Date();
            for (let i = 0; i < 40; i++) {
                const date = new Date(now.getTime() - Math.floor(Math.random() * 90 * 24 * 60 * 60 * 1000));
                const catKeys = Object.keys(places);
                const category = catKeys[Math.floor(Math.random() * catKeys.length)];
                const title = places[category][Math.floor(Math.random() * places[category].length)];
                
                let baseAmount = category === 'Транспорт' ? 20000 : (category === 'Еда вне дома' ? 50000 : 150000);
                const amount = -(baseAmount + Math.floor(Math.random() * 10) * 5000);

                const dateString = date.getDate().toString().padStart(2, '0') + '.' + 
                                  (date.getMonth() + 1).toString().padStart(2, '0') + ' ' + 
                                  date.getHours().toString().padStart(2, '0') + ':' + 
                                  date.getMinutes().toString().padStart(2, '0');

                txs.push({
                    id: idCounter--, userId: 'demo', title, category, amount,
                    icon: colors[category].icon, color: colors[category].color, bg: colors[category].bg,
                    date: dateString, rawDate: date.toISOString()
                });
            }
            return txs.sort((a, b) => new Date(b.rawDate) - new Date(a.rawDate));
        };

        const getGreeting = () => {
            const hour = new Date().getHours();
            if (hour >= 5 && hour < 12) return 'Доброе утро';
            if (hour >= 12 && hour < 18) return 'Добрый день';
            if (hour >= 18 && hour < 23) return 'Добрый вечер';
            return 'Доброй ночи';
        };

        const TopHeader = ({ title, showBack = false, onBack, rightIcon = null, onRightClick = null }) => (
            <div className="flex justify-between items-center px-4 py-4 bg-bgLight dark:bg-bgDark sticky top-0 z-10 transition-colors duration-300">
                <div className="flex items-center gap-3">
                    {showBack && (
                        <button onClick={()=>{triggerHaptic('light'); onBack();}} className="w-8 h-8 flex items-center justify-center bg-white dark:bg-gray-800 rounded-full text-gray-600 dark:text-gray-300 hover:text-primary transition-colors shadow-sm">
                            <i className="fa-solid fa-arrow-left text-sm"></i>
                        </button>
                    )}
                    <h1 className="text-xl font-bold text-textDark dark:text-white transition-colors">{title}</h1>
                </div>
                {rightIcon && (
                    <button onClick={()=>{triggerHaptic('light'); if(onRightClick) onRightClick();}} className="w-8 h-8 flex items-center justify-center bg-white dark:bg-gray-800 rounded-full text-gray-600 dark:text-gray-300 hover:text-primary transition-colors shadow-sm">
                        <i className={`fa-solid ${rightIcon} text-sm`}></i>
                    </button>
                )}
            </div>
        );

        const ScreenHome = ({ setScreen, transactions, user, onTransactionClick, currencyRate, setAddMethod }) => {
            const userName = (user && user.first_name) ? user.first_name : 'Dima';
            const greeting = getGreeting();

            const formatMoney = (num) => {
                const converted = Math.round(num * currencyRate.rate);
                return currencyRate.symbol + ' ' + converted.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
            };

            const totalIncome = transactions.filter(t => t.amount > 0).reduce((acc, curr) => acc + curr.amount, 0) + 12150000;
            const totalExpense = transactions.filter(t => t.amount < 0).reduce((acc, curr) => acc + Math.abs(curr.amount), 0);
            const currentBalance = totalIncome - totalExpense;

            return (
                <div className="pb-24 animate-fade-in">
                    <div className="px-5 pt-4 pb-2 flex justify-between items-center transition-colors">
                        <div>
                            <p className="text-xs text-gray-500 dark:text-gray-400 mb-0.5">{greeting},</p>
                            <h2 className="text-2xl font-bold text-textDark dark:text-white">{userName}</h2>
                        </div>
                        <div className="w-10 h-10 bg-white dark:bg-gray-800 rounded-full flex items-center justify-center shadow-sm text-gray-600 dark:text-gray-300 relative transition-colors cursor-pointer" onClick={() => {triggerHaptic(); setScreen('profile');}}>
                            <i className="fa-regular fa-bell"></i>
                            <span className="absolute top-2 right-2 w-2.5 h-2.5 bg-red-500 border-2 border-white dark:border-gray-800 rounded-full"></span>
                        </div>
                    </div>

                    <div className="px-4 py-2 flex overflow-x-auto snap-x snap-mandatory no-scrollbar space-x-4">
                        <div className="min-w-[85%] snap-center bg-gradient-to-br from-primary to-purple-600 rounded-[28px] p-6 text-white shadow-lg shadow-purple-500/30 relative overflow-hidden flex-shrink-0">
                            <div className="absolute -right-6 -bottom-6 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl"></div>
                            <div className="flex justify-between items-center mb-2 relative z-10">
                                <span className="text-sm font-medium text-purple-100">Общий баланс</span>
                            </div>
                            <h2 className="text-3xl font-bold mb-6 relative z-10 tracking-tight">{formatMoney(currentBalance)}</h2>
                            <div className="flex justify-between relative z-10">
                                <div>
                                    <p className="text-[11px] font-medium text-purple-200 mb-0.5 uppercase tracking-wider">Доходы</p>
                                    <p className="font-bold text-sm">{formatMoney(totalIncome)}</p>
                                </div>
                                <div className="text-right">
                                    <p className="text-[11px] font-medium text-purple-200 mb-0.5 uppercase tracking-wider">Расходы</p>
                                    <p className="font-bold text-sm">{formatMoney(-totalExpense)}</p>
                                </div>
                            </div>
                        </div>

                        <div className="min-w-[85%] snap-center bg-gray-900 rounded-[28px] p-6 text-white shadow-lg relative overflow-hidden flex-shrink-0">
                            <div className="absolute right-5 top-5 text-gray-500 text-xl font-bold italic">UZCARD</div>
                            <span className="text-sm font-medium text-gray-400 mb-2 block relative z-10">Зарплатная карта</span>
                            <h2 className="text-3xl font-bold mb-8 relative z-10 tracking-tight">{formatMoney(8400000)}</h2>
                            <div className="flex justify-between items-end relative z-10">
                                <p className="font-mono tracking-widest text-sm text-gray-400">**** 4512</p>
                                <div className="w-8 h-8 rounded-full border border-gray-700 flex items-center justify-center bg-gray-800"><i className="fa-solid fa-chevron-right text-xs"></i></div>
                            </div>
                        </div>
                    </div>

                    <div className="flex justify-between px-6 py-5">
                        <div className="flex flex-col items-center gap-2 cursor-pointer group" onClick={() => {triggerHaptic(); setAddMethod('income');}}>
                            <div className="w-14 h-14 bg-blue-50 dark:bg-blue-900/30 rounded-2xl flex items-center justify-center text-blue-500 text-xl group-hover:scale-105 transition-transform"><i className="fa-solid fa-arrow-down"></i></div>
                            <span className="text-xs font-medium text-gray-600 dark:text-gray-400">Доход</span>
                        </div>
                        <div className="flex flex-col items-center gap-2 cursor-pointer group" onClick={() => {triggerHaptic(); setAddMethod('expense');}}>
                            <div className="w-14 h-14 bg-red-50 dark:bg-red-900/30 rounded-2xl flex items-center justify-center text-red-500 text-xl group-hover:scale-105 transition-transform"><i className="fa-solid fa-arrow-up"></i></div>
                            <span className="text-xs font-medium text-gray-600 dark:text-gray-400">Расход</span>
                        </div>
                        <div className="flex flex-col items-center gap-2 cursor-pointer group" onClick={() => {triggerHaptic(); setScreen('calculator');}}>
                            <div className="w-14 h-14 bg-purple-50 dark:bg-purple-900/30 rounded-2xl flex items-center justify-center text-primary text-xl group-hover:scale-105 transition-transform"><i className="fa-solid fa-piggy-bank"></i></div>
                            <span className="text-xs font-medium text-gray-600 dark:text-gray-400">Вклад</span>
                        </div>
                        <div className="flex flex-col items-center gap-2 cursor-pointer group" onClick={() => {triggerHaptic(); setScreen('categories');}}>
                            <div className="w-14 h-14 bg-emerald-50 dark:bg-emerald-900/30 rounded-2xl flex items-center justify-center text-emerald-500 text-xl group-hover:scale-105 transition-transform"><i className="fa-solid fa-layer-group"></i></div>
                            <span className="text-xs font-medium text-gray-600 dark:text-gray-400">Категории</span>
                        </div>
                    </div>

                    <div className="px-5 py-2">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-bold text-textDark dark:text-white transition-colors">Последние операции</h3>
                            <button onClick={() => {triggerHaptic(); setScreen('reports');}} className="text-sm font-medium text-primary hover:text-primaryDark">Все</button>
                        </div>
                        
                        <div className="space-y-3">
                            {transactions.length === 0 ? (
                                <p className="text-center text-sm text-gray-400 py-6">У вас пока нет транзакций.</p>
                            ) : transactions.slice(0, 5).map(t => (
                                <div key={t.id} onClick={() => {triggerHaptic('light'); onTransactionClick(t);}} className="flex items-center justify-between bg-white dark:bg-gray-900 p-3.5 rounded-2xl shadow-sm active:scale-[0.98] transition-all cursor-pointer">
                                    <div className="flex items-center gap-3.5">
                                        <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-xl ${t.bg} dark:bg-opacity-20 ${t.color}`}>
                                            <i className={`fa-solid ${t.icon}`}></i>
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-sm text-textDark dark:text-white transition-colors">{t.title}</h4>
                                            <p className="text-xs font-medium text-gray-500 dark:text-gray-400 transition-colors mt-0.5">{t.category}</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <p className={`font-bold text-sm ${t.amount > 0 ? 'text-green-500' : 'text-textDark dark:text-white transition-colors'}`}>
                                            {t.amount > 0 ? '+' : ''}{formatMoney(t.amount)}
                                        </p>
                                        <p className="text-[11px] font-medium text-gray-400 dark:text-gray-500 transition-colors mt-1">{t.date}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenReports = ({ transactions, onTransactionClick, currencyRate }) => {
            const chartRef = useRef(null);
            const [expandedCategory, setExpandedCategory] = useState(null);
            const [expandedPlace, setExpandedPlace] = useState(null);

            const formatMoney = (num) => {
                const converted = Math.round(num * currencyRate.rate);
                return currencyRate.symbol + ' ' + converted.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
            };

            const expenses = transactions.filter(t => t.amount < 0);
            const totalExpense = expenses.reduce((acc, t) => acc + Math.abs(t.amount), 0);

            const categoryData = useMemo(() => {
                const data = {};
                expenses.forEach(t => {
                    if(!data[t.category]) data[t.category] = { total: 0, items: [], colorHex: t.color, bg: t.bg, icon: t.icon, textCol: t.color };
                    data[t.category].total += Math.abs(t.amount);
                    data[t.category].items.push(t);
                });
                return Object.entries(data).map(([name, val]) => ({
                    name, 
                    total: val.total, 
                    percent: totalExpense ? Math.round((val.total / totalExpense) * 100) : 0,
                    ...val
                })).sort((a, b) => b.total - a.total);
            }, [expenses, totalExpense]);

            const getHexColor = (colorClass) => {
                if(colorClass.includes('orange')) return '#F97316';
                if(colorClass.includes('blue')) return '#3B82F6';
                if(colorClass.includes('amber')) return '#F59E0B';
                if(colorClass.includes('pink')) return '#EC4899';
                if(colorClass.includes('green')) return '#22C55E';
                if(colorClass.includes('purple') || colorClass.includes('primary')) return '#7C3AED';
                return '#9CA3AF';
            };

            useEffect(() => {
                const ctx = document.getElementById('donutChart');
                if (ctx && categoryData.length > 0) {
                    if (chartRef.current) chartRef.current.destroy();
                    chartRef.current = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: categoryData.map(c => c.name),
                            datasets: [{
                                data: categoryData.map(c => c.total),
                                backgroundColor: categoryData.map(c => getHexColor(c.textCol)),
                                borderWidth: 0,
                                hoverOffset: 4
                            }]
                        },
                        options: {
                            cutout: '75%', responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { display: false }, tooltip: { enabled: false } }
                        }
                    });
                }
            }, [categoryData]);

            const renderGroupedItems = (catItems, catName) => {
                const grouped = {};
                catItems.forEach(t => {
                    const title = t.title.trim();
                    if(!grouped[title]) grouped[title] = { total: 0, count: 0, txs: [] };
                    grouped[title].total += Math.abs(t.amount);
                    grouped[title].count += 1;
                    grouped[title].txs.push(t);
                });

                return Object.entries(grouped).sort((a, b) => b[1].total - a[1].total).map(([title, group], i) => (
                    <div key={i} className="bg-gray-50 dark:bg-gray-800/50 rounded-xl mb-2 overflow-hidden transition-colors">
                        <div 
                            className="flex justify-between items-center p-3 cursor-pointer active:bg-gray-100 dark:active:bg-gray-800"
                            onClick={() => {
                                triggerHaptic('light'); 
                                const id = `${catName}-${title}`;
                                setExpandedPlace(expandedPlace === id ? null : id);
                            }}
                        >
                            <div>
                                <h4 className="font-bold text-sm text-textDark dark:text-white">{title} <span className="text-xs text-gray-400 font-normal ml-1">x{group.count}</span></h4>
                            </div>
                            <div className="flex items-center gap-2">
                                <span className="font-bold text-sm text-textDark dark:text-white">{formatMoney(group.total)}</span>
                                <i className={`fa-solid fa-chevron-down text-xs text-gray-400 transition-transform ${expandedPlace === `${catName}-${title}` ? 'rotate-180' : ''}`}></i>
                            </div>
                        </div>
                        {expandedPlace === `${catName}-${title}` && (
                            <div className="pl-4 pr-3 pb-2 animate-fade-in">
                                <div className="border-l-2 border-gray-200 dark:border-gray-700 pl-3 space-y-3 pt-2">
                                    {group.txs.map((t, idx) => {
                                        let diffElement = null;
                                        if (idx < group.txs.length - 1) {
                                            const prevT = group.txs[idx + 1]; 
                                            const currAmt = Math.abs(t.amount);
                                            const prevAmt = Math.abs(prevT.amount);
                                            if (currAmt !== prevAmt && prevAmt > 0) {
                                                const diffPerc = Math.round(((currAmt - prevAmt) / prevAmt) * 100);
                                                if (diffPerc > 0) {
                                                    diffElement = <span className="text-[10px] font-bold text-red-500 bg-red-100 dark:bg-red-900/30 px-1.5 py-0.5 rounded ml-2">↑ +{diffPerc}%</span>;
                                                } else if (diffPerc < 0) {
                                                    diffElement = <span className="text-[10px] font-bold text-green-500 bg-green-100 dark:bg-green-900/30 px-1.5 py-0.5 rounded ml-2">↓ {diffPerc}%</span>;
                                                }
                                            }
                                        }
                                        return (
                                            <div key={t.id} onClick={() => {triggerHaptic('light'); onTransactionClick(t);}} className="flex justify-between items-center active:opacity-50 transition-opacity cursor-pointer">
                                                <div>
                                                    <p className="text-sm font-medium text-textDark dark:text-white flex items-center">{t.date.split(' ')[0]} {diffElement}</p>
                                                    <p className="text-xs text-gray-400">{t.date.split(' ')[1]}</p>
                                                </div>
                                                <span className="font-bold text-sm text-textDark dark:text-white">{formatMoney(Math.abs(t.amount))}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </div>
                ));
            };

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-24 transition-colors duration-300">
                    <TopHeader title="Отчет" rightIcon="fa-ellipsis" />
                    
                    <div className="flex items-center justify-center gap-4 py-2 mb-4">
                        <button className="text-primary"><i className="fa-solid fa-arrow-left"></i></button>
                        <span className="font-bold text-textDark dark:text-white">Май, 2026</span>
                        <button className="text-gray-300 dark:text-gray-700" disabled><i className="fa-solid fa-arrow-right"></i></button>
                    </div>

                    <div className="relative w-64 h-64 mx-auto mb-8">
                        <canvas id="donutChart"></canvas>
                        <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                            <span className="text-sm text-gray-500 dark:text-gray-400 mb-1">Всего</span>
                            <span className="text-2xl font-bold text-textDark dark:text-white">{formatMoney(totalExpense)}</span>
                        </div>
                    </div>

                    <div className="px-5">
                        {categoryData.length === 0 ? (
                            <p className="text-center text-gray-400">Нет данных для отчета.</p>
                        ) : (
                            <div className="space-y-4">
                                {categoryData.map(cat => (
                                    <div key={cat.name}>
                                        <div 
                                            className="flex items-center justify-between cursor-pointer mb-2 active:opacity-70 transition-opacity"
                                            onClick={() => {triggerHaptic('light'); setExpandedCategory(expandedCategory === cat.name ? null : cat.name);}}
                                        >
                                            <div className="flex items-center gap-3">
                                                <span className={`w-3 h-3 rounded-full ${cat.bg}`}></span>
                                                <span className="font-bold text-sm text-textDark dark:text-white">{cat.name}</span>
                                            </div>
                                            <div className="flex items-center gap-4 text-right">
                                                <span className="font-bold text-sm text-textDark dark:text-white">{formatMoney(cat.total)}</span>
                                                <span className="text-xs font-mono text-gray-400 w-8 text-right">{cat.percent}%</span>
                                            </div>
                                        </div>
                                        {expandedCategory === cat.name && (
                                            <div className="animate-fade-in pl-6 pr-2 mb-4">
                                                {renderGroupedItems(cat.items, cat.name)}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const ScreenCategories = ({ setScreen, categories, setCategories, currencyRate }) => {
            const handleDeleteCategory = (catName) => {
                triggerHaptic('heavy');
                setCategories(categories.filter(c => c.name !== catName));
            };

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-24 transition-colors duration-300">
                    <TopHeader title="Категории" showBack={true} onBack={() => setScreen('home')} />
                    
                    <div className="space-y-3 px-5 pt-4">
                        {categories.filter(c=>c.isCustom).map((cat, i) => (
                            <div key={i} className="flex justify-between items-center bg-white dark:bg-gray-900 p-4 rounded-2xl shadow-sm">
                                <div className="flex items-center gap-4">
                                    <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-xl ${cat.bg} dark:bg-opacity-20 ${cat.color}`}><i className={`fa-solid ${cat.icon}`}></i></div>
                                    <span className="font-bold text-textDark dark:text-white">{cat.name}</span>
                                </div>
                                <button onClick={() => handleDeleteCategory(cat.name)} className="w-10 h-10 flex items-center justify-center bg-red-50 text-red-500 rounded-xl hover:bg-red-100 transition-colors"><i className="fa-solid fa-trash-can text-sm"></i></button>
                            </div>
                        ))}
                        {categories.filter(c=>!c.isCustom).map((cat, i) => (
                            <div key={i} className="flex justify-between items-center bg-white dark:bg-gray-900 p-4 rounded-2xl shadow-sm opacity-60">
                                <div className="flex items-center gap-4">
                                    <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-xl ${cat.bg} dark:bg-opacity-20 ${cat.color}`}><i className={`fa-solid ${cat.icon}`}></i></div>
                                    <span className="font-bold text-textDark dark:text-white">{cat.name} <span className="text-[10px] font-normal text-gray-400 ml-2">(Базовая)</span></span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const ScreenCalculator = ({ onBack, currencyRate, goals, setGoals }) => {
            const [mainTab, setMainTab] = useState('calc'); 
            const [calcMode, setCalcMode] = useState('deposit');
            const [sum, setSum] = useState('10000000');
            const [percent, setPercent] = useState('18');
            const [months, setMonths] = useState('12');

            const [showAddGoal, setShowAddGoal] = useState(false);
            const [newGoal, setNewGoal] = useState({ title: '', target: '', months: '', icon: 'fa-car', color: CATEGORY_COLORS[10] });

            const handleSumChange = (e) => setSum(e.target.value.replace(/\D/g, ''));
            
            const formatMoneyStr = (val) => {
                if(!val) return '0';
                const converted = Math.round(parseInt(val) * currencyRate.rate);
                return currencyRate.symbol + ' ' + converted.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
            };

            const calculate = () => {
                const S = parseInt(sum) || 0;
                const P = parseFloat(percent) || 0;
                const M = parseInt(months) || 0;
                
                if (calcMode === 'deposit') {
                    const profit = S * (P / 100) * (M / 12);
                    return { total: S + profit, profit: profit, monthly: profit / (M || 1) };
                } else {
                    if (P === 0) return { total: S, monthly: S / (M || 1), overpay: 0 };
                    const r = (P / 100) / 12;
                    const monthly = S * (r * Math.pow(1 + r, M)) / (Math.pow(1 + r, M) - 1);
                    const total = monthly * M;
                    return { total: total, monthly: monthly, overpay: total - S };
                }
            };

            const res = calculate();

            const handleAddGoalSubmit = (e) => {
                e.preventDefault();
                const targetNum = parseInt(newGoal.target.replace(/\D/g, ''));
                if(newGoal.title && targetNum) {
                    setGoals([...goals, {
                        id: Date.now(), title: newGoal.title, current: 0, target: targetNum,
                        months: parseInt(newGoal.months) || 12,
                        icon: newGoal.icon, bg: newGoal.color.bg, color: newGoal.color.color
                    }]);
                    setShowAddGoal(false);
                }
            };

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 z-50 relative transition-colors duration-300">
                    <TopHeader 
                        title={mainTab === 'calc' ? "Калькулятор" : "Копилки"} 
                        showBack={true} 
                        onBack={onBack} 
                        rightIcon={mainTab === 'goals' ? 'fa-plus' : null} 
                        onRightClick={mainTab === 'goals' ? () => setShowAddGoal(true) : null} 
                    />
                    
                    <div className="px-5 py-2 mb-4">
                        <div className="flex bg-gray-200 dark:bg-gray-800 p-1 rounded-xl">
                            <button onClick={()=>{triggerHaptic('light'); setMainTab('calc');}} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${mainTab==='calc' ? 'bg-white dark:bg-gray-700 text-textDark dark:text-white shadow-sm' : 'text-gray-500'}`}>Калькулятор</button>
                            <button onClick={()=>{triggerHaptic('light'); setMainTab('goals');}} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${mainTab==='goals' ? 'bg-white dark:bg-gray-700 text-textDark dark:text-white shadow-sm' : 'text-gray-500'}`}>Копилки</button>
                        </div>
                    </div>

                    {mainTab === 'calc' ? (
                        <div className="animate-fade-in">
                            <div className="px-5 mb-4">
                                <div className="flex bg-gray-100 dark:bg-gray-900 p-1 rounded-xl">
                                    <button onClick={()=>{triggerHaptic(); setCalcMode('deposit');}} className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-colors ${calcMode==='deposit' ? 'bg-white dark:bg-gray-700 text-textDark dark:text-white shadow-sm' : 'text-gray-400'}`}>Вклад</button>
                                    <button onClick={()=>{triggerHaptic(); setCalcMode('credit');}} className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-colors ${calcMode==='credit' ? 'bg-white dark:bg-gray-700 text-textDark dark:text-white shadow-sm' : 'text-gray-400'}`}>Кредит</button>
                                </div>
                            </div>
                            <div className="px-5 space-y-4 mb-6">
                                <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm">
                                    <label className="text-xs font-medium text-gray-500 mb-1 block">Сумма</label>
                                    <input type="text" value={formatMoneyInput(sum)} onChange={handleSumChange} className="w-full bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 font-bold text-lg text-textDark dark:text-white focus:outline-none" />
                                </div>
                                <div className="flex gap-4">
                                    <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm flex-1">
                                        <label className="text-xs font-medium text-gray-500 mb-1 block">Процент (%)</label>
                                        <input type="number" value={percent} onChange={e=>setPercent(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 font-bold text-lg text-textDark dark:text-white focus:outline-none" />
                                    </div>
                                    <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm flex-1">
                                        <label className="text-xs font-medium text-gray-500 mb-1 block">Срок (мес)</label>
                                        <input type="number" value={months} onChange={e=>setMonths(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 font-bold text-lg text-textDark dark:text-white focus:outline-none" />
                                    </div>
                                </div>
                            </div>
                            <div className="px-5">
                                <div className={`rounded-3xl p-6 text-white shadow-lg relative overflow-hidden ${calcMode==='deposit' ? 'bg-gradient-to-br from-primary to-purple-600' : 'bg-gradient-to-br from-blue-500 to-indigo-600'}`}>
                                    <i className={`fa-solid ${calcMode==='deposit' ? 'fa-piggy-bank' : 'fa-building-columns'} absolute -right-4 -top-4 text-white opacity-10 text-7xl`}></i>
                                    <p className="text-sm text-white/80 mb-1 font-medium">{calcMode==='deposit' ? 'Итоговая сумма' : 'Общая выплата'}</p>
                                    <h2 className="text-3xl font-bold mb-6 tracking-tight">{formatMoneyStr(res.total)}</h2>
                                    
                                    <div className="flex justify-between items-end bg-white/10 rounded-2xl p-4 backdrop-blur-sm">
                                        <div>
                                            <p className="text-[11px] uppercase tracking-wider text-white/70 font-bold mb-1">{calcMode==='deposit' ? 'Прибыль' : 'Переплата'}</p>
                                            <p className={`font-bold text-sm ${calcMode==='deposit' ? 'text-emerald-300' : 'text-orange-300'}`}>
                                                {calcMode==='deposit' ? '+' : ''}{formatMoneyStr(res.profit || res.overpay)}
                                            </p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-[11px] uppercase tracking-wider text-white/70 font-bold mb-1">{calcMode==='deposit' ? 'Доход в месяц' : 'Платеж в месяц'}</p>
                                            <p className="font-bold text-sm text-white">{formatMoneyStr(res.monthly)}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="space-y-4 px-5 animate-fade-in pt-2">
                            {goals.map(g => {
                                const perc = Math.min(100, Math.round((g.current / g.target) * 100));
                                const monthly = Math.round((g.target - g.current) / (g.months || 1));
                                return (
                                    <div key={g.id} className="bg-white dark:bg-gray-900 rounded-3xl p-5 shadow-sm">
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <h4 className="font-bold text-lg text-textDark dark:text-white">{g.title}</h4>
                                                <p className="text-xs font-medium text-gray-500 mt-1">{formatMoneyStr(g.current)} / {formatMoneyStr(g.target)}</p>
                                            </div>
                                            <div className={`w-12 h-12 rounded-2xl flex items-center justify-center text-2xl ${g.bg} dark:bg-opacity-20 ${g.color}`}><i className={`fa-solid ${g.icon}`}></i></div>
                                        </div>
                                        <div className="w-full bg-gray-100 dark:bg-gray-800 rounded-full h-2 mb-3">
                                            <div className="bg-primary h-2 rounded-full transition-all duration-1000" style={{width: `${perc}%`}}></div>
                                        </div>
                                        <div className="flex justify-between items-center text-xs mb-3">
                                            <span className="font-bold text-gray-400">Прогресс: {perc}%</span>
                                            <span className="font-medium text-primary bg-primary/10 px-2 py-1 rounded">Откладывать: {formatMoneyStr(monthly)}/мес</span>
                                        </div>
                                        <div className="flex gap-2">
                                            <button className="flex-1 bg-green-50 text-green-600 dark:bg-green-900/20 font-bold py-2.5 rounded-xl text-sm" onClick={()=>{triggerHaptic(); setGoals(goals.map(goal => goal.id === g.id ? {...goal, current: goal.current + 100000} : goal))}}>+ Пополнить</button>
                                            <button className="w-12 bg-red-50 text-red-500 dark:bg-red-900/20 rounded-xl flex items-center justify-center" onClick={()=>{triggerHaptic(); setGoals(goals.filter(goal => goal.id !== g.id))}}><i className="fa-solid fa-trash"></i></button>
                                        </div>
                                    </div>
                                );
                            })}
                            {goals.length === 0 && <p className="text-center text-gray-400 mt-10">У вас пока нет копилок.</p>}
                        </div>
                    )}

                    {showAddGoal && (
                        <div className="fixed inset-0 z-[70] flex items-end">
                            <div className="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity" onClick={()=>setShowAddGoal(false)}></div>
                            <div className="bg-white dark:bg-gray-900 w-full h-[85vh] rounded-t-3xl p-6 relative z-10 animate-fade-in flex flex-col">
                                <div className="w-12 h-1.5 bg-gray-200 dark:bg-gray-800 rounded-full mx-auto mb-6"></div>
                                <h3 className="text-xl font-bold mb-6 text-textDark dark:text-white">Новая цель</h3>
                                <div className="flex-1 overflow-y-auto no-scrollbar space-y-4 pb-10">
                                    <input type="text" placeholder="Название (напр. Машина)" value={newGoal.title} onChange={e=>setNewGoal({...newGoal, title: e.target.value})} className="w-full bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 font-bold text-textDark dark:text-white focus:outline-none" />
                                    <input type="text" placeholder="Сумма цели" value={formatMoneyInput(newGoal.target)} onChange={e=>setNewGoal({...newGoal, target: e.target.value})} className="w-full bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 font-bold text-textDark dark:text-white focus:outline-none" />
                                    <input type="number" placeholder="За сколько месяцев?" value={newGoal.months} onChange={e=>setNewGoal({...newGoal, months: e.target.value})} className="w-full bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 font-bold text-textDark dark:text-white focus:outline-none" />
                                    
                                    <div>
                                        <p className="text-xs font-bold text-gray-500 mb-2 uppercase">Цвет</p>
                                        <div className="flex flex-wrap gap-3">
                                            {CATEGORY_COLORS.slice(0,10).map((c, i) => (
                                                <div key={i} onClick={() => setNewGoal({...newGoal, color: c})} className={`w-10 h-10 rounded-full cursor-pointer flex items-center justify-center transition-transform ${newGoal.color.hex === c.hex ? 'scale-110 shadow-md ring-2 ring-primary ring-offset-2 dark:ring-offset-gray-900' : ''}`} style={{backgroundColor: c.hex}}></div>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <p className="text-xs font-bold text-gray-500 mb-2 uppercase">Иконка</p>
                                        <div className="grid grid-cols-6 gap-3">
                                            {TOP_ICONS.slice(0, 30).map(ic => (
                                                <div key={ic} onClick={() => setNewGoal({...newGoal, icon: ic})} className={`aspect-square rounded-xl flex items-center justify-center text-xl cursor-pointer transition-all ${newGoal.icon === ic ? 'bg-primary text-white shadow-md scale-110' : 'bg-gray-100 dark:bg-gray-800 text-gray-500'}`}><i className={`fa-solid ${ic}`}></i></div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                <div className="pt-4 border-t border-gray-100 dark:border-gray-800 flex gap-3">
                                    <button onClick={()=>setShowAddGoal(false)} className="flex-1 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold py-4 rounded-2xl">Отмена</button>
                                    <button onClick={handleAddGoalSubmit} className="flex-1 bg-primary text-white font-bold py-4 rounded-2xl shadow-lg">Создать</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ScreenTips = ({ openAIChat }) => (
            <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 transition-colors duration-300 relative">
                <TopHeader title="Советы" rightIcon="fa-bell" />
                <div className="px-5 space-y-6 pt-4">
                    <div>
                        <h3 className="font-bold text-lg text-textDark dark:text-white mb-3">База знаний</h3>
                        <div className="space-y-3">
                            <details className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm group">
                                <summary className="font-bold text-sm text-textDark dark:text-white cursor-pointer list-none flex justify-between items-center">
                                    Что такое сложный процент? <i className="fa-solid fa-chevron-down text-gray-400 group-open:rotate-180 transition-transform"></i>
                                </summary>
                                <p className="text-sm text-gray-600 dark:text-gray-400 mt-3 leading-relaxed">Сложный процент — это когда проценты начисляются не только на первоначальную сумму вклада, но и на проценты, накопленные за прошлые периоды. Это "восьмое чудо света", которое заставляет ваш капитал расти в геометрической прогрессии.</p>
                            </details>
                            <details className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm group">
                                <summary className="font-bold text-sm text-textDark dark:text-white cursor-pointer list-none flex justify-between items-center">
                                    Финансовая подушка <i className="fa-solid fa-chevron-down text-gray-400 group-open:rotate-180 transition-transform"></i>
                                </summary>
                                <p className="text-sm text-gray-600 dark:text-gray-400 mt-3 leading-relaxed">Это запас денег на непредвиденный случай. Идеальный размер подушки — сумма ваших обязательных расходов за 3–6 месяцев. Хранить её лучше на накопительном счету.</p>
                            </details>
                            <details className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm group">
                                <summary className="font-bold text-sm text-textDark dark:text-white cursor-pointer list-none flex justify-between items-center">
                                    Как победить инфляцию? <i className="fa-solid fa-chevron-down text-gray-400 group-open:rotate-180 transition-transform"></i>
                                </summary>
                                <p className="text-sm text-gray-600 dark:text-gray-400 mt-3 leading-relaxed">Деньги "под подушкой" теряют покупательную способность. Чтобы победить инфляцию, доходность ваших вложений должна быть выше официального уровня инфляции.</p>
                            </details>
                        </div>
                    </div>

                    <div className="bg-gradient-to-r from-primary/10 to-purple-500/10 border border-primary/20 rounded-3xl p-5 relative overflow-hidden">
                        <i className="fa-solid fa-wand-magic-sparkles absolute -right-4 -bottom-4 text-primary opacity-10 text-7xl"></i>
                        <h4 className="font-bold text-textDark dark:text-white mb-2 relative z-10">Ваш личный AI-консультант</h4>
                        <p className="text-xs text-gray-600 dark:text-gray-300 leading-relaxed mb-4 relative z-10">Нейросеть проанализирует ваши расходы, найдет скрытые подписки и подскажет, как быстрее накопить на цель.</p>
                        <button onClick={openAIChat} className="bg-primary text-white font-bold py-3 px-6 rounded-xl text-sm shadow-md shadow-purple-500/30 relative z-10">Запустить чат</button>
                    </div>
                </div>

                <button onClick={openAIChat} className="fixed bottom-24 right-5 w-14 h-14 bg-gradient-to-r from-primary to-purple-600 rounded-full shadow-lg shadow-purple-500/40 flex items-center justify-center text-white text-2xl z-40 hover:scale-105 transition-transform">
                    <i className="fa-solid fa-robot"></i>
                    <span className="absolute top-0 right-0 w-3.5 h-3.5 bg-red-500 border-2 border-bgLight dark:border-bgDark rounded-full animate-pulse"></span>
                </button>
            </div>
        );

        const ScreenAIChat = ({ onBack, userId }) => {
            const [messages, setMessages] = useState([{ type: 'bot', text: 'Привет! 👋 Я ваш личный AI-консультант. Я вижу вашу базу расходов. Что вас интересует?' }]);
            const [isTyping, setIsTyping] = useState(false);
            const [inputText, setInputText] = useState('');

            const sendPrompt = async (text) => {
                if (!text.trim()) return;
                setMessages(prev => [...prev, { type: 'user', text }]);
                setInputText('');
                setIsTyping(true);
                triggerHaptic('medium');
                
                try {
                    const res = await fetch(`${API_URL}/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'x-tg-user-id': userId },
                        body: JSON.stringify({ message: text })
                    });
                    const data = await res.json();
                    triggerHaptic('light');
                    setMessages(prev => [...prev, { type: 'bot', text: data.reply || "Извините, не смог получить ответ от ИИ." }]);
                } catch (error) {
                    setMessages(prev => [...prev, { type: 'bot', text: "Серверы перегружены. Пожалуйста, попробуйте через пару минут." }]);
                } finally {
                    setIsTyping(false);
                }
            };

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen flex flex-col animate-fade-in z-50 relative transition-colors duration-300">
                    <TopHeader title="AI Чат" showBack={true} onBack={onBack} rightIcon="fa-broom" onRightClick={() => setMessages([messages[0]])} />
                    
                    <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-32 no-scrollbar">
                        {messages.map((msg, i) => (
                            <div key={i} className={`flex ${msg.type === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] rounded-2xl p-3.5 text-sm leading-relaxed ${msg.type === 'user' ? 'bg-gray-200 dark:bg-gray-800 text-textDark dark:text-white rounded-tr-sm' : 'bg-primary text-white rounded-tl-sm shadow-md shadow-purple-500/20'}`}>
                                    {msg.text.split('\n').map((line, j) => <p key={j} className="mb-1 last:mb-0">{line}</p>)}
                                </div>
                            </div>
                        ))}
                        {isTyping && (
                            <div className="flex justify-start"><div className="bg-primary text-white rounded-2xl rounded-tl-sm p-3.5 shadow-md flex items-center gap-1.5"><span className="w-1.5 h-1.5 bg-white rounded-full animate-bounce"></span><span className="w-1.5 h-1.5 bg-white rounded-full animate-bounce" style={{animationDelay:'0.2s'}}></span><span className="w-1.5 h-1.5 bg-white rounded-full animate-bounce" style={{animationDelay:'0.4s'}}></span></div></div>
                        )}
                    </div>

                    <div className="absolute bottom-0 w-full p-4 bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800">
                        {messages.length === 1 && (
                            <div className="flex gap-2 overflow-x-auto no-scrollbar mb-4 pb-1">
                                {['Где я много трачу?', 'Как накопить?', 'Проанализируй траты'].map(q => (
                                    <button key={q} onClick={() => sendPrompt(q)} className="flex-shrink-0 bg-gray-100 dark:bg-gray-800 text-primary dark:text-primaryLight text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap">{q}</button>
                                ))}
                            </div>
                        )}
                        <div className="flex items-center gap-3">
                            <input type="text" value={inputText} onChange={(e) => setInputText(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && sendPrompt(inputText)} placeholder="Сообщение ИИ..." className="flex-1 bg-gray-100 dark:bg-gray-800 text-textDark dark:text-white rounded-full px-5 py-3.5 text-sm focus:outline-none" />
                            <button onClick={() => sendPrompt(inputText)} className="w-12 h-12 bg-primary text-white rounded-full flex items-center justify-center shadow-md transform active:scale-95"><i className="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenProfile = ({ user, isDarkMode, toggleDarkMode, transactions, achievements, currencyRate, setCurrencyMode }) => {
            const userName = (user && user.first_name) ? `${user.first_name} ${user.last_name || ''}`.trim() : 'Dima';
            const username = (user && user.username) ? `@${user.username}` : '@xyzblendepro100';
            const userPhoto = (user && user.photo_url) ? user.photo_url : `https://placehold.co/150x150/7C3AED/ffffff?text=${userName.charAt(0)}`;
            const familyCode = btoa(user ? user.id.toString() : 'demo').substring(0, 8).toUpperCase();

            const handleExport = () => {
                triggerHaptic('medium');
                let csvContent = "Дата,Категория,Название,Сумма\n";
                transactions.forEach(t => csvContent += `"${t.date}","${t.category}","${t.title}",${t.amount}\n`);
                const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `Finance_Export.csv`;
                link.click();
            };

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-24 transition-colors duration-300">
                    <TopHeader title="Профиль" rightIcon="fa-gear" />
                    
                    <div className="px-5 py-6 flex items-center gap-5 bg-white dark:bg-gray-900 border-b border-gray-100 dark:border-gray-800 mb-4">
                        <img src={userPhoto} alt="Аватар" className="w-20 h-20 rounded-full border-[3px] border-primaryLight shadow-md object-cover" />
                        <div>
                            <h2 className="text-2xl font-bold text-textDark dark:text-white">{userName}</h2>
                            <p className="text-gray-500 font-medium">{username}</p>
                            <span className="inline-block mt-2 text-[10px] font-bold uppercase tracking-wider text-white bg-gradient-to-r from-yellow-400 to-orange-500 px-2 py-0.5 rounded shadow-sm">Premium</span>
                        </div>
                    </div>

                    <div className="px-5 mb-6">
                        <h3 className="font-bold text-sm text-gray-400 uppercase tracking-wider mb-3">Достижения</h3>
                        <div className="flex gap-4 overflow-x-auto no-scrollbar pb-2">
                            {achievements.map((ach, i) => (
                                <div key={i} className={`flex-shrink-0 w-24 p-3 rounded-2xl flex flex-col items-center justify-center text-center gap-2 ${ach.unlocked ? 'bg-white dark:bg-gray-900 shadow-sm border border-gray-100 dark:border-gray-800' : 'bg-gray-100 dark:bg-gray-800/50 opacity-60 grayscale'}`}>
                                    <div className={`text-3xl ${ach.unlocked ? ach.color : 'text-gray-400'}`}>{ach.icon}</div>
                                    <span className="text-[10px] font-bold text-textDark dark:text-white leading-tight">{ach.name}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="px-5 space-y-2">
                        <div className="bg-white dark:bg-gray-900 rounded-3xl p-5 shadow-sm">
                            <h3 className="font-bold text-sm text-gray-400 uppercase tracking-wider mb-4">Настройки</h3>
                            
                            <div className="flex justify-between items-center py-3 border-b border-gray-50 dark:border-gray-800">
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-full bg-blue-50 dark:bg-blue-900/30 flex items-center justify-center text-blue-500"><i className="fa-solid fa-coins text-xs"></i></div>
                                    <span className="font-medium text-sm text-textDark dark:text-white">Валюта</span>
                                </div>
                                <select value={currencyRate.name} onChange={e=>setCurrencyMode(e.target.value)} className="bg-transparent text-sm font-bold text-primary focus:outline-none dir-rtl">
                                    <option value="UZS">UZS (Сум)</option>
                                    <option value="USD">USD ($)</option>
                                    <option value="EUR">EUR (€)</option>
                                </select>
                            </div>

                            <div className="flex justify-between items-center py-3 border-b border-gray-50 dark:border-gray-800 cursor-pointer" onClick={toggleDarkMode}>
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-full bg-indigo-50 dark:bg-indigo-900/30 flex items-center justify-center text-indigo-500"><i className="fa-solid fa-moon text-xs"></i></div>
                                    <span className="font-medium text-sm text-textDark dark:text-white">Темная тема</span>
                                </div>
                                <div className={`w-12 h-6 rounded-full transition-colors relative ${isDarkMode ? 'bg-primary' : 'bg-gray-200 dark:bg-gray-700'}`}>
                                    <div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-transform ${isDarkMode ? 'left-7' : 'left-1'}`}></div>
                                </div>
                            </div>

                            <div className="flex justify-between items-center py-3 border-b border-gray-50 dark:border-gray-800 cursor-pointer" onClick={() => {document.execCommand('copy'); alert('Код скопирован!');}}>
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-full bg-purple-50 dark:bg-purple-900/30 flex items-center justify-center text-purple-500"><i className="fa-solid fa-users text-xs"></i></div>
                                    <span className="font-medium text-sm text-textDark dark:text-white">Семейный код</span>
                                </div>
                                <span className="text-xs font-mono font-bold text-gray-500 bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded">{familyCode}</span>
                            </div>

                            <div className="flex justify-between items-center py-3 cursor-pointer" onClick={handleExport}>
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-full bg-emerald-50 dark:bg-emerald-900/30 flex items-center justify-center text-emerald-500"><i className="fa-solid fa-file-csv text-xs"></i></div>
                                    <span className="font-medium text-sm text-textDark dark:text-white">Экспорт в CSV</span>
                                </div>
                                <i className="fa-solid fa-download text-gray-400 text-xs"></i>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentScreen, setCurrentScreen] = useState('home');
            const [isLoading, setIsLoading] = useState(true);
            const [transactions, setTransactions] = useState([]);
            
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('financeAppTheme') === 'dark');
            const [tgUser, setTgUser] = useState(null);
            
            const [addMethod, setAddMethod] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            const [selectedTransaction, setSelectedTransaction] = useState(null);

            const [currencyMode, setCurrencyMode] = useState('UZS');
            const [rates, setRates] = useState({ USD: 12650, EUR: 13600 });

            const [categories, setCategories] = useState([
                { name: 'Продукты', icon: 'fa-basket-shopping', bg: 'bg-orange-100', color: 'text-orange-500', isCustom: false },
                { name: 'Транспорт', icon: 'fa-bus', bg: 'bg-blue-100', color: 'text-blue-500', isCustom: false },
                { name: 'Еда вне дома', icon: 'fa-utensils', bg: 'bg-amber-100', color: 'text-amber-600', isCustom: false },
                { name: 'Развлечения', icon: 'fa-play', bg: 'bg-pink-100', color: 'text-pink-500', isCustom: false },
                { name: 'Покупки', icon: 'fa-bag-shopping', bg: 'bg-purple-100', color: 'text-purple-500', isCustom: false },
                { name: 'Здоровье', icon: 'fa-pills', bg: 'bg-green-100', color: 'text-green-500', isCustom: false }
            ]);

            const [goals, setGoals] = useState([
                { id: 1, title: 'Машина', current: 5000000, target: 150000000, months: 24, icon: 'fa-car', bg: 'bg-blue-100', color: 'text-blue-500' },
                { id: 2, title: 'Отпуск', current: 1200000, target: 10000000, months: 6, icon: 'fa-plane', bg: 'bg-indigo-100', color: 'text-indigo-500' }
            ]);

            const [amountStr, setAmountStr] = useState('');
            const [txTitle, setTxTitle] = useState('');
            const [txCat, setTxCat] = useState('Продукты');
            const [txIcon, setTxIcon] = useState(null);

            const [newCatName, setNewCatName] = useState('');
            const [newCatColor, setNewCatColor] = useState(CATEGORY_COLORS[10]);
            const [newCatIcon, setNewCatIcon] = useState(TOP_ICONS[0]);

            useEffect(() => {
                let currentUserId = 'browser_test_user';
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.expand();
                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        setTgUser(tg.initDataUnsafe.user);
                        currentUserId = tg.initDataUnsafe.user.id.toString();
                    }
                    if (tg.colorScheme === 'dark' && !localStorage.getItem('financeAppTheme')) setIsDarkMode(true);
                }

                const loadData = async () => {
                    try {
                        const [txRes, ratesRes] = await Promise.all([
                            fetch(`${API_URL}/transactions`, { headers: { 'x-tg-user-id': currentUserId } }),
                            fetch(`${API_URL}/rates`).catch(()=>({json:()=>({USD:12650, EUR:13600})}))
                        ]);
                        
                        const text = await txRes.text();
                        let txData = [];
                        if (!text.startsWith('<')) txData = JSON.parse(text);

                        if (!Array.isArray(txData) || txData.length === 0) txData = generateDemoData();
                        setTransactions(txData);

                        const rData = await ratesRes.json();
                        if(rData.USD) setRates(rData);
                    } catch (e) {
                        console.error("Load error:", e);
                        setTransactions(generateDemoData());
                    } finally {
                        setIsLoading(false);
                    }
                };
                loadData();
            }, []);

            useEffect(() => {
                if (isDarkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('financeAppTheme', 'dark'); } 
                else { document.documentElement.classList.remove('dark'); localStorage.setItem('financeAppTheme', 'light'); }
            }, [isDarkMode]);

            const getCurrencyRate = () => {
                if (currencyMode === 'USD') return { rate: 1 / rates.USD, symbol: '$', name: 'USD' };
                if (currencyMode === 'EUR') return { rate: 1 / rates.EUR, symbol: '€', name: 'EUR' };
                return { rate: 1, symbol: '', name: 'UZS' }; 
            };

            const achievements = [
                { name: 'Первый шаг', icon: '🌱', color: 'text-green-500', unlocked: transactions.length > 0 },
                { name: 'Счетовод', icon: '📝', color: 'text-blue-500', unlocked: transactions.length >= 5 },
                { name: 'Копилка', icon: '💰', color: 'text-yellow-500', unlocked: goals.some(g => g.current > 0) },
                { name: 'Скряга', icon: '🔒', color: 'text-purple-500', unlocked: transactions.filter(t=>t.category==='Развлечения').length === 0 }
            ];

            const closeAddModal = () => {
                setAddMethod(null);
                setAmountStr(''); setTxTitle(''); setTxIcon(null);
            };

            const handleAmountChange = (e) => setAmountStr(e.target.value.replace(/\D/g, ''));

            const handleAddCategory = (e) => {
                e.preventDefault();
                if(newCatName.trim()) {
                    setCategories([{ name: newCatName, icon: newCatIcon, bg: newCatColor.bg, color: newCatColor.color, isCustom: true }, ...categories]);
                    triggerHaptic('medium');
                    setTxCat(newCatName);
                    setAddMethod('expense');
                    setNewCatName('');
                }
            };

            const handleSaveTransaction = async (e) => {
                e.preventDefault();
                const num = parseInt(amountStr);
                if (!num || !txTitle) return;

                const catObj = categories.find(c => c.name === txCat) || categories[0];
                const finalIcon = txIcon || catObj.icon;
                
                const d = new Date();
                const dateString = d.getDate().toString().padStart(2, '0') + '.' + (d.getMonth() + 1).toString().padStart(2, '0') + ' ' + d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');

                const newTx = {
                    title: txTitle, category: txCat,
                    amount: addMethod === 'income' ? num : -num,
                    date: dateString, rawDate: new Date().toISOString(),
                    icon: finalIcon, color: catObj.color, bg: catObj.bg
                };

                triggerHaptic('heavy');
                setTransactions([newTx, ...transactions]);
                closeAddModal();

                const currentUserId = tgUser ? tgUser.id.toString() : 'browser_test_user';
                try {
                    await fetch(`${API_URL}/transactions`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json', 'x-tg-user-id': currentUserId },
                        body: JSON.stringify(newTx)
                    });
                } catch(e) { console.error(e); }
            };

            const handleDeleteTx = async (id) => {
                triggerHaptic('medium');
                setTransactions(transactions.filter(t => t.id !== id));
                setSelectedTransaction(null);
                const currentUserId = tgUser ? tgUser.id.toString() : 'browser_test_user';
                try {
                    await fetch(`${API_URL}/transactions/${id}`, { method: 'DELETE', headers: { 'x-tg-user-id': currentUserId } });
                } catch(e) { console.error(e); }
            };

            const simulateAI = () => {
                setIsProcessing(true);
                setTimeout(() => {
                    setIsProcessing(false);
                    setAmountStr('45000'); setTxTitle('Кофе и сэндвич'); setTxCat('Еда вне дома');
                }, 2000);
            };

            const renderScreen = () => {
                if (isLoading) return <div className="h-screen flex flex-col items-center justify-center"><div className="w-16 h-16 border-4 border-primary border-t-transparent rounded-full animate-spin"></div><p className="mt-4 text-gray-500 font-medium">Загрузка данных...</p></div>;
                const cr = getCurrencyRate();
                switch(currentScreen) {
                    case 'home': return <ScreenHome setScreen={setCurrentScreen} transactions={transactions} user={tgUser} onTransactionClick={setSelectedTransaction} currencyRate={cr} setAddMethod={setAddMethod} />;
                    case 'reports': return <ScreenReports transactions={transactions} onTransactionClick={setSelectedTransaction} currencyRate={cr} />;
                    case 'calculator': return <ScreenCalculator onBack={() => setCurrentScreen('home')} currencyRate={cr} goals={goals} setGoals={setGoals} />;
                    case 'categories': return <ScreenCategories setScreen={setCurrentScreen} categories={categories} setCategories={setCategories} currencyRate={cr} />;
                    case 'tips': return <ScreenTips openAIChat={() => setCurrentScreen('aichat')} />;
                    case 'aichat': return <ScreenAIChat onBack={() => setCurrentScreen('tips')} userId={tgUser ? tgUser.id.toString() : 'browser_test_user'} />;
                    case 'profile': return <ScreenProfile user={tgUser} isDarkMode={isDarkMode} toggleDarkMode={() => setIsDarkMode(!isDarkMode)} transactions={transactions} achievements={achievements} currencyRate={cr} setCurrencyMode={setCurrencyMode} />;
                    default: return <ScreenHome setScreen={setCurrentScreen} transactions={transactions} user={tgUser} onTransactionClick={setSelectedTransaction} currencyRate={cr} setAddMethod={setAddMethod} />;
                }
            };

            return (
                <div className="max-w-md mx-auto bg-bgLight dark:bg-bgDark min-h-screen relative shadow-2xl overflow-hidden transition-colors duration-300">
                    {renderScreen()}

                    {/* Modal: Transaction Details */}
                    {selectedTransaction && (
                        <div className="fixed inset-0 z-[60] flex items-end">
                            <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={() => setSelectedTransaction(null)}></div>
                            <div className="bg-white dark:bg-gray-900 w-full rounded-t-3xl p-6 relative z-10 animate-fade-in">
                                <div className="w-12 h-1.5 bg-gray-200 dark:bg-gray-800 rounded-full mx-auto mb-6"></div>
                                <div className="text-center mb-6">
                                    <div className={`w-20 h-20 rounded-2xl mx-auto flex items-center justify-center mb-4 ${selectedTransaction.bg} dark:bg-opacity-20 ${selectedTransaction.color} text-4xl shadow-sm`}>
                                        <i className={`fa-solid ${selectedTransaction.icon}`}></i>
                                    </div>
                                    <h3 className="text-2xl font-bold text-textDark dark:text-white mb-1">{selectedTransaction.title}</h3>
                                    <p className="text-sm font-medium text-gray-500">{selectedTransaction.category} • {selectedTransaction.date}</p>
                                    <h2 className={`text-4xl font-bold mt-5 tracking-tight ${selectedTransaction.amount > 0 ? 'text-green-500' : 'text-textDark dark:text-white'}`}>
                                        {selectedTransaction.amount > 0 ? '+' : ''}{getCurrencyRate().symbol + ' ' + Math.round(Math.abs(selectedTransaction.amount) * getCurrencyRate().rate).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ")}
                                    </h2>
                                </div>
                                <button onClick={() => handleDeleteTx(selectedTransaction.id)} className="w-full bg-red-50 text-red-500 dark:bg-red-900/20 font-bold py-3.5 rounded-2xl mb-3 transition-colors active:bg-red-100 dark:active:bg-red-900/40">Удалить операцию</button>
                                <button onClick={() => setSelectedTransaction(null)} className="w-full bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold py-3.5 rounded-2xl transition-colors active:bg-gray-200 dark:active:bg-gray-700">Закрыть</button>
                            </div>
                        </div>
                    )}

                    {/* Modal: Add Transaction/Category */}
                    {addMethod && (
                        <div className="fixed inset-0 z-[70] flex items-end">
                            <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={closeAddModal}></div>
                            <div className="bg-white dark:bg-gray-900 w-full h-[90vh] rounded-t-3xl p-5 relative z-10 animate-fade-in flex flex-col">
                                <div className="w-12 h-1.5 bg-gray-200 dark:bg-gray-800 rounded-full mx-auto mb-4"></div>
                                
                                <div className="flex bg-gray-100 dark:bg-gray-800 p-1 rounded-xl mb-5 shrink-0">
                                    <button onClick={()=>{triggerHaptic(); setAddMethod('expense');}} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${addMethod==='expense' ? 'bg-white dark:bg-gray-700 text-red-500 shadow-sm' : 'text-gray-400'}`}>Расход</button>
                                    <button onClick={()=>{triggerHaptic(); setAddMethod('income');}} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${addMethod==='income' ? 'bg-white dark:bg-gray-700 text-green-500 shadow-sm' : 'text-gray-400'}`}>Доход</button>
