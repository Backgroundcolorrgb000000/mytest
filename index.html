<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Финансы Telegram App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#7C3AED',
                        primaryLight: '#8B5CF6',
                        primaryDark: '#5B21B6',
                        bgLight: '#F3F4F6',
                        bgDark: '#030712',
                        textDark: '#111827',
                        cardDark: '#1F2937'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(124, 58, 237, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); }
        }
        .animate-pulse-ring { animation: pulse-ring 2s infinite cubic-bezier(0.66, 0, 0, 1); }

        @keyframes scanline { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
        .animate-scanline {
            position: absolute; left: 0; width: 100%; height: 2px;
            background-color: #10B981; box-shadow: 0 0 10px #10B981, 0 0 20px #10B981;
            animation: scanline 2s linear infinite;
        }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-bgLight dark:bg-bgDark transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ВАШ СЕРВЕР НА RAILWAY
        const API_URL = 'https://mytest-production-6436.up.railway.app/api';

        // --- БАЗА ПЕРЕВОДОВ (i18n) ---
        const translations = {
            ru: {
                home: 'Главная', analytics: 'Отчеты', tips: 'Советы', profile: 'Профиль',
                balance: 'Общий баланс', income: 'Доходы', expense: 'Расходы',
                btnIncome: 'Доход', btnExpense: 'Расход', btnDeposit: 'Вклад', btnGoals: 'Цели', btnCategories: 'Лимиты',
                recent: 'Последние операции', noTx: 'У вас пока нет транзакций.',
                addTitle: 'Новая операция', amount: 'Сумма', namePlace: 'Название / Место', save: 'Сохранить',
                voiceAdd: 'Голосом', scanAdd: 'Скан чека', manualAdd: 'Вручную',
                premium: 'Безлимитный ИИ, Валюты и Семейный доступ', premiumBtn: 'Получить PRO за $5'
            },
            en: {
                home: 'Home', analytics: 'Reports', tips: 'Tips', profile: 'Profile',
                balance: 'Total Balance', income: 'Income', expense: 'Expense',
                btnIncome: 'Income', btnExpense: 'Expense', btnDeposit: 'Deposit', btnGoals: 'Goals', btnCategories: 'Limits',
                recent: 'Recent Transactions', noTx: 'No transactions yet.',
                addTitle: 'New Transaction', amount: 'Amount', namePlace: 'Title / Place', save: 'Save',
                voiceAdd: 'Voice', scanAdd: 'Scan Receipt', manualAdd: 'Manual',
                premium: 'Unlimited AI, Currencies & Family Share', premiumBtn: 'Get PRO for $5'
            },
            uz: {
                home: 'Asosiy', analytics: 'Hisobot', tips: 'Maslahatlar', profile: 'Profil',
                balance: 'Umumiy balans', income: 'Kirim', expense: 'Xarajat',
                btnIncome: 'Kirim', btnExpense: 'Xarajat', btnDeposit: 'Omonat', btnGoals: 'Maqsadlar', btnCategories: 'Limitlar',
                recent: 'So\'nggi amaliyotlar', noTx: 'Hozircha tranzaksiyalar yo\'q.',
                addTitle: 'Yangi amaliyot', amount: 'Summa', namePlace: 'Nomi / Joy', save: 'Saqlash',
                voiceAdd: 'Ovozli', scanAdd: 'Chek skan', manualAdd: 'Qo\'lda',
                premium: 'Cheksiz AI, Valyutalar va Oila', premiumBtn: 'PRO olish ($5)'
            }
        };

        const TOP_ICONS = [
            'fa-basket-shopping', 'fa-utensils', 'fa-bus', 'fa-car', 'fa-gas-pump', 'fa-cart-shopping', 
            'fa-shirt', 'fa-shoe-prints', 'fa-house', 'fa-bolt', 'fa-wifi', 'fa-phone', 
            'fa-heart-pulse', 'fa-pills', 'fa-tooth', 'fa-dumbbell', 'fa-plane', 'fa-train', 
            'fa-ticket', 'fa-gamepad', 'fa-music', 'fa-film', 'fa-paw', 'fa-baby-carriage', 
            'fa-graduation-cap', 'fa-book', 'fa-gift', 'fa-scissors', 'fa-mug-hot', 'fa-wallet'
        ];

        // Вспомогательные функции
        const formatInputNumber = (val) => {
            const raw = val.toString().replace(/\D/g, '');
            return raw ? Number(raw).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") : '';
        };

        const parseFormattedNumber = (val) => parseInt(val.toString().replace(/\s/g, ''), 10) || 0;

        const generateDemoData = (userId) => {
            const txs = [];
            const now = new Date();
            const places = {
                'Продукты': ['Супермаркет Korzinka', 'Рынок Чорсу', 'Makro'],
                'Транспорт': ['Яндекс Такси', 'Метро'],
                'Еда вне дома': ['Кофейня', 'Ресторан EVOS', 'KFC'],
                'Развлечения': ['Подписка Netflix', 'Кинотеатр']
            };
            const icons = { 'Продукты': 'fa-basket-shopping', 'Транспорт': 'fa-bus', 'Еда вне дома': 'fa-utensils', 'Развлечения': 'fa-play' };
            const colors = { 'Продукты': 'text-orange-500', 'Транспорт': 'text-blue-500', 'Еда вне дома': 'text-amber-500', 'Развлечения': 'text-pink-500' };
            const bgs = { 'Продукты': 'bg-orange-100', 'Транспорт': 'bg-blue-100', 'Еда вне дома': 'bg-amber-100', 'Развлечения': 'bg-pink-100' };

            for(let i=0; i<40; i++) {
                const d = new Date(now.getTime() - Math.floor(Math.random() * 90) * 24 * 60 * 60 * 1000);
                const isIncome = Math.random() > 0.85;
                const cats = Object.keys(places);
                const cat = cats[Math.floor(Math.random() * cats.length)];
                const placeList = places[cat];
                const title = placeList[Math.floor(Math.random() * placeList.length)];
                
                let amount;
                if(isIncome) {
                    amount = (Math.floor(Math.random() * 5) + 5) * 1000000;
                } else {
                    const base = title.includes('Такси') ? 15000 : title.includes('Netflix') ? 50000 : 40000;
                    amount = -(base + (Math.floor(Math.random() * 20) * 1000));
                }

                txs.push({
                    id: Date.now() - i * 10000, userId, title,
                    category: isIncome ? 'Доход' : cat, amount,
                    icon: isIncome ? 'fa-wallet' : icons[cat],
                    color: isIncome ? 'text-green-500' : colors[cat],
                    bg: isIncome ? 'bg-green-100' : bgs[cat],
                    date: `${d.getDate().toString().padStart(2, '0')}.${(d.getMonth() + 1).toString().padStart(2, '0')} ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`,
                    rawDate: d.toISOString()
                });
            }
            return txs.sort((a,b) => new Date(b.rawDate) - new Date(a.rawDate));
        };

        const TopHeader = ({ title, showBack = false, onBack, rightIcon = null, onRightClick = null }) => (
            <div className="flex justify-between items-center px-4 py-4 bg-white dark:bg-gray-900 sticky top-0 z-10 transition-colors duration-300">
                <div className="flex items-center gap-3">
                    {showBack && (
                        <button onClick={onBack} className="text-gray-600 dark:text-gray-300 hover:text-primary transition-colors">
                            <i className="fa-solid fa-arrow-left text-lg"></i>
                        </button>
                    )}
                    <h1 className="text-xl font-bold text-textDark dark:text-white transition-colors">{title}</h1>
                </div>
                {rightIcon && (
                    <button onClick={onRightClick} className="text-gray-600 dark:text-gray-300 hover:text-primary transition-colors">
                        <i className={`fa-solid ${rightIcon} text-xl`}></i>
                    </button>
                )}
            </div>
        );

        const CustomModal = ({ isOpen, title, text, onConfirm, onCancel, confirmText = "Да", cancelText = "Отмена", isDanger = false }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white dark:bg-gray-900 rounded-3xl p-6 w-10/12 max-w-sm shadow-2xl transition-colors">
                        <h3 className="text-lg font-bold mb-2 text-center text-textDark dark:text-white">{title}</h3>
                        <p className="text-sm text-gray-500 dark:text-gray-400 mb-6 text-center">{text}</p>
                        <div className="flex gap-3">
                            <button onClick={onCancel} className="flex-1 py-3 bg-gray-100 dark:bg-gray-800 rounded-xl font-bold text-gray-600 dark:text-gray-300">Отмена</button>
                            <button onClick={onConfirm} className={`flex-1 py-3 text-white rounded-xl font-bold shadow-md ${isDanger ? 'bg-red-500' : 'bg-primary'}`}>{confirmText}</button>
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenHome = ({ setScreen, openAddModal, transactions, user, onTransactionClick, tr, formatMoney }) => {
            const userName = (user && user.first_name) ? user.first_name : 'Ильхом';
            
            const totalIncome = transactions.filter(t => t.amount > 0).reduce((acc, curr) => acc + curr.amount, 0);
            const totalExpense = transactions.filter(t => t.amount < 0).reduce((acc, curr) => acc + Math.abs(curr.amount), 0);
            const currentBalance = totalIncome - totalExpense;

            return (
                <div className="pb-24 animate-fade-in">
                    <div className="px-4 pt-4 flex justify-between items-center bg-bgLight dark:bg-bgDark transition-colors">
                        <div>
                            <p className="text-sm text-gray-500 dark:text-gray-400">Привет,</p>
                            <h2 className="text-xl font-bold text-textDark dark:text-white">{userName}</h2>
                        </div>
                        <div className="w-10 h-10 bg-white dark:bg-gray-800 rounded-full flex items-center justify-center shadow-sm text-gray-600 dark:text-gray-300 cursor-pointer" onClick={() => setScreen('profile')}>
                            <i className="fa-regular fa-bell"></i>
                        </div>
                    </div>

                    <div className="mt-4 px-4 flex gap-4 overflow-x-auto snap-x snap-mandatory no-scrollbar pb-2">
                        <div className="min-w-full snap-center bg-gradient-to-r from-primary to-purple-600 rounded-3xl p-5 text-white shadow-lg relative overflow-hidden flex-shrink-0">
                            <i className="fa-solid fa-wallet absolute -right-4 -bottom-4 text-white opacity-10 text-6xl"></i>
                            <span className="text-sm text-purple-200">{tr('balance')}</span>
                            <h2 className="text-3xl font-bold mb-4 mt-1">{formatMoney(currentBalance)}</h2>
                            <div className="flex justify-between">
                                <div><p className="text-xs text-purple-200">{tr('income')}</p><p className="font-semibold text-sm">{formatMoney(totalIncome)}</p></div>
                                <div className="text-right"><p className="text-xs text-purple-200">{tr('expense')}</p><p className="font-semibold text-sm">{formatMoney(totalExpense)}</p></div>
                            </div>
                        </div>
                        <div className="min-w-full snap-center bg-gray-900 rounded-3xl p-5 text-white shadow-lg relative overflow-hidden flex-shrink-0">
                            <span className="text-sm text-gray-400">UZCARD Зарплатная</span>
                            <h2 className="text-3xl font-bold mb-4 mt-1">{formatMoney(8400000)}</h2>
                            <p className="font-mono tracking-widest text-sm text-gray-300">**** 4512</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-5 gap-2 px-4 py-4">
                        <div className="flex flex-col items-center gap-1.5 cursor-pointer group" onClick={() => openAddModal('income')}>
                            <div className="w-12 h-12 bg-blue-100 dark:bg-blue-900/40 rounded-2xl flex items-center justify-center text-blue-500 text-lg shadow-sm"><i className="fa-solid fa-arrow-down"></i></div>
                            <span className="text-[10px] font-medium text-gray-600 dark:text-gray-400">{tr('btnIncome')}</span>
                        </div>
                        <div className="flex flex-col items-center gap-1.5 cursor-pointer group" onClick={() => openAddModal('expense')}>
                            <div className="w-12 h-12 bg-red-100 dark:bg-red-900/40 rounded-2xl flex items-center justify-center text-red-500 text-lg shadow-sm"><i className="fa-solid fa-arrow-up"></i></div>
                            <span className="text-[10px] font-medium text-gray-600 dark:text-gray-400">{tr('btnExpense')}</span>
                        </div>
                        <div className="flex flex-col items-center gap-1.5 cursor-pointer group" onClick={() => setScreen('calculator')}>
                            <div className="w-12 h-12 bg-purple-100 dark:bg-purple-900/40 rounded-2xl flex items-center justify-center text-primary text-lg shadow-sm"><i className="fa-solid fa-calculator"></i></div>
                            <span className="text-[10px] font-medium text-gray-600 dark:text-gray-400">{tr('btnDeposit')}</span>
                        </div>
                        <div className="flex flex-col items-center gap-1.5 cursor-pointer group" onClick={() => setScreen('goals')}>
                            <div className="w-12 h-12 bg-green-100 dark:bg-green-900/40 rounded-2xl flex items-center justify-center text-green-500 text-lg shadow-sm"><i className="fa-solid fa-bullseye"></i></div>
                            <span className="text-[10px] font-medium text-gray-600 dark:text-gray-400">{tr('btnGoals')}</span>
                        </div>
                        <div className="flex flex-col items-center gap-1.5 cursor-pointer group" onClick={() => setScreen('categories')}>
                            <div className="w-12 h-12 bg-amber-100 dark:bg-amber-900/40 rounded-2xl flex items-center justify-center text-amber-500 text-lg shadow-sm"><i className="fa-solid fa-icons"></i></div>
                            <span className="text-[10px] font-medium text-gray-600 dark:text-gray-400">{tr('btnCategories')}</span>
                        </div>
                    </div>

                    <div className="px-4">
                        <div className="flex justify-between items-center mb-3">
                            <h3 className="font-bold text-textDark dark:text-white">{tr('recent')}</h3>
                            <button onClick={() => setScreen('analytics')} className="text-xs font-medium text-primary">Все</button>
                        </div>
                        <div className="space-y-3">
                            {transactions.length === 0 ? (
                                <p className="text-center text-sm text-gray-400 py-4 bg-white dark:bg-gray-900 rounded-2xl border border-dashed dark:border-gray-800">{tr('noTx')}</p>
                            ) : transactions.slice(0, 5).map(t => (
                                <div key={t.id} onClick={() => onTransactionClick(t)} className="flex items-center justify-between bg-white dark:bg-gray-900 p-3.5 rounded-2xl shadow-sm cursor-pointer transition-colors">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${t.bg} dark:bg-opacity-20 ${t.color}`}>
                                            <i className={`fa-solid ${t.icon}`}></i>
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-sm text-textDark dark:text-white">{t.title}</h4>
                                            <p className="text-xs text-gray-500 dark:text-gray-400">{t.category}</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <p className={`font-bold text-sm ${t.amount > 0 ? 'text-green-500' : 'text-textDark dark:text-white'}`}>
                                            {t.amount > 0 ? '+' : ''}{formatMoney(t.amount)}
                                        </p>
                                        <p className="text-[10px] text-gray-500 dark:text-gray-400">{t.date}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenAnalytics = ({ transactions, formatMoney, tr }) => {
            const [expandedCat, setExpandedCat] = useState(null);

            const expensesByCategory = transactions.filter(t => t.amount < 0).reduce((acc, t) => {
                if (!acc[t.category]) acc[t.category] = { total: 0, txs: [], icon: t.icon, color: t.color, bg: t.bg };
                acc[t.category].total += Math.abs(t.amount);
                acc[t.category].txs.push(t);
                return acc;
            }, {});

            const totalSpent = Object.values(expensesByCategory).reduce((sum, cat) => sum + cat.total, 0);
            const sortedCats = Object.entries(expensesByCategory).sort((a, b) => b[1].total - a[1].total);

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 transition-colors">
                    <TopHeader title={tr('analytics')} rightIcon="fa-chart-pie" />
                    <div className="px-4 py-4">
                        <div className="bg-white dark:bg-gray-900 rounded-3xl p-5 shadow-sm text-center mb-6">
                            <p className="text-sm text-gray-500 dark:text-gray-400 mb-1">Всего расходов</p>
                            <h2 className="text-3xl font-bold text-textDark dark:text-white">{formatMoney(totalSpent)}</h2>
                        </div>
                        <div className="space-y-3">
                            {sortedCats.length === 0 ? (
                                <p className="text-center text-sm text-gray-400">Нет данных для анализа.</p>
                            ) : sortedCats.map(([catName, data]) => {
                                const isExp = expandedCat === catName;
                                return (
                                    <div key={catName} className="bg-white dark:bg-gray-900 rounded-2xl shadow-sm border border-gray-50 dark:border-gray-800 overflow-hidden">
                                        <div onClick={() => setExpandedCat(isExp ? null : catName)} className="p-4 flex justify-between cursor-pointer">
                                            <div className="flex items-center gap-3">
                                                <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${data.bg} dark:bg-opacity-20 ${data.color}`}>
                                                    <i className={`fa-solid ${data.icon}`}></i>
                                                </div>
                                                <div>
                                                    <h4 className="font-bold text-sm text-textDark dark:text-white">{catName}</h4>
                                                    <p className="text-xs text-gray-500">{data.txs.length} операций</p>
                                                </div>
                                            </div>
                                            <div className="text-right flex items-center gap-3">
                                                <span className="font-bold text-sm text-textDark dark:text-white">{formatMoney(data.total)}</span>
                                                <i className={`fa-solid fa-chevron-down text-gray-300 text-xs transition-transform ${isExp ? 'rotate-180' : ''}`}></i>
                                            </div>
                                        </div>
                                        {isExp && (
                                            <div className="bg-gray-50 dark:bg-gray-800/50 px-4 py-2 border-t border-gray-100 dark:border-gray-800">
                                                {data.txs.map((tx, idx) => {
                                                    const prevTx = data.txs.slice(idx + 1).find(t => t.title.toLowerCase().trim() === tx.title.toLowerCase().trim());
                                                    let variance = null;
                                                    if (prevTx) {
                                                        const diff = ((Math.abs(tx.amount) / Math.abs(prevTx.amount)) - 1) * 100;
                                                        if (diff > 0) variance = <span className="text-[10px] text-red-500 bg-red-100 dark:bg-red-900/30 px-1.5 py-0.5 rounded ml-2">↑ {diff.toFixed(0)}%</span>;
                                                        else if (diff < 0) variance = <span className="text-[10px] text-green-500 bg-green-100 dark:bg-green-900/30 px-1.5 py-0.5 rounded ml-2">↓ {Math.abs(diff).toFixed(0)}%</span>;
                                                    }
                                                    return (
                                                        <div key={tx.id} className="flex justify-between items-center py-2 border-b border-gray-200 dark:border-gray-700 last:border-0">
                                                            <div>
                                                                <p className="text-sm font-medium text-textDark dark:text-gray-200">{tx.title} {variance}</p>
                                                                <p className="text-[10px] text-gray-500">{tx.date}</p>
                                                            </div>
                                                            <span className="font-bold text-sm text-textDark dark:text-white">{formatMoney(Math.abs(tx.amount))}</span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenCategories = ({ onBack, categories, setCategories, showModal }) => {
            const [showForm, setShowForm] = useState(false);
            const [catName, setCatName] = useState('');
            const [catIcon, setCatIcon] = useState(TOP_ICONS[0]);

            const handleAdd = () => {
                if(!catName) return;
                const colors = ['text-blue-500', 'text-pink-500', 'text-emerald-500', 'text-amber-500'];
                const bgs = ['bg-blue-100', 'bg-pink-100', 'bg-emerald-100', 'bg-amber-100'];
                const rand = Math.floor(Math.random() * colors.length);
                setCategories([...categories, { name: catName, icon: catIcon, color: colors[rand], bg: bgs[rand] }]);
                setShowForm(false); setCatName('');
            };

            return (
                <div className="bg-[#F9FAFB] dark:bg-gray-950 min-h-screen animate-fade-in pb-20 transition-colors">
                    <TopHeader title="Категории" showBack={true} onBack={onBack} rightIcon={!showForm ? 'fa-plus' : null} onRightClick={() => setShowForm(true)} />
                    <div className="px-4 pt-4 space-y-3">
                        {showForm && (
                            <div className="bg-white dark:bg-gray-900 rounded-3xl p-5 shadow-sm border border-primary/20">
                                <h3 className="font-bold text-center text-textDark dark:text-white mb-4">Новая категория</h3>
                                <input type="text" placeholder="Название" value={catName} onChange={e=>setCatName(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 mb-4 focus:outline-none text-textDark dark:text-white" />
                                <div className="grid grid-cols-5 gap-2 max-h-40 overflow-y-auto no-scrollbar p-1 mb-6">
                                    {TOP_ICONS.map(ic => (
                                        <div key={ic} onClick={() => setCatIcon(ic)} className={`aspect-square rounded-2xl flex items-center justify-center text-xl cursor-pointer ${catIcon === ic ? 'bg-primary text-white scale-105' : 'bg-gray-100 dark:bg-gray-800 text-gray-500'}`}>
                                            <i className={`fa-solid ${ic}`}></i>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={()=>setShowForm(false)} className="flex-1 py-3 bg-gray-100 dark:bg-gray-800 rounded-xl font-bold text-gray-600 dark:text-gray-300">Отмена</button>

            const [messages, setMessages] = useState([{ type: 'bot', text: 'Привет! Я ваш ИИ-помощник. Чем могу помочь?' }]);
            const [isTyping, setIsTyping] = useState(false);

                if (!text.trim()) return;
                setMessages(prev => [...prev, { type: 'user', text }]);
                setInputText(''); setIsTyping(true);
                try {
                    const res = await fetch(`${API_URL}/chat`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json', 'x-tg-user-id': userId },
                        body: JSON.stringify({ message: text })
                    });
                    const data = await res.json();
                    setMessages(prev => [...prev, { type: 'bot', text: data.reply || "Сбой ИИ." }]);
                } catch (e) { setMessages(prev => [...prev, { type: 'bot', text: "Ошибка связи с сервером. Серверы Google могут быть перегружены." }]); }
                finally { setIsTyping(false); }

        const App = () => {
            const [currentScreen, setCurrentScreen] = useState('home');
            const [isAddingMode, setIsAddingMode] = useState(false);
            const [txType, setTxType] = useState('expense');
            const [isLoading, setIsLoading] = useState(true);
            const [transactions, setTransactions] = useState([]);
            const [isSplashVisible, setIsSplashVisible] = useState(true);
            const [tgUser, setTgUser] = useState(null);
            const [modalConfig, setModalConfig] = useState(null);
            
            // Новые глобальные состояния (Язык, Валюта, Премиум)
            const [lang, setLang] = useState(() => localStorage.getItem('appLang') || 'ru');
            const [currency, setCurrency] = useState(() => localStorage.getItem('appCurrency') || 'UZS');
            const [rates, setRates] = useState({ USD: 12650, EUR: 13600 });
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('financeAppTheme') === 'dark');
            const [showPremiumModal, setShowPremiumModal] = useState(false);

            // Категории
            const defaultCategories = [
                { name: 'Продукты', icon: 'fa-basket-shopping', color: 'text-orange-500', bg: 'bg-orange-100' },
                { name: 'Транспорт', icon: 'fa-bus', color: 'text-blue-500', bg: 'bg-blue-100' },
                { name: 'Еда вне дома', icon: 'fa-utensils', color: 'text-amber-600', bg: 'bg-amber-100' },
                { name: 'Развлечения', icon: 'fa-play', color: 'text-pink-500', bg: 'bg-pink-100' }
            ];
            const [categories, setCategories] = useState(() => JSON.parse(localStorage.getItem('financeAppCategories')) || defaultCategories);

            // Формы
            const [newTxAmount, setNewTxAmount] = useState('');
            const [newTxTitle, setNewTxTitle] = useState('');
            const [newTxCat, setNewTxCat] = useState(categories[0].name);
            const [newTxIcon, setNewTxIcon] = useState(TOP_ICONS[0]);

            useEffect(() => { localStorage.setItem('appLang', lang); }, [lang]);
            useEffect(() => { localStorage.setItem('appCurrency', currency); }, [currency]);
            useEffect(() => { localStorage.setItem('financeAppCategories', JSON.stringify(categories)); }, [categories]);

            const tr = (key) => translations[lang][key] || key;

            // Умный форматтер денег с учетом валюты
            const formatMoney = (num) => {
                if (num === null || num === undefined) return '0';
                let val = num;
                let symbol = 'сум';
                let prefix = '';
                
                if (currency === 'USD') { val = num / rates.USD; prefix = '$ '; symbol = ''; }
                if (currency === 'EUR') { val = num / rates.EUR; prefix = '€ '; symbol = ''; }
                
                const absVal = Math.abs(val);
                let formatted = currency === 'UZS' ? 
                    Math.round(absVal).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") : 
                    absVal.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

                return `${num < 0 ? '-' : ''}${prefix}${formatted} ${symbol}`.trim();
            };

            const getEffectiveUserId = () => tgUser ? tgUser.id.toString() : 'browser_test_user';

            useEffect(() => {
                let currentUserId = 'browser_test_user';
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.expand();
                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        setTgUser(tg.initDataUnsafe.user);
                        currentUserId = tg.initDataUnsafe.user.id.toString();
                    }
                    if (tg.colorScheme === 'dark' && !localStorage.getItem('financeAppTheme')) setIsDarkMode(true);
                }

                // Загружаем курсы валют
                fetch(`${API_URL}/rates`).then(res => res.json()).then(data => setRates(data)).catch(() => {});

                // Загружаем транзакции
                fetch(`${API_URL}/transactions`, { headers: { 'x-tg-user-id': currentUserId } })
                    .then(res => { if(!res.ok) throw new Error("API err"); return res.json(); })
                    .then(data => {
                        if (Array.isArray(data) && data.length > 0) setTransactions(data);
                        else setTransactions(generateDemoData(currentUserId));
                        setIsLoading(false);
                    })
                    .catch(() => { setTransactions(generateDemoData(currentUserId)); setIsLoading(false); });
                
                setTimeout(() => setIsSplashVisible(false), 2000);
            }, []);

            useEffect(() => {
                if (isDarkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('financeAppTheme', 'dark'); } 
                else { document.documentElement.classList.remove('dark'); localStorage.setItem('financeAppTheme', 'light'); }
            }, [isDarkMode]);

            const showModal = (title, text, onConfirm, onCancel, confirmText, cancelText, isDanger) => {
                setModalConfig({ title, text, onConfirm: () => { if(onConfirm) onConfirm(); setModalConfig(null); }, onCancel: () => { if(onCancel) onCancel(); setModalConfig(null); }, confirmText, cancelText, isDanger });
            };

            const openAddModal = (type = 'expense') => {
                setTxType(type); setNewTxCat(categories[0].name); setNewTxIcon(TOP_ICONS[0]);
                setNewTxAmount(''); setNewTxTitle(''); setIsAddingMode(true);
            };

            const handleSaveTransaction = async (e) => {
                e.preventDefault();
                let finalAmount = parseFormattedNumber(newTxAmount);
                if(finalAmount <= 0 || !newTxTitle) return;

                // Перевод обратно в UZS для базы данных если выбрана другая валюта
                if (currency === 'USD') finalAmount = finalAmount * rates.USD;
                if (currency === 'EUR') finalAmount = finalAmount * rates.EUR;

                const signedAmount = txType === 'income' ? finalAmount : -finalAmount;
                const d = new Date();
                const dateString = d.getDate().toString().padStart(2, '0') + '.' + (d.getMonth() + 1).toString().padStart(2, '0') + ' ' + d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');

                const selectedCatObj = categories.find(c => c.name === newTxCat) || { color: 'text-gray-500', bg: 'bg-gray-100' };
                const newTxPayload = {
                    title: newTxTitle, category: txType === 'income' ? 'Доход' : newTxCat, 
                    amount: signedAmount, date: dateString, rawDate: new Date().toISOString(),
                    icon: txType === 'income' ? 'fa-wallet' : newTxIcon, 
                    color: txType === 'income' ? 'text-green-500' : selectedCatObj.color, bg: txType === 'income' ? 'bg-green-100' : selectedCatObj.bg
                };

                try {
                    const res = await fetch(`${API_URL}/transactions`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-tg-user-id': getEffectiveUserId() }, body: JSON.stringify(newTxPayload) });
                    if(res.ok) { const savedTx = await res.json(); setTransactions([savedTx, ...transactions]); setIsAddingMode(false); }
                } catch (error) { setTransactions([{...newTxPayload, id: Date.now()}, ...transactions]); setIsAddingMode(false); }
            };

            const handleDeleteTransaction = async (id) => {
                try {
                    await fetch(`${API_URL}/transactions/${id}`, { method: 'DELETE', headers: { 'x-tg-user-id': getEffectiveUserId() } });
                    setTransactions(transactions.filter(t => t.id !== id));
                } catch (error) { showModal("Ошибка", "Сбой удаления", null, null, "ОК", "", false); }
            };

            const handleScan = () => {
                const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
                input.onchange = async (e) => {
                    const file = e.target.files[0]; if (!file) return;
                    setNewTxTitle("ИИ читает чек...");
                    const reader = new FileReader();
                    reader.onloadend = async () => {
                        const base64Data = reader.result.split(',')[1];
                        try {
                            const res = await fetch(`${API_URL}/scan`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-tg-user-id': getEffectiveUserId() }, body: JSON.stringify({ imageBase64: base64Data, mimeType: file.type }) });
                            const data = await res.json();
                            if(data.amount) {
                                // Если ИИ вернул сумму в UZS, а выбраны доллары, адаптируем в форме (упрощенно)
                                let displayAmt = data.amount;
                                if(currency === 'USD') displayAmt = displayAmt / rates.USD;
                                if(currency === 'EUR') displayAmt = displayAmt / rates.EUR;
                                setNewTxAmount(formatInputNumber(Math.round(displayAmt).toString()));
                            }
                            if(data.title) setNewTxTitle(data.title);
                            if(data.category) { const catExists = categories.find(c => c.name.toLowerCase() === data.category.toLowerCase()); if(catExists) setNewTxCat(catExists.name); }
                            setNewTxIcon('fa-receipt');
                        } catch (error) { setNewTxTitle("Сбой сканирования"); }
                    };
                    reader.readAsDataURL(file);
                };
                input.click();
            };

            const renderScreen = () => {
                if (isLoading) return <div className="h-screen flex items-center justify-center"><i className="fa-solid fa-circle-notch fa-spin text-4xl text-primary"></i></div>;
                switch(currentScreen) {
                    case 'home': return <ScreenHome setScreen={setCurrentScreen} openAddModal={openAddModal} transactions={transactions} user={tgUser} onTransactionClick={(t) => { showModal(t.title, `${t.category} • ${t.date}\nСумма: ${formatMoney(t.amount)}`, () => handleDeleteTransaction(t.id), null, "Удалить операцию", "Закрыть", true); }} tr={tr} formatMoney={formatMoney} />;
                    case 'analytics': return <ScreenAnalytics transactions={transactions} formatMoney={formatMoney} tr={tr} />;
                    case 'calculator': return <ScreenCalculator onBack={() => setCurrentScreen('home')} formatMoney={formatMoney} />;
                    case 'goals': return <ScreenGoals onBack={() => setCurrentScreen('home')} formatMoney={formatMoney} />;
                    case 'categories': return <ScreenCategories onBack={() => setCurrentScreen('home')} categories={categories} setCategories={setCategories} showModal={showModal} />;
                    case 'tips': return <ScreenTips openAIChat={() => setCurrentScreen('aichat')} tr={tr} />;
                    case 'aichat': return <ScreenAIChat onBack={() => setCurrentScreen('tips')} userId={getEffectiveUserId()} />;
                    case 'profile': return <ScreenProfile user={tgUser} isDarkMode={isDarkMode} toggleDarkMode={() => setIsDarkMode(!isDarkMode)} currency={currency} setCurrency={setCurrency} lang={lang} setLang={setLang} openPremium={() => setShowPremiumModal(true)} tr={tr} />;
                    default: return null;
                }
            };

            if (isSplashVisible) return (
                <div className="h-screen w-full bg-primary flex flex-col items-center justify-center text-white z-[100] relative">
                    <div className="w-24 h-24 bg-white rounded-3xl flex items-center justify-center shadow-2xl mb-6 animate-pulse"><i className="fa-solid fa-wallet text-5xl text-primary"></i></div>
                    <h1 className="text-3xl font-bold">FinanceAI</h1>
                </div>
            );

            return (
                <div className="max-w-md mx-auto bg-bgLight dark:bg-bgDark min-h-screen relative shadow-2xl overflow-hidden transition-colors duration-300">
                    {renderScreen()}

                    <CustomModal {...(modalConfig || {})} isOpen={!!modalConfig} />

                    {/* Premium Paywall Modal */}
                    {showPremiumModal && (
                        <div className="fixed inset-0 z-[100] flex items-end">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm animate-fade-in" onClick={() => setShowPremiumModal(false)}></div>
                            <div className="bg-gray-900 w-full rounded-t-3xl p-6 relative z-10 animate-fade-in shadow-2xl text-white">
                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-yellow-400 via-amber-500 to-yellow-600"></div>
                                <div className="flex justify-between items-center mb-6 pt-2">
                                    <div className="flex items-center gap-2 text-yellow-400 font-bold text-xl"><i className="fa-solid fa-crown"></i> FinanceAI PRO</div>
                                    <button onClick={() => setShowPremiumModal(false)} className="text-gray-400 hover:text-white"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>
                                <ul className="space-y-4 mb-8">
                                    <li className="flex items-center gap-3"><div className="w-8 h-8 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center"><i className="fa-solid fa-robot"></i></div><span>Безлимитные советы Gemini 2.5</span></li>
                                    <li className="flex items-center gap-3"><div className="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center"><i className="fa-solid fa-globe"></i></div><span>Мультивалютность (USD, EUR, RUB)</span></li>
                                    <li className="flex items-center gap-3"><div className="w-8 h-8 rounded-full bg-purple-500/20 text-purple-400 flex items-center justify-center"><i className="fa-solid fa-users"></i></div><span>Семейный бюджет (до 5 человек)</span></li>
                                </ul>
                                <button onClick={() => { alert("Интеграция с Telegram Stars в разработке!"); setShowPremiumModal(false); }} className="w-full bg-gradient-to-r from-yellow-500 to-amber-600 text-gray-900 font-bold py-4 rounded-2xl shadow-xl shadow-yellow-500/20 hover:scale-[1.02] transition-transform text-lg flex items-center justify-center gap-2">
                                    <i className="fa-regular fa-star"></i> {tr('premiumBtn')}
                                </button>
                            </div>
                        </div>
                    )}

                    {isAddingMode && (
                        <div className="fixed inset-0 z-[60] flex items-end">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setIsAddingMode(false)}></div>
                            <div className="bg-white dark:bg-gray-900 w-full rounded-t-3xl p-6 relative z-10 animate-fade-in max-h-[90vh] overflow-y-auto no-scrollbar shadow-2xl">
                                <div className="w-12 h-1.5 bg-gray-200 dark:bg-gray-700 rounded-full mx-auto mb-6"></div>
                                <div className="flex bg-gray-100 dark:bg-gray-800 p-1 rounded-xl mb-6">
                                    <button onClick={()=>setTxType('expense')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${txType==='expense' ? 'bg-white dark:bg-gray-700 text-textDark dark:text-white shadow-sm' : 'text-gray-400'}`}>{tr('btnExpense')}</button>
                                    <button onClick={()=>setTxType('income')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${txType==='income' ? 'bg-white dark:bg-gray-700 text-green-500 shadow-sm' : 'text-gray-400'}`}>{tr('btnIncome')}</button>
                                </div>
                                <form onSubmit={handleSaveTransaction}>
                                    <div className="space-y-4 mb-6">
                                        <div>
                                            <div className="flex justify-between ml-1">
                                                <label className="text-xs text-gray-500">{tr('amount')} ({currency})</label>
                                                {currency !== 'UZS' && <span className="text-xs font-bold text-green-500">~ {Math.round(parseFormattedNumber(newTxAmount) * (currency === 'USD' ? rates.USD : rates.EUR)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ")} сум</span>}
                                            </div>
                                            <input required type="text" inputMode="numeric" value={newTxAmount} onChange={e=>setNewTxAmount(formatInputNumber(e.target.value))} className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-4 text-2xl font-bold mt-1 text-textDark dark:text-white focus:outline-none focus:border-primary text-center tracking-wider" placeholder="0" />
                                        </div>
                                        <div>
                                            <div className="flex justify-between items-center ml-1 mb-1">
                                                <label className="text-xs text-gray-500">{tr('namePlace')}</label>
                                                <div className="flex gap-2">
                                                    <button type="button" onClick={() => { setNewTxTitle("Голосовой ввод..."); setTimeout(()=>setNewTxTitle("Такси"), 1500) }} className="w-8 h-8 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center text-xs hover:bg-blue-100"><i className="fa-solid fa-microphone"></i></button>
                                                    <button type="button" onClick={handleScan} className="w-8 h-8 bg-green-50 text-green-500 rounded-full flex items-center justify-center text-xs hover:bg-green-100"><i className="fa-solid fa-camera"></i></button>
                                                </div>
                                            </div>
                                            <input required type="text" value={newTxTitle} onChange={e=>setNewTxTitle(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 text-textDark dark:text-white focus:outline-none focus:border-primary" placeholder="..." />
                                        </div>
                                        {txType === 'expense' && (
                                            <>
                                                <div>
                                                    <label className="text-xs text-gray-500 ml-1">Категория</label>
                                                    <select value={newTxCat} onChange={e=>setNewTxCat(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 mt-1 text-textDark dark:text-white focus:outline-none focus:border-primary appearance-none font-bold">
                                                        {categories.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="text-xs text-gray-500 ml-1 mb-2 block">Иконка операции</label>
                                                    <div className="grid grid-cols-5 gap-2 max-h-40 overflow-y-auto no-scrollbar p-1">
                                                        {TOP_ICONS.map(ic => (
                                                            <div key={ic} onClick={() => setNewTxIcon(ic)} className={`aspect-square rounded-2xl flex items-center justify-center text-xl cursor-pointer transition-all ${newTxIcon === ic ? 'bg-primary text-white scale-105 shadow-md' : 'bg-gray-100 dark:bg-gray-800 text-gray-500'}`}><i className={`fa-solid ${ic}`}></i></div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                    <button type="submit" className={`w-full text-white font-bold py-4 rounded-2xl shadow-lg ${txType === 'income' ? 'bg-green-500' : 'bg-primary'}`}>{tr('save')}</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {currentScreen !== 'aichat' && currentScreen !== 'product' && currentScreen !== 'calculator' && currentScreen !== 'goals' && currentScreen !== 'categories' && (
                        <div className="fixed bottom-0 w-full max-w-md bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 px-6 py-2 flex justify-between items-center z-40 transition-colors">
                            <button onClick={() => setCurrentScreen('home')} className={`flex flex-col items-center p-2 ${currentScreen === 'home' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-solid fa-house text-xl mb-1"></i><span className="text-[10px] font-medium">{tr('home')}</span></button>
                            <button onClick={() => setCurrentScreen('analytics')} className={`flex flex-col items-center p-2 ${currentScreen === 'analytics' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-solid fa-chart-pie text-xl mb-1"></i><span className="text-[10px] font-medium">{tr('analytics')}</span></button>
                            <div className="relative -top-5"><button onClick={()=>openAddModal('expense')} className="w-14 h-14 bg-primary rounded-full flex items-center justify-center text-white text-2xl shadow-lg shadow-purple-500/30 transform hover:scale-105 transition-all"><i className="fa-solid fa-plus"></i></button></div>
                            <button onClick={() => setCurrentScreen('tips')} className={`flex flex-col items-center p-2 ${currentScreen === 'tips' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-regular fa-lightbulb text-xl mb-1"></i><span className="text-[10px] font-medium">{tr('tips')}</span></button>
                            <button onClick={() => setCurrentScreen('profile')} className={`flex flex-col items-center p-2 ${currentScreen === 'profile' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-regular fa-user text-xl mb-1"></i><span className="text-[10px] font-medium">{tr('profile')}</span></button>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
