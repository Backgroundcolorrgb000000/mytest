                const dStr = d.getDate().toString().padStart(2, '0') + '.' + (d.getMonth() + 1).toString().padStart(2, '0') + ' ' + d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');

                const payload = { title: manualTitle, category: txType === 'income' ? 'Доход' : manualCat, amount: finalAmt, date: dStr, icon: manualIcon, color: cObj.color, bg: cObj.bg, rawDate: new Date().toISOString() };
                if(txType === 'income') payload.icon = 'fa-arrow-down';
                
                const tempId = Date.now();
                setTransactions([{...payload, id: tempId}, ...transactions]);
                setIsAddingMode(false); setManualAmount(''); setManualTitle('');

                try {
                    const res = await fetch(`${API_URL}/transactions`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-tg-user-id': tgUser ? tgUser.id.toString() : 'browser_test' }, body: JSON.stringify(payload) });
                    if(res.ok) {
                        const savedTx = await res.json();
                        setTransactions(prev => prev.map(t => t.id === tempId ? savedTx : t));
                    }
                } catch(e) {}
            };

            const handleDeleteTransaction = async (id) => {
                triggerHaptic('warning');
                setTransactions(prev => prev.filter(t => t.id !== id));
                setSelectedTx(null);
                try { await fetch(`${API_URL}/transactions/${id}`, { method: 'DELETE', headers: { 'x-tg-user-id': tgUser ? tgUser.id.toString() : 'browser' }}); } catch(e){}
            };

            const renderScreen = () => {
                if (isLoading) return <div className="h-screen flex items-center justify-center text-primary"><i className="fa-solid fa-circle-notch fa-spin text-4xl"></i></div>;
                switch(currentScreen) {
                    case 'home': return <ScreenHome setScreen={(s)=>{triggerHaptic('light'); setCurrentScreen(s);}} transactions={transactions} user={tgUser} onTransactionClick={setSelectedTx} tr={tr} currency={currency} rates={rates} openAddModal={openAddModal} />;
                    case 'analytics': return <ScreenAnalytics transactions={transactions} onTransactionClick={setSelectedTx} currency={currency} rates={rates} tr={tr} />;
                    case 'calculator': return <ScreenCalculator onBack={() => {triggerHaptic('light'); setCurrentScreen('home');}} currency={currency} rates={rates} />;
                    case 'categories': return <ScreenGoals initialTab="categories" onBack={() => {triggerHaptic('light'); setCurrentScreen('home');}} currency={currency} rates={rates} categories={categories} setCategories={setCategories} />;
                    case 'goals': return <ScreenGoals initialTab="goals" onBack={() => {triggerHaptic('light'); setCurrentScreen('home');}} currency={currency} rates={rates} categories={categories} setCategories={setCategories} />;
                    case 'product': return <ScreenProduct onBack={() => {triggerHaptic('light'); setCurrentScreen('home');}} currency={currency} rates={rates} />;
                    case 'tips': return <ScreenTips openAIChat={() => {triggerHaptic('light'); setCurrentScreen('aichat');}} />;
                    case 'aichat': return <ScreenAIChat onBack={() => {triggerHaptic('light'); setCurrentScreen('tips');}} userId={tgUser ? tgUser.id.toString() : 'browser'} />;
                    case 'profile': return <ScreenProfile user={tgUser} isDarkMode={isDarkMode} toggleDarkMode={() => setIsDarkMode(!isDarkMode)} transactions={transactions} tr={tr} lang={lang} setLang={setLang} currency={currency} setCurrency={setCurrency} />;
                    default: return <ScreenHome setScreen={setCurrentScreen} transactions={transactions} user={tgUser} onTransactionClick={setSelectedTx} tr={tr} currency={currency} rates={rates} openAddModal={openAddModal} />;
                }
            };

            if (isSplashVisible) return (
                <div className="h-screen w-full bg-primary flex flex-col items-center justify-center text-white relative overflow-hidden z-[100]">
                    <div className="w-24 h-24 bg-white rounded-3xl flex items-center justify-center shadow-2xl mb-6 animate-pulse"><i className="fa-solid fa-wallet text-5xl text-primary"></i></div>
                    <h1 className="text-3xl font-bold mb-2">Finance<span className="font-light">AI</span></h1>
                </div>
            );

            return (
                <div className="max-w-md mx-auto bg-bgLight dark:bg-bgDark min-h-screen relative shadow-2xl overflow-hidden transition-colors">
                    {renderScreen()}

                    {selectedTx && (
                        <div className="fixed inset-0 z-[70] flex items-end">
                            <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={() => {triggerHaptic('light'); setSelectedTx(null);}}></div>
                            <div className="bg-white dark:bg-gray-900 w-full rounded-t-3xl p-6 relative z-10 animate-fade-in">
                                <div className="w-12 h-1.5 bg-gray-200 dark:bg-gray-800 rounded-full mx-auto mb-6"></div>
                                <div className="text-center mb-6">
                                    <div className={`w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-3 ${selectedTx.bg} dark:bg-opacity-20 ${selectedTx.color} text-2xl`}><i className={`fa-solid ${selectedTx.icon}`}></i></div>
                                    <h3 className="text-xl font-bold text-textDark dark:text-white mb-1">{selectedTx.title}</h3>
                                    <p className="text-sm text-gray-500 dark:text-gray-400">{selectedTx.category} • {selectedTx.date}</p>
                                    <h2 className={`text-3xl font-bold mt-4 ${selectedTx.amount > 0 ? 'text-green-500' : 'text-textDark dark:text-white'}`}>{selectedTx.amount > 0 ? '+' : ''}{formatMoney(selectedTx.amount, currency, rates)}</h2>
                                </div>
                                {selectedTx.category === 'Продукты' && (
                                    <button onClick={() => { triggerHaptic('light'); setSelectedTx(null); setCurrentScreen('product'); }} className="w-full bg-primary/10 text-primary font-bold py-3.5 rounded-2xl mb-3 flex justify-center items-center gap-2"><i className="fa-solid fa-chart-line"></i> Динамика цен продукта</button>
                                )}
                                <button onClick={() => handleDeleteTransaction(selectedTx.id)} className="w-full bg-red-50 text-red-500 dark:bg-red-900/20 font-bold py-3.5 rounded-2xl mb-3">Удалить операцию</button>
                                <button onClick={() => {triggerHaptic('light'); setSelectedTx(null);}} className="w-full bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold py-3.5 rounded-2xl">Закрыть</button>
                            </div>
                        </div>
                    )}

                    {isAddingMode && (
                        <div className="fixed inset-0 z-[60] flex items-end">
                            <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={()=>{triggerHaptic('light'); setIsAddingMode(false);}}></div>
                            <div className="bg-white dark:bg-gray-900 w-full rounded-t-3xl p-6 relative z-10 animate-fade-in max-h-[90vh] overflow-y-auto no-scrollbar">
                                <div className="w-12 h-1.5 bg-gray-200 dark:bg-gray-700 rounded-full mx-auto mb-6"></div>
                                
                                {addMethod === 'scan' && isProcessing && (
                                    <div className="py-6 text-center flex flex-col items-center">
                                        <div className="w-48 h-64 bg-gray-100 dark:bg-gray-800 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl relative overflow-hidden mb-6 flex items-center justify-center">
                                            <i className="fa-solid fa-receipt text-6xl text-gray-300 dark:text-gray-600"></i>
                                            <div className="animate-scanline"></div>
                                        </div>
                                        <h3 className="text-lg font-bold text-textDark dark:text-white">AI читает ваш чек...</h3>
                                    </div>
                                )}

                                {addMethod === 'scan_results' && parsedReceipt && (
                                    <div className="animate-fade-in">
                                        <div className="flex items-center gap-3 mb-4 border-b border-gray-100 dark:border-gray-800 pb-4">
                                            <div className="w-12 h-12 bg-green-100 dark:bg-green-900/30 text-green-500 rounded-xl flex items-center justify-center text-xl"><i className="fa-solid fa-check"></i></div>
                                            <div><h3 className="font-bold text-textDark dark:text-white">{parsedReceipt.storeName}</h3><p className="text-xs text-gray-500">Чек распознан</p></div>
                                        </div>
                                        <div className="space-y-3 mb-6 max-h-60 overflow-y-auto pr-2 no-scrollbar">
                                            {parsedReceipt.items.map((item) => (
                                                <div key={item.id} onClick={() => handleToggleReceiptItem(item.id)} className="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-800 rounded-xl cursor-pointer">
                                                    <div className="flex items-center gap-3">
                                                        <div className={`w-5 h-5 rounded-md border flex items-center justify-center transition-colors ${item.checked ? 'bg-primary border-primary text-white' : 'border-gray-300 dark:border-gray-600'}`}><i className="fa-solid fa-check text-[10px] opacity-100"></i></div>
                                                        <div><p className="font-medium text-sm text-textDark dark:text-white">{item.name}</p><p className="text-[10px] text-gray-500">{item.category}</p></div>
                                                    </div>
                                                    <span className="font-bold text-sm text-textDark dark:text-white">{formatMoney(item.price, currency, rates)}</span>
                                                </div>
                                            ))}
                                        </div>
                                        <button onClick={handleSaveReceipt} className="w-full bg-primary text-white font-bold py-4 rounded-2xl shadow-lg shadow-purple-500/30 hover:opacity-90">Сохранить выбранные ({parsedReceipt.items.filter(i=>i.checked).length} шт)</button>
                                    </div>
                                )}

                                {addMethod === 'voice' && (
                                    <div className="py-10 text-center flex flex-col items-center">
                                        <div className="w-20 h-20 bg-blue-100 dark:bg-blue-900/30 text-blue-500 rounded-full flex items-center justify-center text-3xl mb-6"><i className="fa-solid fa-microphone animate-pulse"></i></div>
                                        <h3 className="text-lg font-bold text-textDark dark:text-white mb-2">Слушаю...</h3>
                                        <p className="text-sm text-gray-500">Скажите: "Купил кофе за 35 тысяч"</p>
                                    </div>
                                )}

                                {(!addMethod || addMethod === 'manual') && (
                                    <form onSubmit={handleSaveTransaction}>
                                        <div className="flex bg-gray-100 dark:bg-gray-800 p-1 rounded-xl mb-4">
                                            <button type="button" onClick={()=>{triggerHaptic('light'); setTxType('expense');}} className={`flex-1 py-2 text-sm font-bold rounded-lg ${txType==='expense' ? 'bg-white dark:bg-gray-700 text-textDark dark:text-white shadow-sm' : 'text-gray-400'}`}>Расход</button>
                                            <button type="button" onClick={()=>{triggerHaptic('light'); setTxType('income');}} className={`flex-1 py-2 text-sm font-bold rounded-lg ${txType==='income' ? 'bg-white dark:bg-gray-700 text-green-500 shadow-sm' : 'text-gray-400'}`}>Доход</button>
                                            <button type="button" onClick={()=>{triggerHaptic('light'); setTxType('category');}} className={`flex-1 py-2 text-sm font-bold rounded-lg ${txType==='category' ? 'bg-white dark:bg-gray-700 text-blue-500 shadow-sm' : 'text-gray-400'}`}>Категория</button>
                                        </div>

                                        {txType !== 'category' ? (
                                            <div className="space-y-4 mb-6">
                                                <div>
                                                    <label className="text-xs text-gray-500 ml-1">Сумма ({currency})</label>
                                                    <input required type="text" value={manualAmount} onChange={e=>setManualAmount(formatInputNumber(e.target.value))} className="w-full bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 text-lg font-bold mt-1 text-textDark dark:text-white outline-none" placeholder="0" />
                                                </div>
                                                <div>
                                                    <label className="text-xs text-gray-500 ml-1">Название</label>
                                                    <div className="flex gap-2">
                                                        <input required type="text" value={manualTitle} onChange={e=>setManualTitle(e.target.value)} className="flex-1 bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 mt-1 font-bold text-textDark dark:text-white outline-none" placeholder="Например: Супермаркет" />
                                                        <button type="button" onClick={() => simulateAIProcessing('voice')} className="w-12 h-12 mt-1 bg-blue-50 dark:bg-blue-900/30 text-blue-500 rounded-xl flex items-center justify-center flex-shrink-0"><i className="fa-solid fa-microphone"></i></button>
                                                        <button type="button" onClick={() => simulateAIProcessing('scan')} className="w-12 h-12 mt-1 bg-green-50 dark:bg-green-900/30 text-green-500 rounded-xl flex items-center justify-center flex-shrink-0 relative">
                                                            <i className="fa-solid fa-receipt"></i>
                                                            <input type="file" accept="image/*" capture="environment" ref={fileInputRef} onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer" />
                                                        </button>
                                                    </div>
                                                </div>
                                                {txType === 'expense' && (
                                                    <div>
                                                        <label className="text-xs text-gray-500 ml-1">Категория</label>
                                                        <select value={manualCat} onChange={e=>{triggerHaptic('light'); setManualCat(e.target.value);}} className="w-full bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 mt-1 font-bold text-textDark dark:text-white outline-none appearance-none">
                                                            {categories.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
                                                        </select>
                                                    </div>
                                                )}
                                                <div>
                                                    <label className="text-xs text-gray-500 ml-1 block mb-2">Иконка</label>
                                                    <div className="grid grid-cols-6 gap-2 max-h-40 overflow-y-auto no-scrollbar pb-2">
                                                        {TOP_ICONS.map(ic => (
                                                            <div key={ic} onClick={()=>{triggerHaptic('light'); setManualIcon(ic);}} className={`aspect-square rounded-2xl flex items-center justify-center text-xl cursor-pointer ${manualIcon === ic ? 'bg-primary text-white scale-105 shadow-md' : 'bg-gray-100 dark:bg-gray-800 text-gray-500'}`}><i className={`fa-solid ${ic}`}></i></div>
                                                        ))}
                                                    </div>
                                                </div>
                                                <button type="submit" className="w-full bg-primary text-white font-bold py-4 rounded-2xl shadow-lg">Сохранить</button>
                                            </div>
                                        ) : (
                                            <div className="space-y-4 mb-6 text-center text-gray-500 py-10">
                                                Управление категориями теперь находится во вкладке "Категории" на главном экране!
                                            </div>
                                        )}
                                    </form>
                                )}
                            </div>
                        </div>
                    )}

                    {currentScreen !== 'aichat' && currentScreen !== 'product' && currentScreen !== 'calculator' && currentScreen !== 'categories' && currentScreen !== 'goals' && (
                        <div className="fixed bottom-0 w-full max-w-md bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 px-6 py-2 flex justify-between items-center z-40">
                            <button onClick={() => {triggerHaptic('light'); setCurrentScreen('home');}} className={`flex flex-col items-center p-2 ${currentScreen === 'home' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-solid fa-house text-xl mb-1"></i><span className="text-[10px] font-medium">Главная</span></button>
                            <button onClick={() => {triggerHaptic('light'); setCurrentScreen('analytics');}} className={`flex flex-col items-center p-2 ${currentScreen === 'analytics' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-solid fa-chart-pie text-xl mb-1"></i><span className="text-[10px] font-medium">Отчеты</span></button>
                            <div className="relative -top-5"><button onClick={()=>{triggerHaptic('medium'); setIsAddingMode(true); setAddMethod(null);}} className="w-14 h-14 bg-primary rounded-full flex items-center justify-center text-white text-2xl shadow-lg shadow-purple-500/40 transform hover:scale-105 transition-all"><i className="fa-solid fa-plus"></i></button></div>
                            <button onClick={() => {triggerHaptic('light'); setCurrentScreen('tips');}} className={`flex flex-col items-center p-2 ${currentScreen === 'tips' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-regular fa-lightbulb text-xl mb-1"></i><span className="text-[10px] font-medium">Советы</span></button>
                            <button onClick={() => {triggerHaptic('light'); setCurrentScreen('profile');}} className={`flex flex-col items-center p-2 ${currentScreen === 'profile' ? 'text-primary' : 'text-gray-400'}`}><i className="fa-regular fa-user text-xl mb-1"></i><span className="text-[10px] font-medium">Профиль</span></button>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
